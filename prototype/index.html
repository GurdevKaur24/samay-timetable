const ROOM_TYPE = { lecture: 'Lecture hall', classroom: 'Classroom', computer_lab: 'Computer lab', electronics_lab: 'Electronics lab', science_lab: 'Science lab' };
const KIND = {
  theory: { label: 'Lecture', cls: 'bg-sky-50 border-sky-200 text-sky-950', dot: 'bg-sky-400' },
  tutorial: { label: 'Tutorial', cls: 'bg-amber-50 border-amber-200 text-amber-950', dot: 'bg-amber-400' },

};

/* ------------------------------ helpers ------------------------------ */
const typeName = t => ROOM_TYPE[t] || t;
const key = (...k) => k.join('|');
const rotate = (arr, n) => arr.map((_, i) => arr[(i + n) % arr.length]);

function idx(c) {
  if (c._ix) return c._ix;
  const groups = {}, subsOf = {};
  c.sections.forEach(s => {
    groups[s.id] = { id: s.id, section: s.id, label: s.id, strength: s.strength, isSub: false };
    subsOf[s.id] = [];
    (s.subs || []).forEach(u => {
      const id = `${s.id}/${u.label}`;
      groups[id] = { id, section: s.id, label: u.label, strength: u.strength, isSub: true };
      subsOf[s.id].push(id);
    });
  });
  c._ix = {
    groups, subsOf,
    teachers: Object.fromEntries(c.teachers.map(t => [t.id, t])),
    rooms: Object.fromEntries(c.rooms.map(r => [r.id, r])),
    P: c.scheme.periods.map((_, i) => i + 1),
    breaksAfter: new Map(c.scheme.breaks.map(b => [b.after, b])),
  };
  return c._ix;
}
// Periods a week: the assignment's own number, else the subject's, else the college rule.
function weekly(c, subjectId, override) {
  const s = c.subjects[subjectId], R = c.scheme.rules;
  if (override != null) return override;
  if (s.perWeek != null) return s.perWeek;
  return s.kind === 'lab' ? R.labSessionsPerWeek * c.scheme.labBlock : R.lecturesPerWeek;
}
function A(c) { return c._A || (c._A = c.assignments.map((a, i) => ({ i, subject: a[0], group: a[1], teacher: a[2], periods: weekly(c, a[0], a[3]) }))); }
const subj = (c, a) => c.subjects[a.subject];
const blockOf = (c, a) => subj(c, a).kind === 'lab' ? c.scheme.labBlock : 1;
const roomTypeOf = (c, a) => subj(c, a).room || c.scheme.theoryRoomType;
const gLabel = (c, g) => { const G = idx(c).groups[g]; return G.isSub ? `${G.section} ${G.label}` : g; };
const pLabel = (c, p) => c.scheme.periods[p - 1][0];
const desc = (c, e) => { const a = A(c)[e.a]; return `${gLabel(c, a.group)} ${subj(c, a).short}`; };
const tMax = (c, t) => t.max || c.scheme.rules.teacherMaxPerDay;
function fmtOff(off) {
  const byDay = {};
  off.forEach(([d, p]) => (byDay[d] ||= []).push(p));
  return Object.entries(byDay).map(([d, ps]) => `${d} P${Math.min(...ps)}${ps.length > 1 ? '–P' + Math.max(...ps) : ''}`).join(', ');
}

/* ----------------------------------------------------------------------
   In-browser demo generator (greedy). The real app runs Google OR-Tools
   CP-SAT on the server; this keeps the prototype a single file.
----------------------------------------------------------------------- */
function generate(c) {
  const ix = idx(c), S = c.scheme, days = S.days, P = ix.P;
  const AS = A(c);
  const busy = new Set(), entries = [], tLoad = {}, usedDay = new Set(), dayLoad = {}, unplaced = [];
  const roomsFor = a => c.rooms.filter(r => r.type === roomTypeOf(c, a) && r.cap >= ix.groups[a.group].strength);

  function groupFree(g, d, p) {
    const G = ix.groups[g];
    if (busy.has(key('g', G.section, d, p))) return false;
    return G.isSub ? !busy.has(key('g', g, d, p)) : !ix.subsOf[g].some(s => busy.has(key('g', s, d, p)));
  }
  function can(a, d, s, r) {
    const b = blockOf(c, a), T = ix.teachers[a.teacher];
    if (s + b - 1 > P.length) return false;
    for (let q = s; q < s + b - 1; q++) if (ix.breaksAfter.has(q)) return false;
    if (usedDay.has(key(a.i, d))) return false;
    if ((tLoad[key(a.teacher, d)] || 0) + b > tMax(c, T)) return false;
    for (let p = s; p < s + b; p++) {
      if ((T.off || []).some(([od, op]) => od === d && op === p)) return false;
      if (busy.has(key('t', a.teacher, d, p)) || busy.has(key('r', r.id, d, p)) || !groupFree(a.group, d, p)) return false;
    }
    return true;
  }
  function put(a, d, s, r) {
    const b = blockOf(c, a), sec = ix.groups[a.group].section, placed = [];
    for (let p = s; p < s + b; p++) {
      busy.add(key('t', a.teacher, d, p)); busy.add(key('r', r.id, d, p)); busy.add(key('g', a.group, d, p));
      const e = { a: a.i, day: d, period: p, room: r.id };
      entries.push(e); placed.push(e);
    }
    tLoad[key(a.teacher, d)] = (tLoad[key(a.teacher, d)] || 0) + b;
    dayLoad[key(sec, d)] = (dayLoad[key(sec, d)] || 0) + b;
    usedDay.add(key(a.i, d));
    return { a, d, s, r, placed };
  }
  function undo(m) {
    const { a, d, s, r, placed } = m, b = blockOf(c, a), sec = ix.groups[a.group].section;
    for (let p = s; p < s + b; p++) { busy.delete(key('t', a.teacher, d, p)); busy.delete(key('r', r.id, d, p)); busy.delete(key('g', a.group, d, p)); }
    placed.forEach(e => entries.splice(entries.indexOf(e), 1));
    tLoad[key(a.teacher, d)] -= b; dayLoad[key(sec, d)] -= b; usedDay.delete(key(a.i, d));
  }

  const remaining = new Map(AS.map(a => [a.i, a.periods / blockOf(c, a)]));

  // 1) Labs: lab groups of a section go to different labs at the same time (rotation A1→Lab X, A2→Lab Y …).
  c.sections.forEach((sec, si) => {
    const subs = ix.subsOf[sec.id];
    if (!subs.length) return;
    const labs = subs.map(g => AS.filter(a => a.group === g && subj(c, a).kind === 'lab'));
    const rounds = Math.max(0, ...labs.map(l => l.length));
    for (let k = 0; k < rounds; k++) {
      const items = labs.map((l, i) => l.length ? l[(i + k) % l.length] : null).filter(a => a && remaining.get(a.i) > 0);
      let done = false;
      for (const d of rotate(days, (si * 2 + k * 2) % days.length)) {
        for (const s of rotate(P, (si + k) % P.length)) {
          const moves = [];
          let ok = true;
          for (const a of items) {
            const r = roomsFor(a).find(r => can(a, d, s, r));
            if (!r) { ok = false; break; }
            moves.push(put(a, d, s, r));
          }
          if (ok) { items.forEach(a => remaining.set(a.i, remaining.get(a.i) - 1)); done = true; break; }
          moves.reverse().forEach(undo);
        }
        if (done) break;
      }
    }
  });

  // 2) Everything left (lectures, tutorials, any lab that couldn't pair): least-busy day first, morning first.
  const order = AS.filter(a => remaining.get(a.i) > 0).sort((x, y) => blockOf(c, y) - blockOf(c, x) || y.periods - x.periods);
  for (const a of order) {
    const sec = ix.groups[a.group].section;
    for (let left = remaining.get(a.i); left > 0; left--) {
      const ds = [...days].sort((d1, d2) => (dayLoad[key(sec, d1)] || 0) - (dayLoad[key(sec, d2)] || 0) || days.indexOf(d1) - days.indexOf(d2));
      let placed = false;
      for (const d of ds) {
        for (const s of P) {
          const r = roomsFor(a).find(r => can(a, d, s, r));
          if (r) { put(a, d, s, r); placed = true; break; }
        }
        if (placed) break;
      }
      if (!placed) { unplaced.push(a); break; }
    }
  }
  return { entries, unplaced, at: new Date() };
}

/* ------------------- independent validator (hard rules) ------------------- */
function validate(c, entries) {
  const ix = idx(c), AS = A(c), messages = [], bad = new Set(), pairs = [];
  const group = fn => { const m = new Map(); entries.forEach((e, i) => { if (e.ghost) return; const k = fn(e); (m.get(k) || m.set(k, []).get(k)).push(i); }); return m; };
  const slot = e => `${e.day} ${pLabel(c, e.period)}`;
  const flag = (list, text) => { list.forEach(i => bad.add(i)); messages.push(text); pairs.push(list); };

  group(e => key(AS[e.a].teacher, e.day, e.period)).forEach(list => {
    if (list.length > 1) flag(list, `${ix.teachers[AS[entries[list[0]].a].teacher].name} is booked twice on ${slot(entries[list[0]])}: ${list.map(i => desc(c, entries[i])).join(' and ')}.`);
  });
  group(e => key(e.room, e.day, e.period)).forEach(list => {
    if (list.length > 1) flag(list, `${entries[list[0]].room} is double-booked on ${slot(entries[list[0]])}: ${list.map(i => desc(c, entries[i])).join(' and ')}.`);
  });
  group(e => key(ix.groups[AS[e.a].group].section, e.day, e.period)).forEach(list => {
    const whole = list.filter(i => !ix.groups[AS[entries[i].a].group].isSub);
    const subs = list.filter(i => ix.groups[AS[entries[i].a].group].isSub);
    const perSub = {};
    subs.forEach(i => (perSub[AS[entries[i].a].group] ||= []).push(i));
    if (whole.length > 1 || (whole.length && subs.length) || Object.values(perSub).some(l => l.length > 1))
      flag(list, `${ix.groups[AS[entries[list[0]].a].group].section} has overlapping classes on ${slot(entries[list[0]])}: ${list.map(i => desc(c, entries[i])).join(' and ')}.`);
  });
  const count = {};
  entries.forEach(e => { if (!e.ghost) count[e.a] = (count[e.a] || 0) + 1; });
  AS.forEach(a => { if ((count[a.i] || 0) !== a.periods) messages.push(`${gLabel(c, a.group)} ${subj(c, a).short} has ${count[a.i] || 0} of ${a.periods} periods.`); });
  return { messages, bad, pairs };
}

/* ------------------------------ scorecard ------------------------------ */
function metrics(c, entries) {
  const ix = idx(c), units = {}, subBusy = {}, load = {};
  entries.forEach(e => {
    const a = A(c)[e.a], G = ix.groups[a.group];
    const targets = G.isSub ? [G.id] : (ix.subsOf[G.section].length ? ix.subsOf[G.section] : [G.section]);
    targets.forEach(t => (units[key(t, e.day)] ||= new Set()).add(e.period));
    if (G.isSub) (subBusy[key(G.section, e.day, e.period)] ||= new Set()).add(G.id);
    load[a.teacher] = (load[a.teacher] || 0) + 1;
  });
  let lab = 0, par = 0;
  Object.entries(subBusy).forEach(([k, s]) => { lab++; if (s.size === ix.subsOf[k.split('|')[0]].length) par++; });
  const gaps = Object.values(units).map(s => { const a = [...s]; return Math.max(...a) - Math.min(...a) + 1 - a.length; });
  const avg = gaps.length ? gaps.reduce((x, y) => x + y, 0) / gaps.length : 0;
  const parPct = lab ? 100 * par / lab : 100;
  const last = entries.filter(e => e.period === ix.P.length).length;
  const L = Object.values(load);
  const used = new Set(entries.map(e => key(e.room, e.day, e.period))).size;
  return {
    score: Math.max(0, Math.min(100, Math.round(100 - 15 * avg - 0.3 * (100 - parPct) - 0.5 * last))),
    avg: avg.toFixed(2), parPct: Math.round(parPct), last,
    lmin: L.length ? Math.min(...L) : 0, lmax: L.length ? Math.max(...L) : 0,
    classes: entries.length, required: A(c).reduce((s, a) => s + a.periods, 0),
    roomUse: Math.round(100 * used / (c.rooms.length * c.scheme.days.length * ix.P.length)),
  };
}

/* ------------------------------ pre-check ------------------------------ */
function precheck(c) {
  const ix = idx(c), S = c.scheme, slots = S.days.length * ix.P.length, out = [];
  const tl = {};
  A(c).forEach(a => tl[a.teacher] = (tl[a.teacher] || 0) + a.periods);
  c.teachers.forEach(t => {
    const cap = tMax(c, t) * S.days.length - (t.off || []).length, l = tl[t.id] || 0;
    if (l > cap) out.push({ level: 'error', text: `${t.name} has ${l} periods a week but can teach at most ${cap}.`, fix: 'Teachers' });
    else if (l > 0.6 * cap) out.push({ level: 'warn', text: `${t.name} has a heavy load: ${l} of a possible ${cap} periods a week.`, fix: 'Teachers' });
  });
  c.sections.forEach(s => {
    const whole = A(c).filter(a => a.group === s.id).reduce((x, a) => x + a.periods, 0);
    const subs = ix.subsOf[s.id].map(g => A(c).filter(a => a.group === g).reduce((x, a) => x + a.periods, 0));
    const need = whole + (subs.length ? Math.max(...subs) : 0);
    out.push(need > slots
      ? { level: 'error', text: `${s.id} needs ${need} periods but the week has only ${slots}.`, fix: 'Sections' }
      : { level: 'ok', text: `${s.id}: ${need} of ${slots} weekly periods needed.` });
  });
  const demand = {};
  A(c).forEach(a => demand[roomTypeOf(c, a)] = (demand[roomTypeOf(c, a)] || 0) + a.periods);
  Object.entries(demand).forEach(([t, d]) => {
    const cap = c.rooms.filter(r => r.type === t).length * slots;
    out.push(d > cap
      ? { level: 'error', text: `${typeName(t)}s are needed for ${d} periods but only ${cap} are available.`, fix: 'Rooms' }
      : { level: 'ok', text: `${typeName(t)}s: ${d} of ${cap} room-periods needed (${Math.round(100 * d / cap)}%).` });
  });
  A(c).forEach(a => {
    const G = ix.groups[a.group];
    if (!c.rooms.some(r => r.type === roomTypeOf(c, a) && r.cap >= G.strength))
      out.push({ level: 'error', text: `No ${typeName(roomTypeOf(c, a)).toLowerCase()} is big enough for ${gLabel(c, a.group)} (${G.strength} students).`, fix: 'Rooms' });
  });
  c.teachers.filter(t => (t.off || []).length).forEach(t =>
    out.push({ level: 'info', text: `${t.name} is unavailable on ${fmtOff(t.off)}. Classes won't be placed there.` }));
  const rank = { error: 0, warn: 1, info: 2, ok: 3 };
  return out.sort((x, y) => rank[x.level] - rank[y.level]);
}

/* ------------------------------ app state ------------------------------ */
const state = {
  ci: 0, page: 'dashboard', view: 'section', key: null,
  gen: {}, drawer: false, preview: null, history: [], applied: null, sim: null, generating: null, toast: null,
};
const col = () => COLLEGES[state.ci];
const current = () => state.gen[col().id];

function displayEntries() {
  const g = current();
  if (!g) return [];
  const list = g.entries.map((e, i) => ({ ...e, i }));
  const pv = state.preview;
  if (!pv) return list;
  list[pv.ei] = { ...list[pv.ei], day: pv.day, period: pv.period, room: pv.room, preview: true };
  list.push({ ...g.entries[pv.ei], i: pv.ei, ghost: true });
  return list;
}

function freeSlots(c, entries, ei, limit) {
  const ix = idx(c), a = A(c)[entries[ei].a], T = ix.teachers[a.teacher], G = ix.groups[a.group];
  const busyT = new Set(), busyR = new Set(), busyG = new Set(), daysUsed = new Set(), load = {};
  entries.forEach((e, j) => {
    if (j === ei) return;
    const b = A(c)[e.a], k = key(e.day, e.period), g = ix.groups[b.group];
    if (b.teacher === a.teacher) { busyT.add(k); load[e.day] = (load[e.day] || 0) + 1; }
    busyR.add(key(e.room, k));
    if (g.section === G.section) busyG.add(key(g.isSub ? g.id : '*', k));
    if (b.i === a.i) daysUsed.add(e.day);
  });
  const rooms = c.rooms.filter(r => r.type === roomTypeOf(c, a) && r.cap >= G.strength);
  const out = [];
  for (const d of c.scheme.days) {
    if (daysUsed.has(d) || (load[d] || 0) + 1 > tMax(c, T)) continue;
    for (const p of ix.P) {
      const k = key(d, p);
      if (busyT.has(k) || (T.off || []).some(([od, op]) => od === d && op === p)) continue;
      const gBusy = busyG.has(key('*', k)) || (G.isSub ? busyG.has(key(G.id, k)) : ix.subsOf[G.section].some(s => busyG.has(key(s, k))));
      if (gBusy) continue;
      const r = rooms.find(r => !busyR.has(key(r.id, k)));
      if (!r) continue;
      out.push({ day: d, period: p, room: r.id });
      if (out.length >= limit) return out;
    }
  }
  return out;
}

function render() { document.getElementById('app').innerHTML = layout(); }
function go(page) { state.page = page; render(); window.scrollTo(0, 0); }
function setCollege(i) {
  state.ci = +i; state.key = null; state.preview = null; state.history = []; state.applied = null; state.sim = null;
  render(); toast(`Switched to ${col().name}. Its own data and scheme are loaded.`);
}
function setView(v) { state.view = v; state.key = null; render(); }
function setKey(k) { state.key = k; render(); }
function toggleDrawer(open) { state.drawer = open ?? !state.drawer; render(); }
function toast(text) {
  state.toast = text; render();
  clearTimeout(window._tt); window._tt = setTimeout(() => { state.toast = null; render(); }, 3200);
}
function runGenerate() {
  const steps = ['Checking data and rules', 'Placing labs side by side', 'Placing lectures and tutorials', 'Verifying: no clashes'];
  state.generating = 0; render();
  const timer = setInterval(() => {
    state.generating++;
    if (state.generating >= steps.length) {
      clearInterval(timer);
      state.gen[col().id] = generate(col());
      state.generating = null; state.preview = null; state.history = []; state.applied = null; state.sim = null;
      state.page = 'timetable';
      const v = validate(col(), current().entries);
      render();
      toast(v.messages.length ? `Generated with ${v.messages.length} issue(s) to review.` : 'Timetable generated and verified: 0 conflicts.');
    } else render();
  }, 450);
  window._steps = steps;
}
function simulateClash() {
  const c = col(), g = current();
  if (!g) return;
  const ix = idx(c), E = g.entries;
  for (let i = 0; i < E.length; i++) {
    const a = A(c)[E[i].a];
    if (blockOf(c, a) !== 1 || ix.groups[a.group].isSub) continue;
    for (const o of E) {
      const b = A(c)[o.a];
      if (b.teacher !== a.teacher || b.group === a.group) continue;
      const at = e => e.day === o.day && e.period === o.period;
      const groupBusy = E.some(e => at(e) && ix.groups[A(c)[e.a].group].section === ix.groups[a.group].section);
      const sameDay = E.some((e, j) => j !== i && e.a === E[i].a && e.day === o.day);
      const room = c.rooms.find(r => r.type === roomTypeOf(c, a) && r.cap >= ix.groups[a.group].strength && !E.some(e => at(e) && e.room === r.id));
      if (groupBusy || sameDay || !room) continue;
      state.sim = { ei: i };
      E[i] = { ...E[i], day: o.day, period: o.period, room: room.id };
      Object.assign(state, { view: 'section', key: a.group, page: 'timetable', drawer: true, preview: null, applied: null });
      render();
      toast('A clash was added on purpose, to show how the assistant helps.');
      return;
    }
  }
}
function previewOption(day, period, room, ei) { state.preview = { ei, day, period: +period, room }; state.applied = null; render(); }
function discardPreview() { state.preview = null; render(); }
function applyPreview() {
  const g = current(), pv = state.preview;
  if (!g || !pv) return;
  const before = g.entries[pv.ei];
  state.history.push({ ei: pv.ei, from: { ...before } });
  g.entries[pv.ei] = { ...before, day: pv.day, period: pv.period, room: pv.room };
  state.applied = `${desc(col(), g.entries[pv.ei])} moved to ${pv.day} ${pLabel(col(), pv.period)} in ${pv.room}.`;
  state.preview = null; state.sim = null;
  render(); toast('Change applied. You can undo it from the assistant.');
}
function undoLast() {
  const g = current(), h = g && state.history.pop();
  if (!h) return;
  g.entries[h.ei] = h.from; state.applied = null;
  render(); toast('Change undone.');
}

function timetable() {

  if (!state.key || !options.some(o => o[0] === state.key)) state.key = options[0][0];
  const entries = displayEntries();
  const v = validate(c, entries.filter(e => !e.ghost));
  const base = validate(c, g.entries);
  const m = metrics(c, g.entries);
  const title = state.view === 'section' ? state.key : state.view === 'teacher' ? ix.teachers[state.key].name : `${state.key} (${typeName(ix.rooms[state.key].type)})`;

  else if (!base.messages.length) badge = `<span class="inline-flex items-center gap-1.5 rounded-full bg-emerald-50 px-3 py-1 text-sm font-medium text-emerald-700">${icon('check', 'w-4 h-4')}0 conflicts · verified</span>`;
  else badge = `<button onclick="toggleDrawer(true)" class="inline-flex items-center gap-1.5 rounded-full bg-red-50 px-3 py-1 text-sm font-medium text-red-700 hover:bg-red-100">${base.messages.length} conflict${base.messages.length > 1 ? 's' : ''} · fix with assistant</button>`;

  return `
  <div class="print-only mb-3">
    <div class="text-lg font-semibold">${c.name} · ${title}</div>

  </div>
  <div class="no-print mb-4 flex flex-wrap items-center justify-between gap-3">
    <div class="flex items-center gap-3"><h1 class="text-2xl font-semibold tracking-tight">${title}</h1>${badge}</div>
    <div class="flex flex-wrap gap-2">
      ${btn('Simulate a clash', 'simulateClash()', 'secondary')}
      ${btn('Assistant', 'toggleDrawer(true)', 'secondary', 'bot')}
      ${btn('Print or save PDF', 'window.print()', 'secondary', 'printer')}
    </div>
  </div>
  <div class="no-print mb-4 flex flex-wrap items-center gap-3">
    <div class="inline-flex rounded-lg border border-slate-200 bg-white p-0.5">
      ${[['section', 'Section'], ['teacher', 'Teacher'], ['room', 'Room']].map(([id, l]) => `<button onclick="setView('${id}')" class="rounded-md px-3 py-1.5 text-sm ${state.view === id ? 'bg-indigo-600 font-medium text-white' : 'text-slate-600 hover:bg-slate-50'}">${l}</button>`).join('')}
    </div>
    <select onchange="setKey(this.value)" class="rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
      ${options.map(([id, l]) => `<option value="${id}" ${id === state.key ? 'selected' : ''}>${l}</option>`).join('')}
    </select>
    <div class="ml-auto flex flex-wrap items-center gap-3 text-xs text-slate-600">
      ${Object.values(KIND).map(k => `<span class="inline-flex items-center gap-1.5"><span class="h-2.5 w-2.5 rounded-sm ${k.dot}"></span>${k.label}</span>`).join('')}
      <span class="inline-flex items-center gap-1.5"><span class="h-2.5 w-2.5 rounded-sm ring-2 ring-red-500"></span>Clash</span>
    </div>
  </div>
  <div class="overflow-x-auto rounded-xl border border-slate-200 bg-white p-2">${grid(c, entries, v.bad)}</div>
  ${g.unplaced.length ? `<div class="mt-3 rounded-lg bg-amber-50 p-3 text-sm text-amber-900">${g.unplaced.length} class(es) could not be placed. Run the pre-check for details.</div>` : ''}

  </div>
  <p class="no-print mt-3 text-xs text-slate-400">Prototype note: this page uses a simple in-browser generator. The real app generates with Google OR-Tools (CP-SAT) on the server and re-checks every result with the same clash checker.</p>`;
}

function grid(c, entries, bad) {
  const ix = idx(c), S = c.scheme;
  const at = (d, p) => entries.filter(e => e.day === d && e.period === p && inView(c, e));
  const sig = items => items.map(e => `${e.a}@${e.room}${e.preview ? 'p' : ''}${e.ghost ? 'g' : ''}`).sort().join(',');
  let head = '<th class="w-14"></th>';
  ix.P.forEach(p => {
    const [l, s, e] = S.periods[p - 1];
    head += `<th class="px-1 pb-1 text-left font-normal"><div class="text-xs font-semibold text-slate-700">${l}</div><div class="text-[10px] text-slate-400">${s}–${e}</div></th>`;
    if (ix.breaksAfter.has(p) && p < ix.P.length) head += `<th class="w-7"></th>`;
  });
  const rows = S.days.map(d => {
    let html = `<th class="pr-2 text-left align-middle text-sm font-semibold text-slate-700">${d}</th>`;
    let p = 1;
    while (p <= ix.P.length) {
      const items = at(d, p), s = sig(items);
      let span = 1;
      while (s && p + span <= ix.P.length && !ix.breaksAfter.has(p + span - 1) && sig(at(d, p + span)) === s) span++;
      html += `<td colspan="${span}" class="align-top">${cell(c, items, bad, d, p)}</td>`;
      const last = p + span - 1;
      if (ix.breaksAfter.has(last) && last < ix.P.length) {
        const b = ix.breaksAfter.get(last);
        html += d === S.days[0]
          ? `<td rowspan="${S.days.length}" class="rounded-md bg-slate-100 align-middle"><div class="vtext mx-auto text-[10px] font-medium uppercase tracking-wider text-slate-400">${b.label} · ${b.time}</div></td>`
          : '';
      }
      p = last + 1;
    }
    return `<tr>${html}</tr>`;
  }).join('');
  return `<table class="w-full min-w-[760px] table-fixed border-separate border-spacing-1"><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table>`;
}

function inView(c, e) {
  const a = A(c)[e.a], ix = idx(c);
  if (state.view === 'section') return ix.groups[a.group].section === state.key;
  if (state.view === 'teacher') return a.teacher === state.key;
  return e.room === state.key;
}

function cell(c, items, bad, d, p) {
  const ix = idx(c);
  if (!items.length) return `<div class="h-[60px] rounded-lg border border-dashed border-slate-200"></div>`;
  if (state.view === 'section') {
    const subs = ix.subsOf[state.key];
    const whole = items.filter(e => !ix.groups[A(c)[e.a].group].isSub);
    const subItems = items.filter(e => ix.groups[A(c)[e.a].group].isSub);
    if (subItems.length && subs.length) {
      const parts = subs.map(g => {
        const mine = subItems.filter(e => A(c)[e.a].group === g);
        return mine.length ? mine.map(e => block(c, e, bad)).join('') : `<div class="rounded-md border border-dashed border-slate-200 px-2 py-1 text-[11px] text-slate-400">${ix.groups[g].label} · free</div>`;
      }).join('');
      return `<div class="space-y-1">${whole.map(e => block(c, e, bad)).join('')}${parts}</div>`;
    }
  }
  return `<div class="space-y-1">${items.map(e => block(c, e, bad)).join('')}</div>`;
}

function block(c, e, bad) {
  const ix = idx(c), a = A(c)[e.a], s = subj(c, a), T = ix.teachers[a.teacher], G = ix.groups[a.group];
  let extra = '';
  if (e.ghost) extra = ' opacity-40';
  else if (e.preview) extra = ' outline outline-2 outline-dashed outline-amber-500 outline-offset-1';
  else if (bad.has(e.i)) extra = ' ring-2 ring-red-500';
  const line2 = state.view === 'section' ? `${T.name} · ${e.room}` : state.view === 'teacher' ? `${gLabel(c, a.group)} · ${e.room}` : `${gLabel(c, a.group)} · ${T.name}`;
  const tag = G.isSub && state.view === 'section' ? `<span class="mr-1 rounded bg-white/80 px-1 text-[10px] font-semibold">${G.label}</span>` : '';
  const note = e.preview ? '<span class="text-[10px] font-semibold text-amber-700">New</span>' : e.ghost ? '<span class="text-[10px] font-semibold text-slate-500">Moving</span>' : '';
  return `<div class="tt-cell rounded-lg border px-2 py-1.5 ${KIND[s.kind].cls}${extra}" title="${s.name} · ${KIND[s.kind].label}">
    <div class="flex items-center justify-between gap-1"><span class="truncate text-[13px] font-semibold ${e.ghost ? 'line-through' : ''}">${tag}${s.short}</span>${note}</div>
    <div class="truncate text-[11px] opacity-75">${line2}</div></div>`;
}

function drawer() {

  let body;

  } else {
    const v = validate(c, g.entries);
    if (state.preview) {
      const pv = state.preview, after = validate(c, displayEntries().filter(e => !e.ghost));
      body = `
        ${bubble(`Here's a preview. <b>${desc(c, g.entries[pv.ei])}</b> moves to <b>${pv.day} ${pLabel(c, pv.period)}</b> in <b>${pv.room}</b>. The changed cell is outlined on the grid.`)}
        <div class="rounded-lg border border-amber-200 bg-amber-50 p-3 text-sm text-amber-900">Conflicts: ${v.messages.length} → ${after.messages.length}. Nothing is saved until you apply.</div>
        <div class="flex gap-2">${btn('Apply change', 'applyPreview()', 'primary', 'check')}${btn('Discard', 'discardPreview()', 'secondary')}</div>`;
    } else if (v.messages.length) {
      const ei = state.sim && v.bad.has(state.sim.ei) ? state.sim.ei : [...v.bad][0];
      const opts = freeSlots(c, g.entries, ei, 3);
      body = `
        ${bubble(`I found ${v.messages.length} conflict${v.messages.length > 1 ? 's' : ''}:`)}
        <ul class="space-y-1 text-sm">${v.messages.map(m => `<li class="rounded-md bg-red-50 px-3 py-2 text-red-800">${m}</li>`).join('')}</ul>
        ${bubble(`I can move <b>${desc(c, g.entries[ei])}</b> to a free slot. Everyone involved is free there and no other class has to move:`)}
        <div class="space-y-2">${opts.map((o, n) => `
          <div class="flex items-center justify-between gap-2 rounded-lg border border-slate-200 p-3">
            <div class="text-sm"><div class="font-medium">Option ${n + 1}: ${o.day} ${pLabel(c, o.period)}</div><div class="text-xs text-slate-500">Room ${o.room}</div></div>
            ${btn('Preview', `previewOption('${o.day}', ${o.period}, '${o.room}', ${ei})`, 'secondary')}
          </div>`).join('') || '<div class="text-sm text-slate-500">No free slot found. Try freeing a room or changing the teacher.</div>'}</div>`;
    } else {
      body = `
        ${state.applied ? `<div class="rounded-lg border border-emerald-200 bg-emerald-50 p-3 text-sm text-emerald-800">${state.applied} 0 conflicts.</div>` : ''}
        ${bubble(`All clear: 0 conflicts in ${c.name}. I can help with changes. I'll always show a preview first and wait for you to apply it.`)}
        ${state.history.length ? btn('Undo last change', 'undoLast()', 'secondary') : ''}
        <div class="text-xs font-medium uppercase tracking-wide text-slate-400">Try asking</div>
        <div class="flex flex-wrap gap-2">${[`${c.teachers[0].name} is absent on Monday`, `Find free rooms on ${c.scheme.days[2]} P3`, `Move ${Object.values(c.subjects)[1].short} of ${c.sections[0].id} off ${c.scheme.days.at(-1)}`, 'Why does this section have a gap?'].map(q => `<span class="rounded-full border border-slate-200 px-3 py-1 text-xs text-slate-600">${q}</span>`).join('')}</div>
        <div class="text-sm text-slate-500">To see a fix in action, click <b>Simulate a clash</b> on the timetable.</div>`;
    }
  }
  return `<aside class="no-print fixed bottom-0 right-0 top-14 z-40 flex w-full max-w-[390px] flex-col border-l border-slate-200 bg-white shadow-xl fade-in">
    <div class="flex items-center justify-between border-b border-slate-200 px-4 py-3">
      <div class="flex items-center gap-2"><div class="flex h-8 w-8 items-center justify-center rounded-full bg-indigo-50 text-indigo-600">${icon('bot')}</div>
      <div><div class="text-sm font-semibold">Scheduling assistant</div><div class="text-[11px] text-slate-500">Suggests and previews changes. You approve.</div></div></div>
      <button onclick="toggleDrawer(false)" class="rounded-md p-1 text-slate-500 hover:bg-slate-100" aria-label="Close assistant">${icon('x')}</button>
    </div>
    <div class="flex-1 space-y-3 overflow-y-auto p-4">${body}</div>
    <div class="border-t border-slate-200 p-3">
      <div class="flex gap-2"><input disabled placeholder="Ask in plain words (coming soon)" class="flex-1 rounded-lg border border-slate-200 bg-slate-50 px-3 py-2 text-sm"/>
      <button disabled class="rounded-lg bg-slate-200 px-3 text-sm text-slate-500">Send</button></div>
    </div></aside>`;
}
const bubble = html => `<div class="rounded-lg bg-slate-50 p-3 text-sm leading-relaxed text-slate-700">${html}</div>`;

function dataPage() {

function precheckPage() {
  const c = col(), list = precheck(c);
  const errors = list.filter(x => x.level === 'error').length, warns = list.filter(x => x.level === 'warn').length;
  const style = {
    error: ['bg-red-50 text-red-800', 'Must fix'], warn: ['bg-amber-50 text-amber-900', 'Check'],
    info: ['bg-sky-50 text-sky-900', 'Note'], ok: ['bg-emerald-50 text-emerald-800', 'OK'],

  return `
  <div class="mb-4 flex flex-wrap items-center justify-between gap-3">
    <div><h1 class="text-2xl font-semibold tracking-tight">Pre-check</h1>

  ${card(`<div class="flex items-center gap-3">
    <div class="flex h-10 w-10 items-center justify-center rounded-full ${errors ? 'bg-red-50 text-red-600' : 'bg-emerald-50 text-emerald-600'}">${icon(errors ? 'x' : 'check')}</div>

  <div class="space-y-2">${list.map(x => `
    <div class="flex items-start justify-between gap-3 rounded-lg ${style[x.level][0]} px-4 py-3 text-sm">
      <div class="flex gap-3"><span class="mt-0.5 shrink-0 rounded bg-white/70 px-1.5 py-0.5 text-[11px] font-semibold">${style[x.level][1]}</span><span>${x.text}</span></div>
      ${x.fix ? `<button onclick="go('data')" class="shrink-0 font-medium underline-offset-2 hover:underline">Fix in ${x.fix}</button>` : ''}
    </div>`).join('')}</div>`;
}

function schemePage() {
  const c = col(), S = c.scheme;
  const rows = [];
  S.periods.forEach(([l, s, e], i) => {
    rows.push(`<tr><td class="px-3 py-2 text-sm font-medium">${l}</td><td class="px-3 py-2 text-sm">${s} – ${e}</td><td class="px-3 py-2 text-sm text-slate-500">Class</td></tr>`);
    const b = S.breaks.find(b => b.after === i + 1);
    if (b) rows.push(`<tr class="bg-slate-50"><td class="px-3 py-2 text-sm font-medium text-slate-500">${b.label}</td><td class="px-3 py-2 text-sm text-slate-500">${b.time}</td><td class="px-3 py-2 text-sm text-slate-400">Break · no classes, labs can't run across it</td></tr>`);
  });
  const compareRow = (label, fn) => `<tr><td class="px-3 py-2 text-sm text-slate-500">${label}</td>${COLLEGES.map((x, i) => `<td class="px-3 py-2 text-sm ${i === state.ci ? 'font-medium' : ''}">${fn(x)}</td>`).join('')}</tr>`;
  return `
  <div class="mb-4 flex flex-wrap items-center justify-between gap-3">
    <div><h1 class="text-2xl font-semibold tracking-tight">College scheme</h1>
    <p class="text-sm text-slate-500">How ${c.name} runs its week. Every college sets its own.</p></div>
    <button disabled class="rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm text-slate-400">Edit scheme · coming soon</button>
  </div>
  <div class="grid gap-4 lg:grid-cols-2">
    ${card(`<div class="mb-3 font-medium">Daily periods</div>
      <div class="mb-3 flex flex-wrap gap-1">${S.days.map(d => `<span class="rounded-md bg-indigo-50 px-2 py-1 text-xs font-medium text-indigo-700">${d}</span>`).join('')}</div>
      <table class="w-full"><tbody class="divide-y divide-slate-100">${rows.join('')}</tbody></table>`)}
    ${card(`<div class="mb-3 font-medium">Rules</div>
      <dl class="divide-y divide-slate-100 text-sm">
        ${[['Lectures per subject', `${S.rules.lecturesPerWeek} a week (a subject can override this)`],
           ['Lab sessions per subject', `${S.rules.labSessionsPerWeek} a week`],
           ['Lab length', `${S.labBlock} back-to-back periods`], ['Lab groups', S.labGroups], ['Theory classes in', typeName(S.theoryRoomType) + 's'],
           ['Same subject per day', `At most ${S.rules.maxSameSubjectPerDay}`], ['Teacher default max a day', `${S.rules.teacherMaxPerDay} periods`],
           ['Room types', [...new Set(c.rooms.map(r => typeName(r.type)))].join(', ')]].map(([k, v]) => `<div class="flex justify-between gap-4 py-2"><dt class="text-slate-500">${k}</dt><dd class="text-right font-medium">${v}</dd></div>`).join('')}
      </dl>`)}
  </div>
  ${card(`<div class="mb-1 font-medium">Every college, its own scheme</div>
    <p class="mb-3 text-sm text-slate-500">Each college's data and scheme are stored separately. The generator and clash checker read the scheme instead of assuming a fixed week.</p>
    <div class="overflow-x-auto"><table class="w-full"><thead class="border-b border-slate-100"><tr><th></th>${COLLEGES.map(x => `<th class="px-3 py-2 text-left text-xs font-medium text-slate-500">${x.name}</th>`).join('')}</tr></thead>
    <tbody class="divide-y divide-slate-100">
      ${compareRow('Working days', x => `${x.scheme.days.length} (${x.scheme.days[0]}–${x.scheme.days.at(-1)})`)}
      ${compareRow('Periods a day', x => `${x.scheme.periods.length} × ${minutes(x.scheme.periods[0])} min`)}
      ${compareRow('College hours', x => `${x.scheme.periods[0][1]}–${x.scheme.periods.at(-1)[2]}`)}
      ${compareRow('Breaks', x => x.scheme.breaks.map(b => `${b.label} after P${b.after}`).join(', '))}
      ${compareRow('Lectures per subject', x => `${x.scheme.rules.lecturesPerWeek} a week`)}
      ${compareRow('Lab groups', x => x.scheme.labGroups)}
      ${compareRow('Theory rooms', x => typeName(x.scheme.theoryRoomType) + 's')}
      ${compareRow('Teacher max a day', x => x.scheme.rules.teacherMaxPerDay)}
    </tbody></table></div>`, 'mt-4')}`;
}
function minutes([, s, e]) { const t = x => +x.slice(0, 2) * 60 + +x.slice(3); return t(e) - t(s); }

render();
</script>
</body>
</html>
