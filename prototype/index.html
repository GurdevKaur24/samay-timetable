/* ------------------------------ helpers ------------------------------ */
const typeName = t => ROOM_TYPE[t] || t;
const key = (...k) => k.join('|');
const rotate = (arr, n) => arr.map((_, i) => arr[(i + n) % arr.length]);

function idx(c) {
  if (c._ix) return c._ix;
  const groups = {}, subsOf = {};
  c.sections.forEach(s => {
    groups[s.id] = { id: s.id, section: s.id, label: s.id, strength: s.strength, isSub: false };
    subsOf[s.id] = [];
    (s.subs || []).forEach(u => {
      const id = `${s.id}/${u.label}`;
      groups[id] = { id, section: s.id, label: u.label, strength: u.strength, isSub: true };
      subsOf[s.id].push(id);
    });
  });
  c._ix = {
    groups, subsOf,
    teachers: Object.fromEntries(c.teachers.map(t => [t.id, t])),
    rooms: Object.fromEntries(c.rooms.map(r => [r.id, r])),
    P: c.scheme.periods.map((_, i) => i + 1),
    breaksAfter: new Map(c.scheme.breaks.map(b => [b.after, b])),
  };
  return c._ix;
}
// Periods a week: the assignment's own number, else the subject's, else the college rule.
function weekly(c, subjectId, override) {
  const s = c.subjects[subjectId], R = c.scheme.rules;
  if (override != null) return override;
  if (s.perWeek != null) return s.perWeek;
  return s.kind === 'lab' ? R.labSessionsPerWeek * c.scheme.labBlock : R.lecturesPerWeek;
}
function A(c) { return c._A || (c._A = c.assignments.map((a, i) => ({ i, subject: a[0], group: a[1], teacher: a[2], periods: weekly(c, a[0], a[3]) }))); }
const subj = (c, a) => c.subjects[a.subject];
const blockOf = (c, a) => subj(c, a).kind === 'lab' ? c.scheme.labBlock : 1;
const roomTypeOf = (c, a) => subj(c, a).room || c.scheme.theoryRoomType;
const gLabel = (c, g) => { const G = idx(c).groups[g]; return G.isSub ? `${G.section} ${G.label}` : g; };
const pLabel = (c, p) => c.scheme.periods[p - 1][0];
const desc = (c, e) => { const a = A(c)[e.a]; return `${gLabel(c, a.group)} ${subj(c, a).short}`; };
const tMax = (c, t) => t.max || c.scheme.rules.teacherMaxPerDay;
function fmtOff(off) {
  const byDay = {};
  off.forEach(([d, p]) => (byDay[d] ||= []).push(p));
  return Object.entries(byDay).map(([d, ps]) => `${d} P${Math.min(...ps)}${ps.length > 1 ? '–P' + Math.max(...ps) : ''}`).join(', ');
}

/* ----------------------------------------------------------------------
   In-browser demo generator (greedy). The real app runs Google OR-Tools
   CP-SAT on the server; this keeps the prototype a single file.
----------------------------------------------------------------------- */
function generate(c) {
  const ix = idx(c), S = c.scheme, days = S.days, P = ix.P;
  const AS = A(c);
  const busy = new Set(), entries = [], tLoad = {}, usedDay = new Set(), dayLoad = {}, unplaced = [];
  const roomsFor = a => c.rooms.filter(r => r.type === roomTypeOf(c, a) && r.cap >= ix.groups[a.group].strength);

  function groupFree(g, d, p) {
    const G = ix.groups[g];
    if (busy.has(key('g', G.section, d, p))) return false;
    return G.isSub ? !busy.has(key('g', g, d, p)) : !ix.subsOf[g].some(s => busy.has(key('g', s, d, p)));
  }
  function can(a, d, s, r) {
    const b = blockOf(c, a), T = ix.teachers[a.teacher];
    if (s + b - 1 > P.length) return false;
    for (let q = s; q < s + b - 1; q++) if (ix.breaksAfter.has(q)) return false;
    if (usedDay.has(key(a.i, d))) return false;
    if ((tLoad[key(a.teacher, d)] || 0) + b > tMax(c, T)) return false;
    for (let p = s; p < s + b; p++) {
      if ((T.off || []).some(([od, op]) => od === d && op === p)) return false;
      if (busy.has(key('t', a.teacher, d, p)) || busy.has(key('r', r.id, d, p)) || !groupFree(a.group, d, p)) return false;
    }
    return true;
  }
  function put(a, d, s, r) {
    const b = blockOf(c, a), sec = ix.groups[a.group].section, placed = [];
    for (let p = s; p < s + b; p++) {
      busy.add(key('t', a.teacher, d, p)); busy.add(key('r', r.id, d, p)); busy.add(key('g', a.group, d, p));
      const e = { a: a.i, day: d, period: p, room: r.id };
      entries.push(e); placed.push(e);
    }
    tLoad[key(a.teacher, d)] = (tLoad[key(a.teacher, d)] || 0) + b;
    dayLoad[key(sec, d)] = (dayLoad[key(sec, d)] || 0) + b;
    usedDay.add(key(a.i, d));
    return { a, d, s, r, placed };
  }
  function undo(m) {
    const { a, d, s, r, placed } = m, b = blockOf(c, a), sec = ix.groups[a.group].section;
    for (let p = s; p < s + b; p++) { busy.delete(key('t', a.teacher, d, p)); busy.delete(key('r', r.id, d, p)); busy.delete(key('g', a.group, d, p)); }
    placed.forEach(e => entries.splice(entries.indexOf(e), 1));
    tLoad[key(a.teacher, d)] -= b; dayLoad[key(sec, d)] -= b; usedDay.delete(key(a.i, d));
  }

  const remaining = new Map(AS.map(a => [a.i, a.periods / blockOf(c, a)]));

  // 1) Labs: lab groups of a section go to different labs at the same time (rotation A1→Lab X, A2→Lab Y …).
  c.sections.forEach((sec, si) => {
    const subs = ix.subsOf[sec.id];
    if (!subs.length) return;
    const labs = subs.map(g => AS.filter(a => a.group === g && subj(c, a).kind === 'lab'));
    const rounds = Math.max(0, ...labs.map(l => l.length));
    for (let k = 0; k < rounds; k++) {
      const items = labs.map((l, i) => l.length ? l[(i + k) % l.length] : null).filter(a => a && remaining.get(a.i) > 0);
      let done = false;
      for (const d of rotate(days, (si * 2 + k * 2) % days.length)) {
        for (const s of rotate(P, (si + k) % P.length)) {
          const moves = [];
          let ok = true;
          for (const a of items) {
            const r = roomsFor(a).find(r => can(a, d, s, r));
            if (!r) { ok = false; break; }
            moves.push(put(a, d, s, r));
          }
          if (ok) { items.forEach(a => remaining.set(a.i, remaining.get(a.i) - 1)); done = true; break; }
          moves.reverse().forEach(undo);
        }
        if (done) break;
      }
    }
  });

  // 2) Everything left (lectures, tutorials, any lab that couldn't pair): least-busy day first, morning first.
  const order = AS.filter(a => remaining.get(a.i) > 0).sort((x, y) => blockOf(c, y) - blockOf(c, x) || y.periods - x.periods);
  for (const a of order) {
    const sec = ix.groups[a.group].section;
    for (let left = remaining.get(a.i); left > 0; left--) {
      const ds = [...days].sort((d1, d2) => (dayLoad[key(sec, d1)] || 0) - (dayLoad[key(sec, d2)] || 0) || days.indexOf(d1) - days.indexOf(d2));
      let placed = false;
      for (const d of ds) {
        for (const s of P) {
          const r = roomsFor(a).find(r => can(a, d, s, r));
          if (r) { put(a, d, s, r); placed = true; break; }
        }
        if (placed) break;
      }
      if (!placed) { unplaced.push(a); break; }
    }
  }
  return { entries, unplaced, at: new Date() };
}

/* ------------------- independent validator (hard rules) ------------------- */
function validate(c, entries) {
  const ix = idx(c), AS = A(c), messages = [], bad = new Set(), pairs = [];
  const group = fn => { const m = new Map(); entries.forEach((e, i) => { if (e.ghost) return; const k = fn(e); (m.get(k) || m.set(k, []).get(k)).push(i); }); return m; };
  const slot = e => `${e.day} ${pLabel(c, e.period)}`;
  const flag = (list, text) => { list.forEach(i => bad.add(i)); messages.push(text); pairs.push(list); };

  group(e => key(AS[e.a].teacher, e.day, e.period)).forEach(list => {
    if (list.length > 1) flag(list, `${ix.teachers[AS[entries[list[0]].a].teacher].name} is booked twice on ${slot(entries[list[0]])}: ${list.map(i => desc(c, entries[i])).join(' and ')}.`);
  });
  group(e => key(e.room, e.day, e.period)).forEach(list => {
    if (list.length > 1) flag(list, `${entries[list[0]].room} is double-booked on ${slot(entries[list[0]])}: ${list.map(i => desc(c, entries[i])).join(' and ')}.`);
  });
  group(e => key(ix.groups[AS[e.a].group].section, e.day, e.period)).forEach(list => {
    const whole = list.filter(i => !ix.groups[AS[entries[i].a].group].isSub);
    const subs = list.filter(i => ix.groups[AS[entries[i].a].group].isSub);
    const perSub = {};
    subs.forEach(i => (perSub[AS[entries[i].a].group] ||= []).push(i));
    if (whole.length > 1 || (whole.length && subs.length) || Object.values(perSub).some(l => l.length > 1))
      flag(list, `${ix.groups[AS[entries[list[0]].a].group].section} has overlapping classes on ${slot(entries[list[0]])}: ${list.map(i => desc(c, entries[i])).join(' and ')}.`);
  });
  const count = {};
  entries.forEach(e => { if (!e.ghost) count[e.a] = (count[e.a] || 0) + 1; });
  AS.forEach(a => { if ((count[a.i] || 0) !== a.periods) messages.push(`${gLabel(c, a.group)} ${subj(c, a).short} has ${count[a.i] || 0} of ${a.periods} periods.`); });
  return { messages, bad, pairs };
}

/* ------------------------------ scorecard ------------------------------ */
function metrics(c, entries) {
  const ix = idx(c), units = {}, subBusy = {}, load = {};
  entries.forEach(e => {
    const a = A(c)[e.a], G = ix.groups[a.group];
    const targets = G.isSub ? [G.id] : (ix.subsOf[G.section].length ? ix.subsOf[G.section] : [G.section]);
    targets.forEach(t => (units[key(t, e.day)] ||= new Set()).add(e.period));
    if (G.isSub) (subBusy[key(G.section, e.day, e.period)] ||= new Set()).add(G.id);
    load[a.teacher] = (load[a.teacher] || 0) + 1;
  });
  let lab = 0, par = 0;
  Object.entries(subBusy).forEach(([k, s]) => { lab++; if (s.size === ix.subsOf[k.split('|')[0]].length) par++; });
  const gaps = Object.values(units).map(s => { const a = [...s]; return Math.max(...a) - Math.min(...a) + 1 - a.length; });
  const avg = gaps.length ? gaps.reduce((x, y) => x + y, 0) / gaps.length : 0;
  const parPct = lab ? 100 * par / lab : 100;
  const last = entries.filter(e => e.period === ix.P.length).length;
  const L = Object.values(load);
  const used = new Set(entries.map(e => key(e.room, e.day, e.period))).size;
  return {
    score: Math.max(0, Math.min(100, Math.round(100 - 15 * avg - 0.3 * (100 - parPct) - 0.5 * last))),
    avg: avg.toFixed(2), parPct: Math.round(parPct), last,
    lmin: L.length ? Math.min(...L) : 0, lmax: L.length ? Math.max(...L) : 0,
    classes: entries.length, required: A(c).reduce((s, a) => s + a.periods, 0),
    roomUse: Math.round(100 * used / (c.rooms.length * c.scheme.days.length * ix.P.length)),
  };
}

/* ------------------------------ pre-check ------------------------------ */
function precheck(c) {
  const ix = idx(c), S = c.scheme, slots = S.days.length * ix.P.length, out = [];
  const tl = {};
  A(c).forEach(a => tl[a.teacher] = (tl[a.teacher] || 0) + a.periods);
  c.teachers.forEach(t => {
    const cap = tMax(c, t) * S.days.length - (t.off || []).length, l = tl[t.id] || 0;
    if (l > cap) out.push({ level: 'error', text: `${t.name} has ${l} periods a week but can teach at most ${cap}.`, fix: 'Teachers' });
    else if (l > 0.6 * cap) out.push({ level: 'warn', text: `${t.name} has a heavy load: ${l} of a possible ${cap} periods a week.`, fix: 'Teachers' });
  });
  c.sections.forEach(s => {
    const whole = A(c).filter(a => a.group === s.id).reduce((x, a) => x + a.periods, 0);
    const subs = ix.subsOf[s.id].map(g => A(c).filter(a => a.group === g).reduce((x, a) => x + a.periods, 0));
    const need = whole + (subs.length ? Math.max(...subs) : 0);
    out.push(need > slots
      ? { level: 'error', text: `${s.id} needs ${need} periods but the week has only ${slots}.`, fix: 'Sections' }
      : { level: 'ok', text: `${s.id}: ${need} of ${slots} weekly periods needed.` });
  });
  const demand = {};
  A(c).forEach(a => demand[roomTypeOf(c, a)] = (demand[roomTypeOf(c, a)] || 0) + a.periods);
  Object.entries(demand).forEach(([t, d]) => {
    const cap = c.rooms.filter(r => r.type === t).length * slots;
    out.push(d > cap
      ? { level: 'error', text: `${typeName(t)}s are needed for ${d} periods but only ${cap} are available.`, fix: 'Rooms' }
      : { level: 'ok', text: `${typeName(t)}s: ${d} of ${cap} room-periods needed (${Math.round(100 * d / cap)}%).` });
  });
  A(c).forEach(a => {
    const G = ix.groups[a.group];
    if (!c.rooms.some(r => r.type === roomTypeOf(c, a) && r.cap >= G.strength))
      out.push({ level: 'error', text: `No ${typeName(roomTypeOf(c, a)).toLowerCase()} is big enough for ${gLabel(c, a.group)} (${G.strength} students).`, fix: 'Rooms' });
  });
  c.teachers.filter(t => (t.off || []).length).forEach(t =>
    out.push({ level: 'info', text: `${t.name} is unavailable on ${fmtOff(t.off)}. Classes won't be placed there.` }));
  const rank = { error: 0, warn: 1, info: 2, ok: 3 };
  return out.sort((x, y) => rank[x.level] - rank[y.level]);
}

/* ------------------------------ app state ------------------------------ */
const state = {
  ci: null, page: 'dashboard', view: 'section', key: null, // ci = the signed-in college; null = signed out
  gen: {}, drawer: false, preview: null, history: [], applied: null, sim: null, generating: null, toast: null,
};
const col = () => COLLEGES[state.ci];
const current = () => state.gen[col().id];

function displayEntries() {
  const g = current();
  if (!g) return [];
  const list = g.entries.map((e, i) => ({ ...e, i }));
  const pv = state.preview;
  if (!pv) return list;
  list[pv.ei] = { ...list[pv.ei], day: pv.day, period: pv.period, room: pv.room, preview: true };
  list.push({ ...g.entries[pv.ei], i: pv.ei, ghost: true });
  return list;
}

function freeSlots(c, entries, ei, limit) {
  const ix = idx(c), a = A(c)[entries[ei].a], T = ix.teachers[a.teacher], G = ix.groups[a.group];
  const busyT = new Set(), busyR = new Set(), busyG = new Set(), daysUsed = new Set(), load = {};
  entries.forEach((e, j) => {
    if (j === ei) return;
    const b = A(c)[e.a], k = key(e.day, e.period), g = ix.groups[b.group];
    if (b.teacher === a.teacher) { busyT.add(k); load[e.day] = (load[e.day] || 0) + 1; }
    busyR.add(key(e.room, k));
    if (g.section === G.section) busyG.add(key(g.isSub ? g.id : '*', k));
    if (b.i === a.i) daysUsed.add(e.day);
  });
  const rooms = c.rooms.filter(r => r.type === roomTypeOf(c, a) && r.cap >= G.strength);
  const out = [];
  for (const d of c.scheme.days) {
    if (daysUsed.has(d) || (load[d] || 0) + 1 > tMax(c, T)) continue;
    for (const p of ix.P) {
      const k = key(d, p);
      if (busyT.has(k) || (T.off || []).some(([od, op]) => od === d && op === p)) continue;
      const gBusy = busyG.has(key('*', k)) || (G.isSub ? busyG.has(key(G.id, k)) : ix.subsOf[G.section].some(s => busyG.has(key(s, k))));
      if (gBusy) continue;
      const r = rooms.find(r => !busyR.has(key(r.id, k)));
      if (!r) continue;
      out.push({ day: d, period: p, room: r.id });
      if (out.length >= limit) return out;
    }
  }
  return out;
}

/* ------------------------------ actions ------------------------------ */
function render() { document.getElementById('app').innerHTML = layout(); }
function go(page) { state.page = page; render(); window.scrollTo(0, 0); }
// A user belongs to exactly one college and only ever sees that college's data.
function signIn(i) {
  Object.assign(state, { ci: +i, page: 'dashboard', key: null, preview: null, history: [], applied: null, sim: null, drawer: false });
  render(); toast(`Signed in to ${col().name}.`);
}
function signOut() {
  Object.assign(state, { ci: null, preview: null, history: [], applied: null, sim: null, drawer: false, menu: false, modal: null });
  render();
}
function setView(v) { state.view = v; state.key = null; render(); }
function setKey(k) { state.key = k; render(); }
function toggleDrawer(open) { state.drawer = open ?? !state.drawer; render(); }
function toast(text) {
  state.toast = text; render();
  clearTimeout(window._tt); window._tt = setTimeout(() => { state.toast = null; render(); }, 3200);
}
function runGenerate() {
  const steps = ['Checking data and rules', 'Placing labs side by side', 'Placing lectures and tutorials', 'Verifying: no clashes'];
  state.generating = 0; render();
  const timer = setInterval(() => {
    state.generating++;
    if (state.generating >= steps.length) {
      clearInterval(timer);
      state.gen[col().id] = generate(col());
      state.generating = null; state.preview = null; state.history = []; state.applied = null; state.sim = null;
      state.page = 'timetable';
      const v = validate(col(), current().entries);
      render();
      toast(v.messages.length ? `Generated with ${v.messages.length} issue(s) to review.` : 'Timetable generated and verified: 0 conflicts.');
    } else render();
  }, 450);
  window._steps = steps;
}
function simulateClash() {
  const c = col(), g = current();
  if (!g) return;
  const ix = idx(c), E = g.entries;
  for (let i = 0; i < E.length; i++) {
    const a = A(c)[E[i].a];
    if (blockOf(c, a) !== 1 || ix.groups[a.group].isSub) continue;
    for (const o of E) {
      const b = A(c)[o.a];
      if (b.teacher !== a.teacher || b.group === a.group) continue;
      const at = e => e.day === o.day && e.period === o.period;
      const groupBusy = E.some(e => at(e) && ix.groups[A(c)[e.a].group].section === ix.groups[a.group].section);
      const sameDay = E.some((e, j) => j !== i && e.a === E[i].a && e.day === o.day);
      const room = c.rooms.find(r => r.type === roomTypeOf(c, a) && r.cap >= ix.groups[a.group].strength && !E.some(e => at(e) && e.room === r.id));
      if (groupBusy || sameDay || !room) continue;
      state.sim = { ei: i };
      E[i] = { ...E[i], day: o.day, period: o.period, room: room.id };
      Object.assign(state, { view: 'section', key: a.group, page: 'timetable', drawer: true, preview: null, applied: null });
      render();
      toast('A clash was added on purpose, to show how the assistant helps.');
      return;
    }
  }
}
function previewOption(day, period, room, ei) { state.preview = { ei, day, period: +period, room }; state.applied = null; render(); }
function discardPreview() { state.preview = null; render(); }
function applyPreview() {
  const g = current(), pv = state.preview;
  if (!g || !pv) return;
  const before = g.entries[pv.ei];
  state.history.push({ ei: pv.ei, from: { ...before } });
  g.entries[pv.ei] = { ...before, day: pv.day, period: pv.period, room: pv.room };
  state.applied = `${desc(col(), g.entries[pv.ei])} moved to ${pv.day} ${pLabel(col(), pv.period)} in ${pv.room}.`;
  state.preview = null; state.sim = null;
  render(); toast('Change applied. You can undo it from the assistant.');
}
function undoLast() {
  const g = current(), h = g && state.history.pop();
  if (!h) return;
  g.entries[h.ei] = h.from; state.applied = null;
  render(); toast('Change undone.');
}

function schemeSummary(c) {

}

function timetable() {
  const c = col(), g = current(), ix = idx(c);
  if (!g) return `
    <h1 class="mb-4 text-2xl font-semibold tracking-tight">Timetable</h1>

    : ix.rooms[state.key].owner === 'Shared' ? 'Shared by all departments' : deptName(c, ix.rooms[state.key].owner);

  else badge = `<button onclick="toggleDrawer(true)" class="inline-flex items-center gap-1.5 rounded-full bg-red-50 px-3 py-1 text-sm font-medium text-red-700 hover:bg-red-100">${base.messages.length} conflict${base.messages.length > 1 ? 's' : ''} · fix with assistant</button>`;

  return `
  <div class="print-only mb-3">
    <div class="text-lg font-semibold">${c.name} · ${title}</div>

    </div>
    <select onchange="setKey(this.value)" class="rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
      ${optionsHtml(options, state.key)}
    </select>
    <div class="ml-auto flex flex-wrap items-center gap-3 text-xs text-slate-600">
      ${Object.values(KIND).map(k => `<span class="inline-flex items-center gap-1.5"><span class="h-2.5 w-2.5 rounded-sm ${k.dot}"></span>${k.label}</span>`).join('')}

}

function grid(c, entries, bad) {
  const ix = idx(c), S = c.scheme;
  const at = (d, p) => entries.filter(e => e.day === d && e.period === p && inView(c, e));
  const sig = items => items.map(e => `${e.a}@${e.room}${e.preview ? 'p' : ''}${e.ghost ? 'g' : ''}`).sort().join(',');
  let head = '<th class="w-14"></th>';
  ix.P.forEach(p => {
    const [l, s, e] = S.periods[p - 1];
    head += `<th class="px-1 pb-1 text-left font-normal"><div class="text-xs font-semibold text-slate-700">${l}</div><div class="text-[10px] text-slate-400">${s}–${e}</div></th>`;
    if (ix.breaksAfter.has(p) && p < ix.P.length) head += `<th class="w-7"></th>`;
  });
  const rows = S.days.map(d => {
    let html = `<th class="pr-2 text-left align-middle text-sm font-semibold text-slate-700">${d}</th>`;
    let p = 1;
    while (p <= ix.P.length) {
      const items = at(d, p), s = sig(items);
      let span = 1;
      while (s && p + span <= ix.P.length && !ix.breaksAfter.has(p + span - 1) && sig(at(d, p + span)) === s) span++;
      html += `<td colspan="${span}" class="align-top">${cell(c, items, bad, d, p)}</td>`;
      const last = p + span - 1;
      if (ix.breaksAfter.has(last) && last < ix.P.length) {
        const b = ix.breaksAfter.get(last);
        html += d === S.days[0]
          ? `<td rowspan="${S.days.length}" class="rounded-md bg-slate-100 align-middle"><div class="vtext mx-auto text-[10px] font-medium uppercase tracking-wider text-slate-400">${b.label} · ${b.time}</div></td>`
          : '';
      }
      p = last + 1;
    }
    return `<tr>${html}</tr>`;
  }).join('');
  return `<table class="w-full min-w-[760px] table-fixed border-separate border-spacing-1"><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table>`;
}

function inView(c, e) {
  const a = A(c)[e.a], ix = idx(c);
  if (state.view === 'section') return ix.groups[a.group].section === state.key;
  if (state.view === 'teacher') return a.teacher === state.key;
  return e.room === state.key;
}

function cell(c, items, bad, d, p) {
  const ix = idx(c);
  if (!items.length) return `<div class="h-[60px] rounded-lg border border-dashed border-slate-200"></div>`;
  if (state.view === 'section') {
    const subs = ix.subsOf[state.key];
    const whole = items.filter(e => !ix.groups[A(c)[e.a].group].isSub);
    const subItems = items.filter(e => ix.groups[A(c)[e.a].group].isSub);
    if (subItems.length && subs.length) {
      const parts = subs.map(g => {
        const mine = subItems.filter(e => A(c)[e.a].group === g);
        return mine.length ? mine.map(e => block(c, e, bad)).join('') : `<div class="rounded-md border border-dashed border-slate-200 px-2 py-1 text-[11px] text-slate-400">${ix.groups[g].label} · free</div>`;
      }).join('');
      return `<div class="space-y-1">${whole.map(e => block(c, e, bad)).join('')}${parts}</div>`;
    }
  }
  return `<div class="space-y-1">${items.map(e => block(c, e, bad)).join('')}</div>`;
}

function block(c, e, bad) {
  const ix = idx(c), a = A(c)[e.a], s = subj(c, a), T = ix.teachers[a.teacher], G = ix.groups[a.group];
  let extra = '';
  if (e.ghost) extra = ' opacity-40';
  else if (e.preview) extra = ' outline outline-2 outline-dashed outline-amber-500 outline-offset-1';
  else if (bad.has(e.i)) extra = ' ring-2 ring-red-500';
  const line2 = state.view === 'section' ? `${T.name} · ${e.room}` : state.view === 'teacher' ? `${gLabel(c, a.group)} · ${e.room}` : `${gLabel(c, a.group)} · ${T.name}`;
  const tag = G.isSub && state.view === 'section' ? `<span class="mr-1 rounded bg-white/80 px-1 text-[10px] font-semibold">${G.label}</span>` : '';
  const note = e.preview ? '<span class="text-[10px] font-semibold text-amber-700">New</span>' : e.ghost ? '<span class="text-[10px] font-semibold text-slate-500">Moving</span>' : '';
  return `<div class="tt-cell rounded-lg border px-2 py-1.5 ${KIND[s.kind].cls}${extra}" title="${s.name} · ${KIND[s.kind].label}">
    <div class="flex items-center justify-between gap-1"><span class="truncate text-[13px] font-semibold ${e.ghost ? 'line-through' : ''}">${tag}${s.short}</span>${note}</div>
    <div class="truncate text-[11px] opacity-75">${line2}</div></div>`;
}

        <div class="text-sm text-slate-500">To see a fix in action, click <b>Simulate a clash</b> on the timetable.</div>`;
    }
  }
  return `<aside class="no-print fixed bottom-0 right-0 top-14 z-40 flex w-full max-w-[390px] flex-col border-l border-slate-200 bg-white shadow-xl fade-in">
    <div class="flex items-center justify-between border-b border-slate-200 px-4 py-3">

      <button onclick="toggleDrawer(false)" class="rounded-md p-1 text-slate-500 hover:bg-slate-100" aria-label="Close assistant">${icon('x')}</button>
    </div>

      <div class="flex gap-2"><input disabled placeholder="Ask in plain words (coming soon)" class="flex-1 rounded-lg border border-slate-200 bg-slate-50 px-3 py-2 text-sm"/>
      <button disabled class="rounded-lg bg-slate-200 px-3 text-sm text-slate-500">Send</button></div>
    </div></aside>`;
}
const bubble = html => `<div class="rounded-lg bg-slate-50 p-3 text-sm leading-relaxed text-slate-700">${html}</div>`;

/* ==========================================================================
   DATA ENTRY: add / edit / delete records, and import from Excel or CSV.
   Every save goes through the same checks (validateValues), whether it comes
   from a form or from an imported row.
=========================================================================== */
const esc = v => String(v ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
// College structure: Department → Course → Section (→ lab groups). Teachers and subjects belong to a department,
// but any teacher can teach any department's students (e.g. Applied Sciences teaches Maths to CSE and ECE).
const ENT = {
  departments: { label: 'Departments', one: 'department' },
  courses: { label: 'Courses', one: 'course' },
  sections: { label: 'Sections', one: 'section' },
  teachers: { label: 'Teachers', one: 'teacher' },
  subjects: { label: 'Subjects', one: 'subject' },
  rooms: { label: 'Rooms', one: 'room' },
  assignments: { label: 'Teaching assignments', one: 'teaching assignment' },
};
// Spreadsheet columns for import and for the downloadable template.
const COLUMNS = {
  departments: [['Code', 'code'], ['Name', 'name'], ['Head of department', 'hod']],
  courses: [['Course code', 'code'], ['Course name', 'name'], ['Department', 'dept'], ['Duration (years)', 'years']],
  sections: [['Section', 'name'], ['Course', 'course'], ['Semester', 'sem'], ['Students', 'strength'], ['Lab groups', 'groups']],
  teachers: [['Name', 'name'], ['Department', 'dept'], ['Max periods a day', 'max'], ['Unavailable', 'off']],
  rooms: [['Room', 'name'], ['Type', 'type'], ['Capacity', 'cap'], ['Owner', 'owner']],
  subjects: [['Code', 'code'], ['Name', 'name'], ['Short name', 'short'], ['Type', 'kind'], ['Room needed', 'room'], ['Lectures per week', 'perWeek'], ['Offered by', 'dept']],
  assignments: [['Subject code', 'subject'], ['Taught to', 'group'], ['Teacher', 'teacher'], ['Periods per week', 'periods']],
};
const deptName = (c, id) => c.departments.find(d => d.id === id)?.name ?? id;
const courseOf = (c, id) => (c.courses || []).find(x => x.id === id);
const sectionOf = (c, groupId) => c.sections.find(s => s.id === idx(c).groups[groupId]?.section);
// The department whose students a group belongs to.
const groupDept = (c, groupId) => sectionOf(c, groupId)?.dept;
const isGuest = (c, a) => idx(c).teachers[a[2] ?? a.teacher]?.dept !== groupDept(c, a[1] ?? a.group);
const deptBadge = (id, tone = 'slate') => `<span class="rounded ${tone === 'indigo' ? 'bg-indigo-100 text-indigo-700' : 'bg-slate-100 text-slate-700'} px-1.5 py-0.5 text-[11px] font-medium">${esc(id)}</span>`;

const intOrNull = v => (String(v ?? '').trim() === '' ? null : Number(String(v).trim()));
const isInt = (n, lo, hi) => Number.isInteger(n) && n >= lo && n <= hi;
const roomTypes = c => [...new Set([c.scheme.theoryRoomType, ...c.rooms.map(r => r.type), ...Object.values(c.subjects).map(s => s.room).filter(Boolean)])];
const labRoomTypes = c => roomTypes(c).filter(t => t !== c.scheme.theoryRoomType);
const labLabels = (c, sectionId, n) => {
  const letter = /[A-Za-z]$/.test(sectionId) ? sectionId.slice(-1).toUpperCase() : 'G';
  const prefix = c.scheme.labPrefix === 'section' ? letter : (c.scheme.labPrefix || 'G');
  return Array.from({ length: n }, (_, i) => `${prefix}${i + 1}`);
};
const assignmentsOf = (c, pred) => c.assignments.filter(pred).length;

function dataChanged(c, message) {
  delete c._ix; delete c._A;
  const hadTimetable = !!state.gen[c.id];
  delete state.gen[c.id];
  Object.assign(state, { preview: null, history: [], applied: null, sim: null, modal: null });

/* ---- current record → form values (strings, as typed) ---- */
function toValues(c, entity, ref) {
  const filterDept = state.deptFilter && state.deptFilter !== 'all' ? state.deptFilter : null;
  if (entity === 'departments') {
    const d = ref != null ? c.departments[ref] : null;
    return d ? { code: d.id, name: d.name, hod: d.hod || '' } : { code: '', name: '', hod: '' };
  }
  if (entity === 'courses') {
    const x = ref != null ? c.courses[ref] : null;
    return x ? { code: x.id, name: x.name, dept: x.dept, years: String(x.years) }
             : { code: '', name: '', dept: filterDept || c.departments[0].id, years: '4' };
  }
  if (entity === 'sections') {
    const s = ref != null ? c.sections[ref] : null;
    const firstCourse = (c.courses || []).find(x => !filterDept || x.dept === filterDept);
    return s ? { name: s.id, course: s.course || '', sem: String(s.sem ?? 1), strength: String(s.strength), groups: String(s.subs.length) }
             : { name: '', course: firstCourse?.id || '', sem: '1', strength: '', groups: String(c.sections[0]?.subs.length ?? 2) };
  }
  if (entity === 'teachers') {
    const t = ref != null ? c.teachers[ref] : null;
    return t ? { name: t.name, dept: t.dept, max: String(tMax(c, t)), off: (t.off || []).map(x => [...x]) }
             : { name: '', dept: filterDept || c.departments[0].id, max: String(c.scheme.rules.teacherMaxPerDay), off: [] };
  }
  if (entity === 'rooms') {
    const r = ref != null ? c.rooms[ref] : null;
    return r ? { name: r.id, type: r.type, cap: String(r.cap), owner: r.owner }
             : { name: '', type: c.scheme.theoryRoomType, cap: '', owner: 'Shared' };
  }
  if (entity === 'subjects') {
    const s = ref != null ? c.subjects[ref] : null;
    return s ? { code: ref, name: s.name, short: s.short, kind: s.kind, room: s.room || '', perWeek: s.perWeek != null ? String(s.perWeek) : '', dept: s.dept || '' }
             : { code: '', name: '', short: '', kind: 'theory', room: '', perWeek: '', dept: filterDept || '' };
  }
  const a = ref != null ? c.assignments[ref] : null;
  return a ? { subject: a[0], group: a[1], teacher: a[2], periods: a[3] != null ? String(a[3]) : '' }
           : { subject: '', group: '', teacher: '', periods: '' };
}

/* ---- the one place where every rule for good data lives ---- */
function validateValues(c, entity, v, ref, seen = new Set()) {
  const ix = idx(c), err = {}, S = c.scheme;
  const deptIds = c.departments.map(d => d.id);
  const taken = (list, val) => list.some(x => x.toLowerCase() === String(val).toLowerCase()) || seen.has(String(val).toLowerCase());
  let record = null;
  const courses = c.courses || [];

  if (entity === 'departments') {
    const code = String(v.code || '').trim().toUpperCase(), name = String(v.name || '').trim();
    if (!code) err.code = 'Enter a short code, like CSE or ME.';
    else if (!/^[A-Z0-9-]{1,10}$/.test(code)) err.code = 'Use up to 10 letters, numbers or "-".';
    else if (taken(c.departments.filter((_, i) => i !== ref).map(d => d.id), code)) err.code = `${code} already exists.`;
    if (!name) err.name = 'Enter the department name.';
    if (!Object.keys(err).length) record = { id: code, name, hod: String(v.hod || '').trim() || undefined, status: ref != null ? c.departments[ref].status : 'ready' };
  }

  if (entity === 'courses') {
    const code = String(v.code || '').trim().toUpperCase(), name = String(v.name || '').trim(), years = intOrNull(v.years);
    if (!code) err.code = 'Enter a short code, like BTECH-ME.';
    else if (!/^[A-Z0-9.-]{1,16}$/.test(code)) err.code = 'Use up to 16 letters, numbers, "." or "-".';
    else if (taken(courses.filter((_, i) => i !== ref).map(x => x.id), code)) err.code = `${code} already exists.`;
    if (!name) err.name = 'Enter the course name, like B.Tech Mechanical Engineering.';
    if (!deptIds.includes(v.dept)) err.dept = v.dept ? `No department "${v.dept}". Use one of: ${deptIds.join(', ')}.` : 'Choose a department.';
    if (!isInt(years, 1, 6)) err.years = 'Enter 1–6 years.';
    if (ref != null && !err.years) {
      const tooHigh = c.sections.filter(s => s.course === courses[ref].id && s.sem > years * 2);
      if (tooHigh.length) err.years = `${tooHigh.map(s => s.id).join(', ')} ${tooHigh.length > 1 ? 'are' : 'is'} in a later semester than ${years} year(s) allows.`;
    }
    if (!Object.keys(err).length) record = { id: code, name, dept: v.dept, years };
  }

  if (entity === 'sections') {
    const name = String(v.name || '').trim(), strength = intOrNull(v.strength), groups = intOrNull(v.groups) ?? 0;
    const course = courses.find(x => x.id === v.course), sem = intOrNull(v.sem);
    if (!name) err.name = 'Enter a section name, like CSE-3A.';
    else if (name.includes('/')) err.name = 'A section name can\'t contain "/".';
    else if (taken(c.sections.filter((_, i) => i !== ref).map(s => s.id), name)) err.name = `${name} already exists.`;
    if (!course) err.course = v.course ? `No course "${v.course}". Add it on the Courses tab first.` : 'Choose a course.';
    else if (!isInt(sem, 1, course.years * 2)) err.sem = `${course.name} has semesters 1–${course.years * 2}.`;
    if (!isInt(strength, 1, 1000)) err.strength = 'Enter the number of students (1–1000).';
    if (!isInt(groups, 0, 6)) err.groups = 'Lab groups must be between 0 and 6.';
    if (ref != null && !err.groups && groups < c.sections[ref].subs.length) {
      const old = c.sections[ref];
      const removed = old.subs.slice(groups).map(u => `${old.id}/${u.label}`);
      const used = assignmentsOf(c, a => removed.includes(a[1]));
      if (used) err.groups = `Lab groups ${removed.map(g => g.split('/')[1]).join(', ')} still have ${used} lab class(es). Remove those first.`;
    }
    if (!Object.keys(err).length) {
      // Editing keeps the existing lab group names (A1, A2…) even if the section is renamed.
      const oldSubs = ref != null ? c.sections[ref].subs : [];
      const prefix = oldSubs.length ? oldSubs[0].label.replace(/\d+$/, '') : null;
      const labels = prefix ? Array.from({ length: groups }, (_, i) => `${prefix}${i + 1}`) : labLabels(c, name, groups), base = Math.floor(strength / Math.max(groups, 1)), extra = strength - base * groups;
      record = { id: name, dept: course.dept, course: course.id, sem, strength, subs: labels.map((label, i) => ({ label, strength: base + (i < extra ? 1 : 0) })) };
    }
  }

  if (entity === 'teachers') {
    const name = String(v.name || '').trim(), max = intOrNull(v.max);
    if (!name) err.name = 'Enter the teacher\'s name.';
    else if (taken(c.teachers.filter((_, i) => i !== ref).map(t => t.name), name)) err.name = `${name} is already in the list.`;
    if (!deptIds.includes(v.dept)) err.dept = v.dept ? `No department "${v.dept}". Use one of: ${deptIds.join(', ')}.` : 'Choose a department.';
    if (!isInt(max, 1, ix.P.length)) err.max = `Enter 1–${ix.P.length} periods.`;
    if (v.offError) err.off = v.offError;
    if (!Object.keys(err).length) {
      let id = ref != null ? c.teachers[ref].id : null;
      for (let n = c.teachers.length + 1; !id; n++) if (!ix.teachers[`T${n}`]) id = `T${n}`;
      record = { id, name, dept: v.dept, max, off: v.off.length ? v.off : undefined };
    }
  }

  if (entity === 'rooms') {
    const name = String(v.name || '').trim(), cap = intOrNull(v.cap);
    if (!name) err.name = 'Enter a room name, like LH-103.';
    else if (taken(c.rooms.filter((_, i) => i !== ref).map(r => r.id), name)) err.name = `${name} already exists.`;
    if (!roomTypes(c).includes(v.type)) err.type = `Unknown room type "${v.type}". Use one of: ${roomTypes(c).map(typeName).join(', ')}.`;
    if (!isInt(cap, 1, 1000)) err.cap = 'Enter how many students fit (1–1000).';
    if (v.owner !== 'Shared' && !deptIds.includes(v.owner)) err.owner = `Owner must be "Shared" or a department: ${deptIds.join(', ')}.`;
    if (!Object.keys(err).length) record = { id: name, type: v.type, cap, owner: v.owner };
  }

  if (entity === 'subjects') {
    const code = String(v.code || '').trim().toUpperCase(), name = String(v.name || '').trim(), per = intOrNull(v.perWeek);
    const maxWeek = S.days.length * S.rules.maxSameSubjectPerDay;
    if (!code) err.code = 'Enter a subject code, like CS305.';
    else if (!/^[A-Z0-9-]+$/.test(code)) err.code = 'Use letters, numbers and "-" only.';
    else if (taken(Object.keys(c.subjects).filter(k => k !== ref), code)) err.code = `${code} already exists.`;
    if (!name) err.name = 'Enter the subject name.';
    if (!KIND[v.kind]) err.kind = 'Type must be Lecture, Tutorial or Lab.';
    if (v.kind === 'lab' && !labRoomTypes(c).includes(v.room)) err.room = `Choose the lab it needs: ${labRoomTypes(c).map(typeName).join(', ')}.`;
    if (per !== null && v.kind !== 'lab' && !isInt(per, 1, maxWeek)) err.perWeek = `Enter 1–${maxWeek}, or leave blank to use the college rule.`;
    if (per !== null && v.kind === 'lab' && !isInt(per, 1, 20)) err.perWeek = 'Enter a whole number of periods, or leave blank.';
    if (v.dept && !deptIds.includes(v.dept)) err.dept = `No department "${v.dept}". Use one of: ${deptIds.join(', ')}, or leave blank for a common subject.`;
    if (!Object.keys(err).length) {
      record = { code, subject: { short: String(v.short || '').trim() || name.slice(0, 14), name, kind: v.kind } };
      if (v.kind === 'lab') record.subject.room = v.room;
      if (per !== null) record.subject.perWeek = per;
      if (v.dept) record.subject.dept = v.dept;
    }
  }

  if (entity === 'assignments') {
    const s = c.subjects[v.subject], G = ix.groups[v.group], per = intOrNull(v.periods);
    if (!v.subject) err.subject = 'Choose a subject.';
    else if (!s) err.subject = `No subject with code "${v.subject}".`;
    if (!v.group) err.group = 'Choose who it is taught to.';
    else if (!G) err.group = `No section or lab group called "${v.group}".`;
    else if (s && s.kind === 'lab' && !G.isSub) err.group = `${s.short} is a lab, so choose a lab group (like ${ix.subsOf[G.section][0] ? gLabel(c, ix.subsOf[G.section][0]) : 'A1'}).`;
    else if (s && s.kind !== 'lab' && G.isSub) err.group = 'Lectures and tutorials are taught to the whole section.';
    if (!v.teacher) err.teacher = 'Choose a teacher.';
    else if (!ix.teachers[v.teacher]) err.teacher = `No teacher called "${v.teacher}".`;
    if (s && G && c.assignments.some((a, i) => i !== ref && a[0] === v.subject && a[1] === v.group)) err.subject = `${s.short} is already assigned to ${gLabel(c, v.group)}.`;
    if (s && G && seen.has(`${v.subject}|${v.group}`.toLowerCase())) err.subject = `${s.short} for ${gLabel(c, v.group)} appears twice in this file.`;
    if (per !== null && !isInt(per, 1, S.days.length * ix.P.length)) err.periods = 'Enter a whole number of periods, or leave blank.';
    if (per !== null && s?.kind === 'lab' && per % S.labBlock) err.periods = `Labs run in blocks of ${S.labBlock} periods, so use a multiple of ${S.labBlock}.`;
    if (!Object.keys(err).length) record = per === null ? [v.subject, v.group, v.teacher] : [v.subject, v.group, v.teacher, per];
  }
  return { errors: err, record };
}
const uniqueKey = (entity, record) => ({
  departments: () => record.id, courses: () => record.id,
  sections: () => record.id, teachers: () => record.name, rooms: () => record.id,
  subjects: () => record.code, assignments: () => `${record[0]}|${record[1]}`,
}[entity]().toLowerCase());

/* ---- write a checked record into the college (handles renames) ---- */
function saveRecord(c, entity, record, ref) {
  if (entity === 'departments') {
    if (ref == null) { c.departments.push(record); return; }
    const old = c.departments[ref].id;
    if (old !== record.id) {
      [...(c.courses || []), ...c.sections, ...c.teachers, ...Object.values(c.subjects)].forEach(x => { if (x.dept === old) x.dept = record.id; });
      c.rooms.forEach(r => { if (r.owner === old) r.owner = record.id; });
    }
    c.departments[ref] = record;
  } else if (entity === 'courses') {
    c.courses ||= [];
    if (ref == null) { c.courses.push(record); return; }
    const old = c.courses[ref].id;
    c.sections.forEach(s => { if (s.course === old) { s.course = record.id; s.dept = record.dept; } });
    c.courses[ref] = record;
  } else if (entity === 'sections') {
    if (ref == null) { c.sections.push(record); return; }
    const old = c.sections[ref];
    c.assignments.forEach(a => {
      if (a[1] === old.id) a[1] = record.id;
      const i = old.subs.findIndex(u => a[1] === `${old.id}/${u.label}`);
      if (i >= 0) a[1] = `${record.id}/${record.subs[i].label}`;
    });
    c.sections[ref] = record;
  } else if (entity === 'teachers') {
    ref == null ? c.teachers.push(record) : (c.teachers[ref] = record);
  } else if (entity === 'rooms') {
    ref == null ? c.rooms.push(record) : (c.rooms[ref] = record);
  } else if (entity === 'subjects') {
    if (ref != null && ref !== record.code) {
      const rebuilt = {};
      Object.entries(c.subjects).forEach(([k, s]) => rebuilt[k === ref ? record.code : k] = k === ref ? record.subject : s);
      c.subjects = rebuilt;
      c.assignments.forEach(a => { if (a[0] === ref) a[0] = record.code; });
    } else c.subjects[record.code] = record.subject;
  } else {
    ref == null ? c.assignments.push(record) : (c.assignments[ref] = record);
  }
}

function deleteBlockReason(c, entity, ref) {
  if (entity === 'departments') {
    const id = c.departments[ref].id;
    const used = [['course', (c.courses || []).filter(x => x.dept === id).length], ['teacher', c.teachers.filter(t => t.dept === id).length],
                  ['subject', Object.values(c.subjects).filter(s => s.dept === id).length]].filter(([, n]) => n);
    return used.length ? `${id} still has ${used.map(([w, n]) => `${n} ${w}${n > 1 ? 's' : ''}`).join(', ')}. Move or delete those first.` : null;
  }
  if (entity === 'courses') {
    const x = c.courses[ref], n = c.sections.filter(s => s.course === x.id).length;
    return n ? `${x.name} has ${n} section(s). Move or delete those first.` : null;
  }
  if (entity === 'sections') {
    const s = c.sections[ref], n = assignmentsOf(c, a => a[1] === s.id || a[1].startsWith(`${s.id}/`));
    return n ? `${s.id} has ${n} teaching assignment(s). Delete those first.` : null;
  }
  if (entity === 'teachers') {
    const t = c.teachers[ref], n = assignmentsOf(c, a => a[2] === t.id);
    return n ? `${t.name} teaches ${n} class(es). Give them to another teacher or delete them first.` : null;
  }
  if (entity === 'subjects') {
    const n = assignmentsOf(c, a => a[0] === ref);
    return n ? `${c.subjects[ref].short} is taught in ${n} class(es). Delete those first.` : null;
  }
  return null;
}
const recordName = (c, entity, ref) => ({
  departments: () => `${c.departments[ref].id} (${c.departments[ref].name})`, courses: () => c.courses[ref].name,
  sections: () => c.sections[ref].id, teachers: () => c.teachers[ref].name, rooms: () => c.rooms[ref].id,
  subjects: () => `${ref} ${c.subjects[ref].name}`,
  assignments: () => { const a = c.assignments[ref]; return `${c.subjects[a[0]].short} for ${gLabel(c, a[1])}`; },
}[entity]());

/* ---- modal actions ---- */
function openForm(entity, ref = null) {

  render();
}
function mv(field, value, rerender) {

  if (field === 'subject' && state.modal.entity === 'assignments') state.modal.values.group = '';
  if (rerender) render();
}
function toggleOff(day, period) {
  const off = state.modal.values.off, i = off.findIndex(([d, p]) => d === day && p === period);
  i >= 0 ? off.splice(i, 1) : off.push([day, period]);
}
function saveForm() {

}
function askDelete(entity, ref) {

  render();
}

  else c[entity].splice(ref, 1);
  dataChanged(c, `Deleted ${name}.`);
}
function closeModal() { state.modal = null; render(); }

/* ---- import: Excel (.xlsx) or CSV ---- */
function openImport(entity) { state.modal = { kind: 'import', entity, results: null, file: null }; render(); }
function setImportEntity(entity) { state.modal = { kind: 'import', entity, results: null, file: null }; render(); }

function downloadTemplate(entity) {
  const c = col(), cols = COLUMNS[entity];
  const rows = [cols.map(([h]) => h), ...exampleRows(c, entity).slice(0, 2).map(r => cols.map(([h]) => r[h] ?? ''))];
  const name = `samay-${entity}-template`;
  if (window.XLSX) {
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), ENT[entity].label.slice(0, 31));
    XLSX.writeFile(wb, `${name}.xlsx`);
  } else {
    const csv = rows.map(r => r.map(x => `"${String(x).replace(/"/g, '""')}"`).join(',')).join('\n');
    const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(new Blob([csv], { type: 'text/csv' })), download: `${name}.csv` });
    a.click();
  }
  toast('Template downloaded. Fill it in, then upload it here.');
}

function parseCsv(text) {
  const rows = [], re = /("([^"]|"")*"|[^,\r\n]*)(,|\r?\n|$)/g;
  let row = [], m;
  while ((m = re.exec(text)) && m[0] !== '') {
    row.push(m[1].startsWith('"') ? m[1].slice(1, -1).replace(/""/g, '"') : m[1]);
    if (m[3] !== ',') { rows.push(row); row = []; }
  }
  const [head = [], ...body] = rows.filter(r => r.some(x => x.trim() !== ''));
  return body.map(r => Object.fromEntries(head.map((h, i) => [h, r[i] ?? ''])));
}

async function readImport(file) {
  if (!file) return;
  let rows;
  try {
    if (window.XLSX) {
      const wb = XLSX.read(await file.arrayBuffer());
      rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: '', raw: false });
    } else rows = parseCsv(await file.text());
  } catch (e) {
    state.modal.results = null; state.modal.fileError = 'This file couldn\'t be read. Save it as .xlsx or .csv and try again.'; render(); return;
  }
  state.modal.file = file.name; state.modal.fileError = null;
  checkImportRows(rows);
}

// Turns spreadsheet text into form values: accepts names as well as codes ("Dr. A. Kumar", "Computer lab", "CSE-3A A1").
function normalizeRow(c, entity, raw) {
  const ix = idx(c), get = h => {
    const k = Object.keys(raw).find(x => x.trim().toLowerCase() === h.toLowerCase());
    return k ? String(raw[k]).trim() : '';
  };
  const v = {};
  COLUMNS[entity].forEach(([h, f]) => v[f] = get(h));
  const dept = x => c.departments.find(d => d.id.toLowerCase() === x.toLowerCase() || d.name.toLowerCase() === x.toLowerCase())?.id ?? x;
  if ('dept' in v) v.dept = /^(common|all|shared)$/i.test(v.dept) ? '' : dept(v.dept);
  if (entity === 'departments') v.code = v.code.toUpperCase();
  if (entity === 'courses' && v.years === '') v.years = '4';
  if (entity === 'sections') {
    const x = (c.courses || []).find(o => o.id.toLowerCase() === v.course.toLowerCase() || o.name.toLowerCase() === v.course.toLowerCase());
    if (x) v.course = x.id;
  }
  if (entity === 'rooms') {
    v.type = roomTypes(c).find(t => t === v.type || typeName(t).toLowerCase() === v.type.toLowerCase()) ?? v.type;
    v.owner = !v.owner || v.owner.toLowerCase() === 'shared' ? 'Shared' : dept(v.owner);
  }
  if (entity === 'sections' && v.groups === '') v.groups = '0';
  if (entity === 'teachers') {
    if (v.max === '') v.max = String(c.scheme.rules.teacherMaxPerDay);
    const text = v.off;
    v.off = [];
    text.split(/[;,]/).map(x => x.trim()).filter(Boolean).forEach(part => {
      const m = part.match(/^(\w{3})\w*\s*P?(\d+)(?:\s*[-–]\s*P?(\d+))?$/i);
      const day = m && c.scheme.days.find(d => d.toLowerCase() === m[1].toLowerCase());
      if (!m || !day) { v.offError = `Can't read "${part}". Write it like "Mon P1; Wed P5-P7".`; return; }
      for (let p = +m[2]; p <= +(m[3] || m[2]); p++) {
        if (!ix.P.includes(p)) { v.offError = `There is no period P${p}.`; return; }
        v.off.push([day, p]);
      }
    });
  }
  if (entity === 'subjects') {
    const k = v.kind.toLowerCase();
    v.kind = k === 'lecture' || k === 'theory' ? 'theory' : k === 'tutorial' ? 'tutorial' : k === 'lab' || k === 'practical' ? 'lab' : v.kind;
    v.room = labRoomTypes(c).find(t => t === v.room || typeName(t).toLowerCase() === v.room.toLowerCase()) ?? v.room;
  }
  if (entity === 'assignments') {
    v.subject = v.subject.toUpperCase();
    const g = v.group.replace(/\s+/g, ' ');
    v.group = Object.keys(ix.groups).find(id => id.toLowerCase() === g.toLowerCase() || gLabel(c, id).toLowerCase() === g.toLowerCase()) ?? v.group;
    v.teacher = c.teachers.find(t => t.name.toLowerCase() === v.teacher.toLowerCase() || t.id.toLowerCase() === v.teacher.toLowerCase())?.id ?? v.teacher;
  }
  return v;
}

function checkImportRows(rows) {
  const c = col(), m = state.modal, seen = new Set();
  m.results = rows.map((raw, i) => {
    const values = normalizeRow(c, m.entity, raw);
    const { errors, record } = validateValues(c, m.entity, values, null, seen);
    if (record) seen.add(uniqueKey(m.entity, record));
    return { row: i + 2, raw, record, errors: Object.values(errors) };
  });
  render();
}

function commitImport() {

/* ---- modal rendering ---- */
const fieldErr = (m, f) => m.errors?.[f] ? `<p class="mt-1 text-xs text-red-600">${esc(m.errors[f])}</p>` : '';
const inputCls = bad => `w-full rounded-lg border ${bad ? 'border-red-400' : 'border-slate-200'} bg-white px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500`;
function fInput(m, f, label, { type = 'text', placeholder = '', hint = '' } = {}) {
  return `<label class="block"><span class="mb-1 block text-sm font-medium text-slate-700">${label}</span>
    <input type="${type}" value="${esc(m.values[f])}" placeholder="${esc(placeholder)}" oninput="mv('${f}', this.value)" class="${inputCls(m.errors?.[f])}"/>
    ${hint ? `<p class="mt-1 text-xs text-slate-500">${hint}</p>` : ''}${fieldErr(m, f)}</label>`;
}
// Options are [value, label] pairs, or { group, items } for a labelled group (shown as <optgroup>).
function optionsHtml(options, selected) {
  const one = ([v, l]) => `<option value="${esc(v)}" ${String(v) === String(selected) ? 'selected' : ''}>${esc(l)}</option>`;
  return options.map(o => o.group ? `<optgroup label="${esc(o.group)}">${o.items.map(one).join('')}</optgroup>` : one(o)).join('');
}
function fSelect(m, f, label, options, { rerender = false, hint = '' } = {}) {
  return `<label class="block"><span class="mb-1 block text-sm font-medium text-slate-700">${label}</span>
    <select onchange="mv('${f}', this.value, ${rerender})" class="${inputCls(m.errors?.[f])}">
      ${m.values[f] === '' ? '<option value="" selected disabled>Choose…</option>' : ''}
      ${optionsHtml(options, m.values[f])}
    </select>${hint ? `<p class="mt-1 text-xs text-slate-500">${hint}</p>` : ''}${fieldErr(m, f)}</label>`;
}
// Grouped pickers: sections by department and course, lab groups by section, teachers by department.
function sectionOptions(c, keep = () => true) {
  const out = [];
  c.departments.forEach(d => {
    const mine = c.sections.filter(s => s.dept === d.id && keep(s));
    const byCourse = {};
    mine.forEach(s => (byCourse[s.course || ''] ||= []).push(s));
    Object.entries(byCourse).forEach(([cid, list]) => out.push({
      group: `${d.id} · ${courseOf(c, cid)?.name || 'No course'}`,
      items: list.sort((a, b) => (a.sem ?? 0) - (b.sem ?? 0) || a.id.localeCompare(b.id)).map(s => [s.id, s.sem ? `${s.id} (Sem ${s.sem})` : s.id]),
    }));
  });
  return out;
}
function labGroupOptions(c) {
  const ix = idx(c);
  return c.sections.filter(s => ix.subsOf[s.id].length).map(s => ({ group: `${s.dept} · ${s.id}`, items: ix.subsOf[s.id].map(g => [g, gLabel(c, g)]) }));
}
function teacherOptions(c, firstDept) {
  const order = [...c.departments].sort((a, b) => (b.id === firstDept) - (a.id === firstDept));
  return order.map(d => ({
    group: `${d.name}${firstDept && d.id !== firstDept ? ' (guest)' : ''}`,
    items: c.teachers.filter(t => t.dept === d.id).map(t => [t.id, t.name]),
  })).filter(g => g.items.length);
}

/* ==========================================================================
   SCHEME EDITOR: each college sets its own week (days, periods, breaks) and
   rules. Saving re-checks existing data against the new scheme.
=========================================================================== */
const ALL_DAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
const BREAK_NAMES = ['Lunch', 'Tea', 'Short break', 'Assembly'];
const toMin = t => { const m = /^([01]?\d|2[0-3]):([0-5]\d)$/.exec(String(t || '')); return m ? +m[1] * 60 + +m[2] : null; };
const toTime = n => `${String(Math.floor(n / 60) % 24).padStart(2, '0')}:${String(n % 60).padStart(2, '0')}`;
function labGroupsText(c) {
  const s = c.sections.find(x => x.subs.length);
  if (!s) return 'None';
  const counts = [...new Set(c.sections.map(x => x.subs.length).filter(Boolean))];
  return `${s.subs.map(u => u.label).join(', ')} (${counts.join(' or ')} per section)`;
}

function openScheme() {
  const S = col().scheme;
  state.modal = {
    kind: 'scheme', errors: {},
    values: {
      days: [...S.days],
      periods: S.periods.map(([, start, end], i) => ({ start, end, brk: S.breaks.find(b => b.after === i + 1)?.label || '' })),
      lecturesPerWeek: String(S.rules.lecturesPerWeek), labSessionsPerWeek: String(S.rules.labSessionsPerWeek),
      labBlock: String(S.labBlock), maxSame: String(S.rules.maxSameSubjectPerDay), teacherMax: String(S.rules.teacherMaxPerDay),
      theoryRoomType: S.theoryRoomType, labNaming: S.labPrefix === 'section' ? 'section' : 'prefix', labPrefix: S.labPrefix === 'section' ? 'G' : S.labPrefix,
    },
  };
  render();
}
function sv(field, value, rerender) { state.modal.values[field] = value; if (rerender) render(); }
function pv(i, field, value, rerender) { state.modal.values.periods[i][field] = value; if (rerender) render(); }
function toggleDay(d) {
  const days = state.modal.values.days, i = days.indexOf(d);
  i >= 0 ? days.splice(i, 1) : days.push(d);
}
function addPeriod() {
  const ps = state.modal.values.periods, last = ps.at(-1);
  const len = last ? (toMin(last.end) ?? 0) - (toMin(last.start) ?? 0) || 50 : 50, start = last ? toMin(last.end) ?? 540 : 540;
  ps.push({ start: toTime(start), end: toTime(start + len), brk: '' });
  render();
}
function removePeriod(i) { state.modal.values.periods.splice(i, 1); if (state.modal.values.periods.length) state.modal.values.periods.at(-1).brk = ''; render(); }

function checkScheme(c, v) {
  const err = {}, ps = v.periods, days = ALL_DAYS.filter(d => v.days.includes(d));
  const n = k => intOrNull(v[k]);
  if (!days.length) err.days = 'Choose at least one working day.';
  if (!ps.length) err.periods = 'Add at least one period.';
  ps.forEach((p, i) => {
    const s = toMin(p.start), e = toMin(p.end), label = `P${i + 1}`;
    if (s === null || e === null) err.periods ||= `${label}: enter start and end times.`;
    else if (e <= s) err.periods ||= `${label} must end after it starts.`;
    if (i > 0 && s !== null) {
      const prevEnd = toMin(ps[i - 1].end), brk = ps[i - 1].brk;
      if (prevEnd !== null && s < prevEnd) err.periods ||= `${label} starts before P${i} ends.`;
      else if (prevEnd !== null && s > prevEnd && !brk) err.periods ||= `There's a gap between P${i} and ${label} (${ps[i - 1].end}–${p.start}). Mark it as a break, or close the gap.`;
      else if (prevEnd !== null && s === prevEnd && brk) err.periods ||= `${brk} after P${i} has no time. Leave a gap between P${i} and ${label}.`;
    }
  });
  if (ps.length && ps.at(-1).brk) err.periods ||= 'A break can\'t come after the last period.';

  const maxSame = n('maxSame'), lectures = n('lecturesPerWeek'), labSessions = n('labSessionsPerWeek'), block = n('labBlock'), tmax = n('teacherMax');
  if (!isInt(maxSame, 1, 4)) err.maxSame = 'Enter 1–4.';
  const weekCap = days.length * (maxSame || 1);
  if (!isInt(lectures, 1, Math.max(1, weekCap))) err.lecturesPerWeek = `Enter 1–${weekCap} (days × same subject per day).`;
  if (!isInt(labSessions, 1, 7)) err.labSessionsPerWeek = 'Enter 1–7.';
  if (!isInt(block, 1, Math.max(1, ps.length))) err.labBlock = `Enter 1–${ps.length || 1} periods.`;
  if (!isInt(tmax, 1, Math.max(1, ps.length))) err.teacherMax = `Enter 1–${ps.length || 1} periods.`;
  if (v.labNaming === 'prefix' && !/^[A-Za-z]{1,3}$/.test(String(v.labPrefix || '').trim())) err.labPrefix = 'Use 1–3 letters, like G or L.';

  // Existing data must still fit the new scheme.
  if (!err.maxSame) {
    const tooMany = Object.entries(c.subjects).filter(([, s]) => s.kind !== 'lab' && s.perWeek > weekCap).map(([k]) => k);
    if (tooMany.length) err.lecturesPerWeek ||= `${tooMany.join(', ')} need more lectures than this week allows (${weekCap}). Change those subjects first.`;
  }
  if (!err.labBlock) {
    const odd = c.assignments.filter(a => c.subjects[a[0]].kind === 'lab' && a[3] != null && a[3] % block).map(a => `${c.subjects[a[0]].short} (${gLabel(c, a[1])})`);
    if (odd.length) err.labBlock = `These labs have ${odd.length > 1 ? 'periods that aren\'t' : 'a period count that isn\'t'} a multiple of ${block}: ${odd.slice(0, 3).join(', ')}${odd.length > 3 ? '…' : ''}.`;
  }
  return { err, days };
}

function saveScheme() {
  const c = col(), v = state.modal.values, { err, days } = checkScheme(c, v);
  if (Object.keys(err).length) { state.modal.errors = err; render(); return; }
  const ps = v.periods;
  // Teacher unavailability on days or periods that no longer exist is dropped.
  let dropped = 0;
  c.teachers.forEach(t => {
    if (!t.off) return;
    const keep = t.off.filter(([d, p]) => days.includes(d) && p <= ps.length);
    dropped += t.off.length - keep.length;
    t.off = keep.length ? keep : undefined;
  });
  c.scheme = {
    ...c.scheme,
    days,
    periods: ps.map((p, i) => [`P${i + 1}`, p.start, p.end]),
    breaks: ps.map((p, i) => p.brk ? { after: i + 1, label: p.brk, time: `${p.end}–${ps[i + 1].start}` } : null).filter(Boolean),
    theoryRoomType: v.theoryRoomType,
    labBlock: intOrNull(v.labBlock),
    labPrefix: v.labNaming === 'section' ? 'section' : String(v.labPrefix).trim().toUpperCase(),
    rules: {
      ...c.scheme.rules,
      lecturesPerWeek: intOrNull(v.lecturesPerWeek), labSessionsPerWeek: intOrNull(v.labSessionsPerWeek),
      maxSameSubjectPerDay: intOrNull(v.maxSame), teacherMaxPerDay: intOrNull(v.teacherMax),
    },
  };
  dataChanged(c, `Scheme saved.${dropped ? ` ${dropped} unavailable slot(s) on removed days or periods were cleared.` : ''}`);
}

function schemeForm(c, m) {
  const v = m.values, e = m.errors || {};
  const err = f => e[f] ? `<p class="mt-1 text-xs text-red-600">${esc(e[f])}</p>` : '';
  const num = (f, label, hint) => `<label class="block"><span class="mb-1 block text-sm font-medium text-slate-700">${label}</span>
    <input type="number" value="${esc(v[f])}" oninput="sv('${f}', this.value)" class="${inputCls(e[f])}"/>
    ${hint ? `<p class="mt-1 text-xs text-slate-500">${hint}</p>` : ''}${err(f)}</label>`;
  const section = (title, sub, body) => `<div><div class="text-sm font-semibold text-slate-900">${title}</div><p class="mb-2 text-xs text-slate-500">${sub}</p>${body}</div>`;
  const theoryTypes = [...new Set([c.scheme.theoryRoomType, ...c.rooms.map(r => r.type)])].filter(t => !labRoomTypes(c).includes(t) || t === c.scheme.theoryRoomType);

  return `
    <div class="rounded-lg bg-amber-50 p-3 text-xs text-amber-900">Changing the scheme clears the current timetable. Generate again after saving.</div>
    ${section('Working days', 'Days when classes run.', `<div class="flex flex-wrap gap-2">${ALL_DAYS.map(d => `
      <label class="flex cursor-pointer items-center gap-2 rounded-lg border border-slate-200 px-3 py-1.5 text-sm hover:bg-slate-50">
        <input type="checkbox" ${v.days.includes(d) ? 'checked' : ''} onchange="toggleDay('${d}')" class="h-4 w-4 accent-indigo-600"/>${d}</label>`).join('')}</div>${err('days')}`)}
    ${section('Periods and breaks', 'Times are the same every working day. Mark a break after any period; labs never run across a break.', `
      <div class="overflow-x-auto rounded-lg border border-slate-200"><table class="w-full text-sm">
        <thead class="bg-slate-50 text-xs text-slate-500"><tr><th class="px-3 py-2 text-left font-medium">Period</th><th class="px-3 py-2 text-left font-medium">Starts</th>
          <th class="px-3 py-2 text-left font-medium">Ends</th><th class="px-3 py-2 text-left font-medium">Break after it</th><th></th></tr></thead>
        <tbody class="divide-y divide-slate-100">${v.periods.map((p, i) => `<tr>
          <td class="px-3 py-2 font-medium">P${i + 1}</td>
          <td class="px-3 py-1.5"><input type="time" value="${esc(p.start)}" oninput="pv(${i}, 'start', this.value)" class="rounded-md border border-slate-200 px-2 py-1"/></td>
          <td class="px-3 py-1.5"><input type="time" value="${esc(p.end)}" oninput="pv(${i}, 'end', this.value)" class="rounded-md border border-slate-200 px-2 py-1"/></td>
          <td class="px-3 py-1.5">${i === v.periods.length - 1 ? '<span class="text-xs text-slate-400">End of day</span>' : `
            <select onchange="pv(${i}, 'brk', this.value)" class="rounded-md border border-slate-200 bg-white px-2 py-1">
              <option value="" ${!p.brk ? 'selected' : ''}>No break</option>
              ${[...new Set([...BREAK_NAMES, p.brk].filter(Boolean))].map(b => `<option ${b === p.brk ? 'selected' : ''}>${esc(b)}</option>`).join('')}
            </select>`}</td>
          <td class="px-3 py-1.5 text-right">${v.periods.length > 1 ? `<button onclick="removePeriod(${i})" class="rounded-md px-2 py-1 text-xs text-slate-500 hover:bg-red-50 hover:text-red-700">Remove</button>` : ''}</td>
        </tr>`).join('')}</tbody></table></div>
      <button onclick="addPeriod()" class="mt-2 text-sm font-medium text-indigo-600 hover:underline">+ Add period</button>${err('periods')}`)}
    ${section('Teaching rules', 'Defaults for every subject and teacher. A subject or teacher can still have its own number.', `
      <div class="grid gap-3 sm:grid-cols-3">
        ${num('lecturesPerWeek', 'Lectures per subject a week', 'For example 3.')}
        ${num('maxSame', 'Same subject per day, at most', 'Usually 1, so subjects spread over the week.')}
        ${num('teacherMax', 'Teacher periods a day, at most', 'Default for teachers.')}
      </div>`)}
    ${section('Labs', 'How practical classes run.', `
      <div class="grid gap-3 sm:grid-cols-3">
        ${num('labBlock', 'Lab length (periods)', 'Back-to-back periods per lab.')}
        ${num('labSessionsPerWeek', 'Lab sessions a week', 'Per lab subject, per lab group.')}
        <label class="block"><span class="mb-1 block text-sm font-medium text-slate-700">Name new lab groups</span>
          <select onchange="sv('labNaming', this.value, true)" class="${inputCls(false)}">
            <option value="section" ${v.labNaming === 'section' ? 'selected' : ''}>After the section (A1, A2)</option>
            <option value="prefix" ${v.labNaming === 'prefix' ? 'selected' : ''}>With a fixed letter (G1, G2)</option>
          </select>
          ${v.labNaming === 'prefix' ? `<input value="${esc(v.labPrefix)}" oninput="sv('labPrefix', this.value)" placeholder="G" class="mt-2 ${inputCls(e.labPrefix)}"/>${err('labPrefix')}` : ''}
          <p class="mt-1 text-xs text-slate-500">Existing lab groups keep their names.</p></label>
      </div>`)}
    ${section('Rooms', 'Where lectures and tutorials are held. Labs use the lab type set on each subject.', `
      <select onchange="sv('theoryRoomType', this.value)" class="${inputCls(false)} sm:max-w-xs">
        ${theoryTypes.map(t => `<option value="${t}" ${t === v.theoryRoomType ? 'selected' : ''}>${typeName(t)}s</option>`).join('')}
      </select>`)}`;
}

function schemePage() {
  const c = col(), S = c.scheme;
  const rows = [];
  S.periods.forEach(([l, s, e], i) => {
    rows.push(`<tr><td class="px-3 py-2 text-sm font-medium">${l}</td><td class="px-3 py-2 text-sm">${s} – ${e}</td><td class="px-3 py-2 text-sm text-slate-500">Class</td></tr>`);
    const b = S.breaks.find(b => b.after === i + 1);
    if (b) rows.push(`<tr class="bg-slate-50"><td class="px-3 py-2 text-sm font-medium text-slate-500">${b.label}</td><td class="px-3 py-2 text-sm text-slate-500">${b.time}</td><td class="px-3 py-2 text-sm text-slate-400">Break · no classes, labs can't run across it</td></tr>`);
  });
  return `
  <div class="mb-4 flex flex-wrap items-center justify-between gap-3">
    <div><h1 class="text-2xl font-semibold tracking-tight">College scheme</h1>
    <p class="text-sm text-slate-500">How ${c.name} runs its week. Every college sets its own.</p></div>
    ${btn('Edit scheme', 'openScheme()', 'primary', 'sliders')}
  </div>
  <div class="grid gap-4 lg:grid-cols-2">
    ${card(`<div class="mb-3 font-medium">Daily periods</div>
      <div class="mb-3 flex flex-wrap gap-1">${S.days.map(d => `<span class="rounded-md bg-indigo-50 px-2 py-1 text-xs font-medium text-indigo-700">${d}</span>`).join('')}</div>
      <table class="w-full"><tbody class="divide-y divide-slate-100">${rows.join('')}</tbody></table>`)}
    ${card(`<div class="mb-3 font-medium">Rules</div>
      <dl class="divide-y divide-slate-100 text-sm">
        ${[['Lectures per subject', `${S.rules.lecturesPerWeek} a week (a subject can override this)`],
           ['Lab sessions per subject', `${S.rules.labSessionsPerWeek} a week`],
           ['Lab length', `${S.labBlock} back-to-back periods`], ['Lab groups', labGroupsText(c)],
           ['New lab groups named', S.labPrefix === 'section' ? 'After the section (A1, A2…)' : `${esc(S.labPrefix)}1, ${esc(S.labPrefix)}2…`], ['Theory classes in', typeName(S.theoryRoomType) + 's'],
           ['Same subject per day', `At most ${S.rules.maxSameSubjectPerDay}`], ['Teacher default max a day', `${S.rules.teacherMaxPerDay} periods`],
           ['Room types', [...new Set(c.rooms.map(r => typeName(r.type)))].join(', ')]].map(([k, v]) => `<div class="flex justify-between gap-4 py-2"><dt class="text-slate-500">${k}</dt><dd class="text-right font-medium">${v}</dd></div>`).join('')}
      </dl>`)}
  </div>
  ${card(`<div class="flex gap-3"><div class="text-indigo-600">${icon('shield')}</div><div>
    <div class="font-medium">Your scheme, your rules</div>
    <p class="mt-1 text-sm text-slate-500">This scheme belongs to ${c.name} only. The generator and clash checker follow it instead of assuming a fixed week,
    so colleges with different days, periods, breaks or lecture counts all get correct timetables. No other college can see it.</p></div></div>`, 'mt-4')}`;
}

render();
</script>
</body>
</html>
