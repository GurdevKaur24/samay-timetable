# Render blueprint: one free web service runs the API and serves the app page (same address, so sign-in cookies work).
# The free plan has no permanent disk: the database is recreated with the demo colleges whenever the service restarts.
services:
  - type: web
    name: samay-timetable
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: SAMAY_COOKIE_SECURE   # Render serves HTTPS, so the sign-in cookie is never sent over plain HTTP
        value: "1"
      - key: SAMAY_DEMO_LOGIN      # one-click demo accounts for judges; set to 0 for a real college
        value: "1"
      - key: SAMAY_DEMO_READY      # at each start: generate + publish the demo college's timetable, student code DEMO-2026
        value: "1"
      - key: SAMAY_SOLVE_SECONDS   # the free plan's CPU is small: big colleges need longer
        value: "180"
      - key: SAMAY_SOLVER_WORKERS  # the free plan has a small share of one CPU
        value: "2"
      - key: ANTHROPIC_API_KEY     # optional: turns on the AI assistant; leave empty to keep it off
        sync: false
      - key: SAMAY_ASSISTANT_DAILY_LIMIT  # most AI questions a day for the whole site, so a public link can't drain the key
        value: "60"
      - key: SAMAY_PUBLIC_URL      # used in emailed invite and reset links
        value: https://samay-timetable.onrender.com
      # Optional email for invites and password resets (without it, Samay shows the links to copy):
      # SAMAY_SMTP_HOST, SAMAY_SMTP_PORT (587), SAMAY_SMTP_USER, SAMAY_SMTP_PASSWORD, SAMAY_EMAIL_FROM
