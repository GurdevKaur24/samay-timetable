// Common room types every college can pick from; a college can also add its own (e.g. "Language lab").
const ROOM_TYPE = { lecture: 'Lecture hall', classroom: 'Classroom', seminar_hall: 'Seminar hall', computer_lab: 'Computer lab',
  electronics_lab: 'Electronics lab', science_lab: 'Science lab', physics_lab: 'Physics lab', chemistry_lab: 'Chemistry lab',
  workshop: 'Workshop', drawing_hall: 'Drawing hall' };
const KIND = {
  theory: { label: 'Lecture', cls: 'bg-sky-50 border-sky-200 text-sky-950', dot: 'bg-sky-400' },
  tutorial: { label: 'Tutorial', cls: 'bg-amber-50 border-amber-200 text-amber-950', dot: 'bg-amber-400' },
  lab: { label: 'Lab', cls: 'bg-emerald-50 border-emerald-200 text-emerald-950', dot: 'bg-emerald-500' },
};

/* ------------------------------ helpers ------------------------------ */
const typeName = t => ROOM_TYPE[t] || String(t || '').replace(/_/g, ' ').replace(/^\w/, ch => ch.toUpperCase());
const key = (...k) => k.join('|');
const rotate = (arr, n) => arr.map((_, i) => arr[(i + n) % arr.length]);

function idx(c) {
  if (c._ix) return c._ix;
  const groups = {}, subsOf = {};
  c.sections.forEach(s => {
    groups[s.id] = { id: s.id, section: s.id, label: s.id, strength: s.strength, isSub: false };
    subsOf[s.id] = [];
    (s.subs || []).forEach(u => {
      const id = `${s.id}/${u.label}`;
      groups[id] = { id, section: s.id, label: u.label, strength: u.strength, isSub: true };
      subsOf[s.id].push(id);
    });
  });
  // Elective batches: each is its own group (the students who chose it); `electives` lists the sections it keeps busy.
  const electives = {};
  (c.electives || []).forEach(e => { electives[e.id] = { name: e.name, sections: [...e.sections], batches: [] }; });
  electiveBatches(c).forEach(b => {
    groups[b.id] = { id: b.id, section: b.id, label: b.label, strength: b.strength, isSub: false, elective: b.elective };
    electives[b.elective].batches.push(b.id);
  });
  // Reserved times: section|day|period -> what it's kept free for.
  const reservedAt = new Map();
  (c.reserved || []).forEach(r => r.sections.forEach(sec => r.slots.forEach(([d, p]) => reservedAt.set(key(sec, d, p), r.name))));
  c._ix = {
    groups, subsOf, electives, reservedAt,
    teachers: Object.fromEntries(c.teachers.map(t => [t.id, t])),
    rooms: Object.fromEntries(c.rooms.map(r => [r.id, r])),
    P: c.scheme.periods.map((_, i) => i + 1),
    breaksAfter: new Map(c.scheme.breaks.map(b => [b.after, b])),
  };
  return c._ix;
}
// Periods a week: the assignment's own number, else the subject's, else the college rule.
function weekly(c, subjectId, override) {
  const s = c.subjects[subjectId], R = c.scheme.rules;
  if (override != null) return override;
  if (s.perWeek != null) return s.perWeek;
  return s.kind === 'lab' ? R.labSessionsPerWeek * c.scheme.labBlock : R.lecturesPerWeek;
}
function A(c) {
  return c._A || (c._A = [...c.assignments.map((a, i) => ({ i, subject: a[0], group: a[1], teacher: a[2], periods: weekly(c, a[0], a[3]) })),
    ...electiveBatches(c).map((b, k) => ({ i: c.assignments.length + k, subject: b.subject, group: b.id, teacher: b.teacher, periods: b.periods, elective: b.elective, id: b.id }))]);
}
// Each elective subject as batches of at most the elective class size (ids match the server's: GROUP~SUBJECT~N).
function electiveBatches(c) {
  const size = c.scheme.rules.electiveClassSize || 70;
  return (c.electives || []).flatMap(e => e.options.flatMap(o => {
    const s = c.subjects[o.subject];
    if (!s) return [];
    const n = o.batches || Math.max(1, Math.ceil(o.students / size));
    return Array.from({ length: n }, (_, k) => ({
      id: `${e.id}~${o.subject}~${k + 1}`, elective: e.id, subject: o.subject, teacher: o.teachers[k], label: n > 1 ? `${s.short}-${k + 1}` : s.short,
      strength: Math.floor(o.students / n) + (k < o.students % n ? 1 : 0), periods: e.periods ?? weekly(c, o.subject),
    })).filter(b => b.teacher);
  }));
}
// Server ids of A(c), in the same order (used to read and save timetables).
const allIds = c => A(c).map(a => a.id ?? c._ids?.[a.i] ?? assignmentId(a.i));
// The sections whose students a group is: its own section, or every section of an elective group.
const secsOf = (c, g) => { const G = idx(c).groups[g]; return G.elective ? idx(c).electives[G.elective].sections : [G.section]; };
const subj = (c, a) => c.subjects[a.subject];
const blockOf = (c, a) => subj(c, a).kind === 'lab' ? c.scheme.labBlock : 1;
const roomTypeOf = (c, a) => subj(c, a).room || c.scheme.theoryRoomType;
const gLabel = (c, g) => { const G = idx(c).groups[g]; return G.elective ? `${G.label} (${idx(c).electives[G.elective].name})` : G.isSub ? `${G.section} ${G.label}` : g; };
const pLabel = (c, p) => c.scheme.periods[p - 1][0];
const desc = (c, e) => { const a = A(c)[e.a]; return a.elective ? gLabel(c, a.group) : `${gLabel(c, a.group)} ${subj(c, a).short}`; };
const tMax = (c, t) => t.max || c.scheme.rules.teacherMaxPerDay;
function fmtOff(off) {
  const byDay = {};
  off.forEach(([d, p]) => (byDay[d] ||= []).push(p));
  return Object.entries(byDay).map(([d, ps]) => `${d} P${Math.min(...ps)}${ps.length > 1 ? '–P' + Math.max(...ps) : ''}`).join(', ');
}

/* ----------------------------------------------------------------------
   In-browser demo generator (greedy). The real app runs Google OR-Tools
   CP-SAT on the server; this lets the page work offline as a demo.
----------------------------------------------------------------------- */
// `fixed`: locked sessions [{ a, day, start, room }] placed first, exactly where they are.
function generate(c, fixed = []) {
  const ix = idx(c), S = c.scheme, days = S.days, P = ix.P;
  const AS = A(c);
  const busy = new Set(), entries = [], tLoad = {}, usedDay = new Set(), dayLoad = {}, unplaced = [];
  const roomsFor = a => c.rooms.filter(r => r.type === roomTypeOf(c, a) && r.cap >= ix.groups[a.group].strength);

  function groupFree(g, d, p) {
    const G = ix.groups[g];
    if (G.elective) return secsOf(c, g).every(s => groupFree(s, d, p));
    if (ix.reservedAt.has(key(G.section, d, p))) return false;
    if (busy.has(key('g', G.section, d, p))) return false;
    return G.isSub ? !busy.has(key('g', g, d, p)) : !ix.subsOf[g].some(s => busy.has(key('g', s, d, p)));
  }
  function can(a, d, s, r) {
    const b = blockOf(c, a), T = ix.teachers[a.teacher];
    if (s + b - 1 > P.length) return false;
    for (let q = s; q < s + b - 1; q++) if (ix.breaksAfter.has(q)) return false;
    if (usedDay.has(key(a.i, d))) return false;
    if ((tLoad[key(a.teacher, d)] || 0) + b > tMax(c, T)) return false;
    for (let p = s; p < s + b; p++) {
      if ((T.off || []).some(([od, op]) => od === d && op === p)) return false;
      if (busy.has(key('t', a.teacher, d, p)) || busy.has(key('r', r.id, d, p)) || !groupFree(a.group, d, p)) return false;
    }
    return true;
  }
  function put(a, d, s, r) {
    const b = blockOf(c, a), sec = ix.groups[a.group].section, placed = [];
    for (let p = s; p < s + b; p++) {
      busy.add(key('t', a.teacher, d, p)); busy.add(key('r', r.id, d, p)); busy.add(key('g', a.group, d, p));
      if (a.elective) secsOf(c, a.group).forEach(sec => busy.add(key('g', sec, d, p)));
      const e = { a: a.i, day: d, period: p, room: r.id };
      entries.push(e); placed.push(e);
    }
    tLoad[key(a.teacher, d)] = (tLoad[key(a.teacher, d)] || 0) + b;
    dayLoad[key(sec, d)] = (dayLoad[key(sec, d)] || 0) + b;
    usedDay.add(key(a.i, d));
    return { a, d, s, r, placed };
  }
  function undo(m) {
    const { a, d, s, r, placed } = m, b = blockOf(c, a), sec = ix.groups[a.group].section;
    for (let p = s; p < s + b; p++) {
      busy.delete(key('t', a.teacher, d, p)); busy.delete(key('r', r.id, d, p)); busy.delete(key('g', a.group, d, p));
      if (a.elective) secsOf(c, a.group).forEach(sec => busy.delete(key('g', sec, d, p)));
    }
    placed.forEach(e => entries.splice(entries.indexOf(e), 1));
    tLoad[key(a.teacher, d)] -= b; dayLoad[key(sec, d)] -= b; usedDay.delete(key(a.i, d));
  }

  const remaining = new Map(AS.map(a => [a.i, a.periods / blockOf(c, a)]));
  for (const f of fixed) {
    const a = AS[f.a], r = ix.rooms[f.room];
    if (!a || !r || remaining.get(a.i) <= 0) continue;
    put(a, f.day, f.start, r);
    remaining.set(a.i, remaining.get(a.i) - 1);
  }

  // 1) Labs: lab groups of a section go to different labs at the same time (rotation A1→Lab X, A2→Lab Y …).
  c.sections.forEach((sec, si) => {
    const subs = ix.subsOf[sec.id];
    if (!subs.length) return;
    const labs = subs.map(g => AS.filter(a => a.group === g && subj(c, a).kind === 'lab'));
    const rounds = Math.max(0, ...labs.map(l => l.length));
    for (let k = 0; k < rounds; k++) {
      const items = labs.map((l, i) => l.length ? l[(i + k) % l.length] : null).filter(a => a && remaining.get(a.i) > 0);
      let done = false;
      for (const d of rotate(days, (si * 2 + k * 2) % days.length)) {
        for (const s of rotate(P, (si + k) % P.length)) {
          const moves = [];
          let ok = true;
          for (const a of items) {
            const r = roomsFor(a).find(r => can(a, d, s, r));
            if (!r) { ok = false; break; }
            moves.push(put(a, d, s, r));
          }
          if (ok) { items.forEach(a => remaining.set(a.i, remaining.get(a.i) - 1)); done = true; break; }
          moves.reverse().forEach(undo);
        }
        if (done) break;
      }
    }
  });

  // 2) Everything left (lectures, tutorials, any lab that couldn't pair): least-busy day first, morning first.
  const order = AS.filter(a => remaining.get(a.i) > 0).sort((x, y) => blockOf(c, y) - blockOf(c, x) || y.periods - x.periods);
  for (const a of order) {
    const sec = ix.groups[a.group].section;
    for (let left = remaining.get(a.i); left > 0; left--) {
      const ds = [...days].sort((d1, d2) => (dayLoad[key(sec, d1)] || 0) - (dayLoad[key(sec, d2)] || 0) || days.indexOf(d1) - days.indexOf(d2));
      let placed = false;
      for (const d of ds) {
        for (const s of P) {
          const r = roomsFor(a).find(r => can(a, d, s, r));
          if (r) { put(a, d, s, r); placed = true; break; }
        }
        if (placed) break;
      }
      if (!placed) { unplaced.push(a); break; }
    }
  }
  return { entries, unplaced, at: new Date() };
}

/* ------------------- independent validator (hard rules) ------------------- */
function validate(c, entries) {
  const ix = idx(c), AS = A(c), messages = [], bad = new Set(), pairs = [];
  const group = fn => { const m = new Map(); entries.forEach((e, i) => { if (e.ghost) return; const k = fn(e); (m.get(k) || m.set(k, []).get(k)).push(i); }); return m; };
  const slot = e => `${e.day} ${pLabel(c, e.period)}`;
  const flag = (list, text) => { list.forEach(i => bad.add(i)); messages.push(text); pairs.push(list); };

  group(e => key(AS[e.a].teacher, e.day, e.period)).forEach(list => {
    if (list.length > 1) flag(list, `${ix.teachers[AS[entries[list[0]].a].teacher].name} is booked twice on ${slot(entries[list[0]])}: ${list.map(i => desc(c, entries[i])).join(' and ')}.`);
  });
  group(e => key(e.room, e.day, e.period)).forEach(list => {
    if (list.length > 1) flag(list, `${entries[list[0]].room} is double-booked on ${slot(entries[list[0]])}: ${list.map(i => desc(c, entries[i])).join(' and ')}.`);
  });
  group(e => key(ix.groups[AS[e.a].group].section, e.day, e.period)).forEach(list => {
    const whole = list.filter(i => !ix.groups[AS[entries[i].a].group].isSub);
    const subs = list.filter(i => ix.groups[AS[entries[i].a].group].isSub);
    const perSub = {};
    subs.forEach(i => (perSub[AS[entries[i].a].group] ||= []).push(i));
    if (whole.length > 1 || (whole.length && subs.length) || Object.values(perSub).some(l => l.length > 1))
      flag(list, `${ix.groups[AS[entries[list[0]].a].group].section} has overlapping classes on ${slot(entries[list[0]])}: ${list.map(i => desc(c, entries[i])).join(' and ')}.`);
  });
  // Electives: while any class of an elective group runs, its sections have no other class (and no other elective).
  const electiveAt = new Map();  // section|day|period -> { elective id: [entry indexes] }
  entries.forEach((e, i) => {
    if (e.ghost) return;
    const G = ix.groups[AS[e.a].group];
    if (!G.elective) return;
    ix.electives[G.elective].sections.forEach(s => { const k = key(s, e.day, e.period), m = electiveAt.get(k) || electiveAt.set(k, {}).get(k); (m[G.elective] ||= []).push(i); });
  });
  electiveAt.forEach((m, k) => {
    const ids = Object.keys(m);
    if (ids.length > 1) flag(ids.flatMap(id => m[id]), `${k.split('|')[0]} has ${ids.map(id => ix.electives[id].name).join(' and ')} at the same time.`);
  });
  entries.forEach((e, i) => {
    if (e.ghost || ix.groups[AS[e.a].group].elective) return;
    const m = electiveAt.get(key(ix.groups[AS[e.a].group].section, e.day, e.period));
    if (m) { const id = Object.keys(m)[0]; flag([i, ...m[id]], `${ix.groups[AS[e.a].group].section} has ${desc(c, e)} on ${slot(e)}, during ${ix.electives[id].name}.`); }
  });
  entries.forEach((e, i) => {
    if (e.ghost) return;
    const s = secsOf(c, AS[e.a].group).find(x => ix.reservedAt.has(key(x, e.day, e.period)));
    if (s) flag([i], `${s} has ${desc(c, e)} on ${slot(e)}, but that time is kept free for ${ix.reservedAt.get(key(s, e.day, e.period))}.`);
  });
  // The same rules the server's clash checker uses, so the page never offers a change the server would refuse.
  entries.forEach((e, i) => {
    if (e.ghost) return;
    const a = AS[e.a], T = ix.teachers[a.teacher], r = ix.rooms[e.room], G = ix.groups[a.group];
    if (!r || r.type !== roomTypeOf(c, a) || r.cap < G.strength) flag([i], `${e.room} doesn't suit ${desc(c, e)} on ${slot(e)} (needs a ${typeName(roomTypeOf(c, a)).toLowerCase()} for ${G.strength}).`);
    if ((T.off || []).some(([d, p]) => d === e.day && p === e.period)) flag([i], `${T.name} is unavailable on ${slot(e)} but teaches ${desc(c, e)}.`);
  });
  group(e => key(AS[e.a].teacher, e.day)).forEach(list => {
    const T = ix.teachers[AS[entries[list[0]].a].teacher];
    if (list.length > tMax(c, T)) flag(list, `${T.name} teaches ${list.length} periods on ${entries[list[0]].day}, above the limit of ${tMax(c, T)}.`);
  });
  group(e => key(e.a, e.day)).forEach(list => {
    const a = AS[entries[list[0]].a], b = blockOf(c, a);
    if (b === 1) return;
    const sorted = list.slice().sort((x, y) => entries[x].period - entries[y].period), ps = sorted.map(i => entries[i].period);
    let ok = ps.length % b === 0;
    for (let k = 0; ok && k < ps.length; k += b)
      for (let q = k; q < k + b - 1; q++)
        if (ps[q + 1] !== ps[q] + 1 || ix.breaksAfter.has(ps[q]) || entries[sorted[q]].room !== entries[sorted[q + 1]].room) ok = false;
    if (!ok) flag(list, `${desc(c, entries[list[0]])} on ${entries[list[0]].day} must be ${b} back-to-back periods in one room, without crossing a break.`);
  });
  const count = {};
  entries.forEach(e => { if (!e.ghost) count[e.a] = (count[e.a] || 0) + 1; });
  AS.forEach(a => { if ((count[a.i] || 0) !== a.periods) messages.push(`${a.elective ? gLabel(c, a.group) : `${gLabel(c, a.group)} ${subj(c, a).short}`} has ${count[a.i] || 0} of ${a.periods} periods.`); });
  return { messages, bad, pairs };
}

/* ------------------------------ scorecard ------------------------------ */
function metrics(c, entries) {
  const ix = idx(c), units = {}, subBusy = {}, load = {};
  entries.forEach(e => {
    const a = A(c)[e.a], G = ix.groups[a.group];
    const units = s => (ix.subsOf[s].length ? ix.subsOf[s] : [s]);
    const targets = G.elective ? secsOf(c, G.id).flatMap(units) : G.isSub ? [G.id] : units(G.section);
    targets.forEach(t => (units[key(t, e.day)] ||= new Set()).add(e.period));
    if (G.isSub) (subBusy[key(G.section, e.day, e.period)] ||= new Set()).add(G.id);
    load[a.teacher] = (load[a.teacher] || 0) + 1;
  });
  let lab = 0, par = 0;
  Object.entries(subBusy).forEach(([k, s]) => { lab++; if (s.size === ix.subsOf[k.split('|')[0]].length) par++; });
  const gaps = Object.values(units).map(s => { const a = [...s]; return Math.max(...a) - Math.min(...a) + 1 - a.length; });
  const avg = gaps.length ? gaps.reduce((x, y) => x + y, 0) / gaps.length : 0;
  const parPct = lab ? 100 * par / lab : 100;
  const last = entries.filter(e => e.period === ix.P.length).length;
  const L = Object.values(load);
  const used = new Set(entries.map(e => key(e.room, e.day, e.period))).size;
  return {
    score: Math.max(0, Math.min(100, Math.round(100 - 15 * avg - 0.3 * (100 - parPct) - 0.5 * last))),
    avg: avg.toFixed(2), parPct: Math.round(parPct), last,
    lmin: L.length ? Math.min(...L) : 0, lmax: L.length ? Math.max(...L) : 0,
    classes: entries.length, required: A(c).reduce((s, a) => s + a.periods, 0),
    roomUse: Math.round(100 * used / (c.rooms.length * c.scheme.days.length * ix.P.length)),
  };
}

/* ------------------------------ pre-check ------------------------------ */
function precheck(c) {
  const ix = idx(c), S = c.scheme, slots = S.days.length * ix.P.length, out = [];
  const tl = {};
  A(c).forEach(a => tl[a.teacher] = (tl[a.teacher] || 0) + a.periods);
  c.teachers.forEach((t, i) => {
    const cap = tMax(c, t) * S.days.length - (t.off || []).length, l = tl[t.id] || 0;
    const edit = { fix: 'Teachers', label: `Edit ${t.name}`, action: `openForm('teachers', ${i})` };
    if (l > cap) out.push({ level: 'error', text: `${t.name} has ${l} periods a week but can teach at most ${cap} (${tMax(c, t)} a day${(t.off || []).length ? ", minus the periods they can't teach" : ''}). Raise their "Max periods a day", or give some of their classes to another teacher in Teaching assignments.`, ...edit });
    else if (l > 0.85 * cap) out.push({ level: 'warn', text: `${t.name} is close to their limit: ${l} of ${cap} periods a week. That's allowed, but leaves little room to fit their classes. If they can take more, raise their "Max periods a day".`, ...edit });
  });
  c.sections.forEach(s => {
    const whole = A(c).filter(a => a.group === s.id).reduce((x, a) => x + a.periods, 0);
    const subs = ix.subsOf[s.id].map(g => A(c).filter(a => a.group === g).reduce((x, a) => x + a.periods, 0));
    const electives = Object.values(ix.electives).filter(e => e.sections.includes(s.id) && e.batches.length)
      .reduce((x, e) => x + A(c).find(a => a.group === e.batches[0]).periods, 0);
    const need = whole + (subs.length ? Math.max(...subs) : 0) + electives;
    const kept = [...ix.reservedAt.keys()].filter(k => k.split('|')[0] === s.id).length, free = slots - kept;
    out.push(need > free
      ? { level: 'error', text: `${s.id} needs ${need} periods but the week has only ${free}${kept ? ` (${kept} are kept free for other classes)` : ''}.`, fix: 'Sections' }
      : { level: 'ok', text: `${s.id}: ${need} of ${free} weekly periods needed${kept ? ` (${kept} kept free)` : ''}.` });
  });
  const demand = {};
  A(c).forEach(a => demand[roomTypeOf(c, a)] = (demand[roomTypeOf(c, a)] || 0) + a.periods);
  Object.entries(demand).forEach(([t, d]) => {
    const cap = c.rooms.filter(r => r.type === t).length * slots;
    out.push(d > cap
      ? { level: 'error', text: `${typeName(t)}s are needed for ${d} periods but only ${cap} are available.`, fix: 'Rooms' }
      : { level: 'ok', text: `${typeName(t)}s: ${d} of ${cap} room-periods needed (${Math.round(100 * d / cap)}%).` });
  });
  A(c).forEach(a => {
    const G = ix.groups[a.group];
    if (!c.rooms.some(r => r.type === roomTypeOf(c, a) && r.cap >= G.strength))
      out.push({ level: 'error', text: `No ${typeName(roomTypeOf(c, a)).toLowerCase()} is big enough for ${gLabel(c, a.group)} (${G.strength} students).`, fix: 'Rooms' });
  });
  c.teachers.filter(t => (t.off || []).length).forEach(t =>
    out.push({ level: 'info', text: `${t.name} is unavailable on ${fmtOff(t.off)}. Classes won't be placed there.` }));
  const rank = { error: 0, warn: 1, info: 2, ok: 3 };
  return out.sort((x, y) => rank[x.level] - rank[y.level]);
}

/* ------------------------------ app state ------------------------------ */
const state = {
  ci: null, page: 'dashboard', view: 'section', key: null, // ci = the signed-in demo college; null = signed out
  gen: {}, drawer: false, preview: null, history: [], applied: null, sim: null, generating: null, toast: null,
  // Live mode: the page was opened from the Samay server, so data, sign-in and generating go through the API.
  live: false, liveCollege: null, booting: true, demoAccounts: null, sync: null, staleVersion: null, signinError: null, signingIn: false, signinEmail: '',
  // Who is signed in (live mode): a coordinator manages everything; a teacher sees the published timetable and sets their free times.
  role: 'coordinator', me: null, teacherHome: null, published: null, avail: null, hodPublished: null,
  assistantOn: false, chat: { messages: [], draft: '', sending: false },

  emailOn: false, linkPage: null, forgotMode: false, forgotSent: null, lastLink: null,  // invites and password resets

const isTeacher = () => state.live && state.role === 'teacher';
const isHod = () => state.live && state.role === 'hod';

const isViewer = () => isTeacher() || isHod() || isStudent();  // sees the published timetable only, read-only
// While an older timetable version is open (read-only), the timetable page shows it with the data it was built from.
// A head of department edits the current data, but the timetable page shows the published version with the data it was built from.
const col = () => state.viewing ? state.viewing.college
  : isHod() && state.page === 'timetable' && state.hodPublished ? state.hodPublished.college
  : state.live ? state.liveCollege : (state.ci === null ? null : COLLEGES[state.ci]);
const current = () => state.viewing ? state.viewing.gen : isHod() ? (state.page === 'timetable' ? state.hodPublished?.gen ?? null : null) : state.gen[col().id];

function displayEntries() {
  const g = current();
  if (!g) return [];
  const list = g.entries.map((e, i) => ({ ...e, i }));
  const pv = state.preview;  // { changes: [{ ei, day, period, room }], text }
  if (!pv) return list;
  pv.changes.forEach(ch => { list[ch.ei] = { ...list[ch.ei], day: ch.day, period: ch.period, room: ch.room, preview: true }; });
  pv.changes.forEach(ch => list.push({ ...g.entries[ch.ei], i: ch.ei, ghost: true }));
  return list;
}

function freeSlots(c, entries, ei, limit) {
  const ix = idx(c), a = A(c)[entries[ei].a], T = ix.teachers[a.teacher], G = ix.groups[a.group];
  const busyT = new Set(), busyR = new Set(), busyG = new Set(), daysUsed = new Set(), load = {};
  entries.forEach((e, j) => {
    if (j === ei) return;
    const b = A(c)[e.a], k = key(e.day, e.period), g = ix.groups[b.group];
    if (b.teacher === a.teacher) { busyT.add(k); load[e.day] = (load[e.day] || 0) + 1; }
    busyR.add(key(e.room, k));
    if (g.section === G.section) busyG.add(key(g.isSub ? g.id : '*', k));
    if (b.i === a.i) daysUsed.add(e.day);
  });
  const rooms = c.rooms.filter(r => r.type === roomTypeOf(c, a) && r.cap >= G.strength);
  const out = [];
  for (const d of c.scheme.days) {
    if (daysUsed.has(d) || (load[d] || 0) + 1 > tMax(c, T)) continue;
    for (const p of ix.P) {
      const k = key(d, p);
      if (busyT.has(k) || (T.off || []).some(([od, op]) => od === d && op === p)) continue;
      const gBusy = busyG.has(key('*', k)) || (G.isSub ? busyG.has(key(G.id, k)) : ix.subsOf[G.section].some(s => busyG.has(key(s, k))));
      if (gBusy) continue;
      const r = rooms.find(r => !busyR.has(key(r.id, k)));
      if (!r) continue;
      const trialEntries = entries.map((e, j) => j === ei ? { ...e, day: d, period: p, room: r.id } : e);
      if (validate(c, trialEntries).bad.has(ei)) continue;  // e.g. an elective of this section runs then
      out.push({ day: d, period: p, room: r.id });
      if (out.length >= limit) return out;
    }
  }
  return out;
}

/* ------------------------------ actions ------------------------------ */
// Fade a part of the screen in only when it first appears, not on every redraw (redraws happen on each change).
const _shown = new Set();
let _frame = new Set();
function anim(key) {
  _frame.add(key);
  if (_shown.has(key)) return '';
  _shown.add(key);
  return 'fade-in';
}
function render() {
  _frame = new Set();
  document.getElementById('app').innerHTML = layout();
  [..._shown].forEach(k => { if (!_frame.has(k)) _shown.delete(k); });
  drawQrs();
}
function go(page) {
  state.page = page; state.viewing = null; state.sel = null;
  if (page === 'accounts') state.accounts = null;  // always show the latest list
  render(); window.scrollTo(0, 0);
}
// A user belongs to exactly one college and only ever sees that college's data.
function signIn(i) {
  Object.assign(state, { ci: +i, page: 'dashboard', key: null, preview: null, history: [], applied: null, sim: null, drawer: false });
  render(); toast(`Signed in to ${col().name}.`);
}
function signOut() {
  if (isStudent()) { leaveStudent(); return; }
  if (state.live) { signOutLive(); return; }
  Object.assign(state, { ci: null, preview: null, history: [], applied: null, sim: null, drawer: false, menu: false, modal: null });
  render();
}
function setView(v) { state.view = v; state.key = null; state.sel = null; render(); }
function setKey(k) { state.key = k; state.sel = null; render(); }
function toggleDrawer(open) { state.drawer = open ?? !state.drawer; render(); }
function toast(text) {
  state.toast = text; render();
  clearTimeout(window._tt); window._tt = setTimeout(() => { state.toast = null; render(); }, 3200);
}
function runGenerate() {
  const steps = ['Checking data and rules', 'Placing labs side by side', 'Placing lectures and tutorials', 'Verifying: no clashes'];
  window._steps = steps;
  if (state.live) { runGenerateLive(); return; }
  state.generating = 0; render();
  const timer = setInterval(() => {
    state.generating++;
    if (state.generating >= steps.length) {
      clearInterval(timer);
      const prev = current(), fixed = prev ? lockList(col(), prev) : [];
      state.gen[col().id] = generate(col(), fixed);
      current().locked = new Set(fixed.map(f => sessionKey(f.a, f.day)));
      state.sel = null;
      state.generating = null; state.preview = null; state.history = []; state.applied = null; state.sim = null;
      state.page = 'timetable';
      const v = validate(col(), current().entries);
      render();
      toast(v.messages.length ? `Generated with ${v.messages.length} issue(s) to review.` : 'Timetable generated and verified: 0 conflicts.');
    } else render();
  }, 450);
  window._steps = steps;
}
function simulateClash() {
  const c = col(), g = current();
  if (!g) return;
  const ix = idx(c), E = g.entries;
  for (let i = 0; i < E.length; i++) {
    const a = A(c)[E[i].a];
    if (blockOf(c, a) !== 1 || ix.groups[a.group].isSub || a.elective) continue;
    for (const o of E) {
      const b = A(c)[o.a];
      if (b.teacher !== a.teacher || b.group === a.group) continue;
      const at = e => e.day === o.day && e.period === o.period;
      const groupBusy = E.some(e => at(e) && ix.groups[A(c)[e.a].group].section === ix.groups[a.group].section);
      const sameDay = E.some((e, j) => j !== i && e.a === E[i].a && e.day === o.day);
      const room = c.rooms.find(r => r.type === roomTypeOf(c, a) && r.cap >= ix.groups[a.group].strength && !E.some(e => at(e) && e.room === r.id));
      if (groupBusy || sameDay || !room) continue;
      state.sim = { ei: i };
      E[i] = { ...E[i], day: o.day, period: o.period, room: room.id };
      Object.assign(state, { view: 'section', key: a.group, page: 'timetable', drawer: true, preview: null, applied: null });
      render();
      toast(state.live ? 'A clash was added on screen only (not saved), to show how the assistant helps.' : 'A clash was added on purpose, to show how the assistant helps.');
      return;
    }
  }
}
function previewOption(day, period, room, ei) {
  const c = col(), g = current();
  state.preview = { changes: [{ ei, day, period: +period, room }], text: `${desc(c, g.entries[ei])} moves to ${day} ${pLabel(c, +period)} in ${room}.` };
  state.applied = null; render();
}
function discardPreview() { state.preview = null; render(); }
function applyPreview() {
  const g = current(), pv = state.preview;
  if (!g || !pv) return;
  state.history.push({ changes: pv.changes.map(ch => ({ ei: ch.ei, from: { ...g.entries[ch.ei] } })) });
  pv.changes.forEach(ch => { g.entries[ch.ei] = { ...g.entries[ch.ei], day: ch.day, period: ch.period, room: ch.room }; });
  state.applied = pv.text;
  state.preview = null; state.sim = null; state.sel = null;
  render();
  if (state.live) reviseOnServer(g, 'Change applied');
  else toast('Change applied. You can undo it from the assistant.');
}
function undoLast() {
  const g = current(), h = g && state.history.pop();
  if (!h) return;
  h.changes.forEach(ch => { g.entries[ch.ei] = ch.from; });
  state.applied = null;
  render();
  // Undoing back to a clash (e.g. one added with "Simulate a clash") is shown but never saved.
  if (state.live && !validate(col(), g.entries).messages.length) reviseOnServer(g, 'Change undone');
  else toast(state.live ? 'Change undone on screen only: the result has a clash, so it isn\'t saved.' : 'Change undone.');
}

/* ------------------------------------------------------------------------------------------------
   EDITING BY HAND: click a class to select it, then click a green slot to move it or another class
   to swap them. Every change is previewed and checked with the same rules as the server. Locked
   classes stay where they are when the timetable is generated again.
------------------------------------------------------------------------------------------------- */
const sessionKey = (a, day) => `${a}|${day}`;
function sessionIdx(g, a, day) {
  return g.entries.map((_, i) => i).filter(i => g.entries[i].a === a && g.entries[i].day === day)
    .sort((x, y) => g.entries[x].period - g.entries[y].period);
}
const isLocked = (g, a, day) => !!g?.locked?.has(sessionKey(a, day));
function trial(g, changes) {
  const byEi = new Map(changes.map(ch => [ch.ei, ch]));
  return g.entries.map((e, i) => byEi.has(i) ? { ...e, day: byEi.get(i).day, period: byEi.get(i).period, room: byEi.get(i).room } : e);
}
const passes = (c, g, changes) => validate(c, trial(g, changes)).messages.length === 0;

// Move one session (a lecture, or a whole lab block) so it starts at `start` on `newDay`. Returns the changes, or null.
function tryMove(c, g, a, day, newDay, start, onlyRoom = null) {
  const ix = idx(c), as = A(c)[a], b = blockOf(c, as), idxs = sessionIdx(g, a, day);
  if (!idxs.length || start + b - 1 > ix.P.length) return null;
  if (newDay === day && g.entries[idxs[0]].period === start && !onlyRoom) return null;  // that's where it already is
  const sameDay = g.entries.filter((e, i) => e.a === a && e.day === newDay && !idxs.includes(i)).length / b;
  if (sameDay >= c.scheme.rules.maxSameSubjectPerDay) return null;  // college rule: spread a subject across the week
  const fits = c.rooms.filter(r => r.type === roomTypeOf(c, as) && r.cap >= ix.groups[as.group].strength).map(r => r.id);
  const current = g.entries[idxs[0]].room;
  const rooms = onlyRoom ? [onlyRoom].filter(r => fits.includes(r)) : [current, ...fits.filter(r => r !== current)].filter(r => fits.includes(r));
  for (const room of rooms) {
    const changes = idxs.map((ei, k) => ({ ei, day: newDay, period: start + k, room }));
    if (passes(c, g, changes)) return changes;
  }
  return null;
}

// Swap two sessions of the same length; tries keeping each room first, then swapping rooms.
function trySwap(c, g, a1, d1, a2, d2) {
  const i1 = sessionIdx(g, a1, d1), i2 = sessionIdx(g, a2, d2);
  if (i1.length !== i2.length) return { error: 'Only classes of the same length can be swapped (a lab with a lab, a lecture with a lecture).' };
  const s1 = g.entries[i1[0]], s2 = g.entries[i2[0]];
  let last = null;
  for (const [r1, r2] of [[s1.room, s2.room], [s2.room, s1.room]]) {
    const changes = [...i1.map((ei, k) => ({ ei, day: s2.day, period: s2.period + k, room: r1 })),
                     ...i2.map((ei, k) => ({ ei, day: s1.day, period: s1.period + k, room: r2 }))];
    const v = validate(c, trial(g, changes));
    if (!v.messages.length) return { changes };
    last = v.messages[0];
  }
  return { error: `Those two can't be swapped: ${last}` };
}

function editTargets(c, g) {
  const out = new Map();
  if (!state.sel || state.preview || isLocked(g, state.sel.a, state.sel.day)) return out;
  for (const d of c.scheme.days)
    for (const p of idx(c).P) {
      const changes = tryMove(c, g, state.sel.a, state.sel.day, d, p, state.view === 'room' ? state.key : null);
      if (changes) out.set(`${d}|${p}`, changes);
    }
  return out;
}

function pickSession(a, day) {
  const c = col(), g = current();
  if (!g || state.preview || state.viewing) return;
  const sel = state.sel;
  if (sel && sel.a === a && sel.day === day) { state.sel = null; render(); return; }
  if (sel && !isLocked(g, sel.a, sel.day)) {
    if (isLocked(g, a, day)) { toast('That class is locked. Unlock it first to swap it.'); return; }
    const r = trySwap(c, g, sel.a, sel.day, a, day);
    if (r.error) { toast(r.error); return; }
    const one = g.entries[sessionIdx(g, sel.a, sel.day)[0]], two = g.entries[sessionIdx(g, a, day)[0]];
    state.preview = { changes: r.changes, text: `${desc(c, one)} (${one.day} ${pLabel(c, one.period)}) and ${desc(c, two)} (${two.day} ${pLabel(c, two.period)}) swap places.` };
    render(); return;
  }
  state.sel = { a, day }; render();
}
function moveTo(day, period) {
  const c = col(), g = current(), sel = state.sel;
  const changes = sel && tryMove(c, g, sel.a, sel.day, day, period, state.view === 'room' ? state.key : null);
  if (!changes) return;
  const e = g.entries[changes[0].ei];
  state.preview = { changes, text: `${desc(c, e)} moves to ${day} ${pLabel(c, period)} in ${changes[0].room}.` };
  render();
}
function cancelSel() { state.sel = null; render(); }

function lockList(c, g) {
  return [...(g.locked || [])].map(k => {
    const [a, day] = [+k.split('|')[0], k.split('|')[1]], idxs = sessionIdx(g, a, day);
    if (!idxs.length) return null;
    const e = g.entries[idxs[0]], as = c.assignments[a];
    if (!as) return null;  // elective batches can't be locked
    return { a, assignment: c._ids?.[a], subject: as[0], group: as[1], day, start: e.period, room: e.room };
  }).filter(Boolean);
}
async function toggleLock() {
  const c = col(), g = current(), sel = state.sel;
  if (!g || !sel) return;
  g.locked ||= new Set();
  const k = sessionKey(sel.a, sel.day), now = !g.locked.has(k);
  now ? g.locked.add(k) : g.locked.delete(k);
  render();
  if (state.live && g.version) {
    try {
      await api(`/api/timetables/${g.version}/locks`, { method: 'PUT', body: { locked: lockList(c, g).map(({ a, ...rest }) => rest) } });
    } catch (e) { toast(e.message); return; }
  }
  toast(now ? 'Locked: this class stays here when you generate again.' : 'Unlocked.');
}

async function openHistory() {

async function viewVersion(v) {
  try {
    const t = await api(`/api/timetables/${v}`);
    const college = fromServer(t.data), pos = new Map(allIds(college).map((id, i) => [id, i]));
    const entries = t.entries.filter(e => pos.has(e.assignment)).map(e => ({ a: pos.get(e.assignment), day: e.day, period: e.period, room: e.room }));
    const locked = new Set((t.locked || []).filter(l => pos.has(l.assignment)).map(l => sessionKey(pos.get(l.assignment), l.day)));
    const latest = current() && !state.viewing ? current().version : null;
    Object.assign(state, { modal: null, drawer: false, preview: null, sel: null, page: 'timetable', key: null,
      viewing: { version: v, college, outOfDate: t.out_of_date, gen: { entries, unplaced: [], at: new Date(t.created_at * 1000), version: v, locked } } });
    if (latest === v) state.viewing = null;  // that's the one already shown
    render();
  } catch (e) { toast(e.message); }
}
function backToLatest() { state.viewing = null; state.sel = null; render(); }
async function restoreVersion(v) {
  try {
    const r = await api(`/api/timetables/${v}/restore`, { method: 'POST' });
    Object.assign(state, { viewing: null, modal: null, sel: null, preview: null, history: [] });

}
async function deleteVersion(v) {
  try {
    await api(`/api/timetables/${v}`, { method: 'DELETE' });
    if (state.viewing?.version === v) state.viewing = null;
    await loadLatestTimetable();

  } catch (e) { toast(e.message); }
}
function historyBody() {

            ${t.version === latest ? '<span class="rounded bg-indigo-50 px-1.5 py-0.5 text-[11px] font-medium text-indigo-700">Latest</span>' : ''}
            ${t.version === pub ? '<span class="rounded bg-emerald-50 px-1.5 py-0.5 text-[11px] font-medium text-emerald-700" title="Teachers see this version">Published</span>' : ''}
            ${t.out_of_date ? '<span class="rounded bg-amber-50 px-1.5 py-0.5 text-[11px] font-medium text-amber-800" title="Your data changed after this version was made">Older data</span>' : ''}
            <span class="text-slate-500">${how(t)}</span></div>
          <div class="text-xs text-slate-500">${new Date(t.created_at * 1000).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' })} · score ${t.score}/100${t.locked ? ` · ${t.locked} locked` : ''}</div>
        </div>
        <div class="flex flex-wrap gap-1.5">
          ${btn('View', `viewVersion(${t.version})`)}
          ${t.version !== pub && !t.out_of_date ? btn('Publish', `publishVersion(${t.version})`) : ''}
          ${t.version === pub ? btn('Stop publishing', 'unpublish()') : ''}
          ${t.version !== latest && !t.out_of_date ? btn('Restore', `restoreVersion(${t.version})`) : ''}
          ${t.version === pub ? '' : m.confirmDelete === t.version

/* ------------------------------------------------------------------------------------------------
   LIVE MODE: the same screens, backed by the Samay server. The server checks every save again and
   is the only source of truth; the college always comes from the signed-in session.
------------------------------------------------------------------------------------------------- */
const sleep = ms => new Promise(r => setTimeout(r, ms));
const assignmentId = i => `A${String(i + 1).padStart(2, '0')}`;

async function api(path, { method = 'GET', body } = {}) {
  const res = await fetch(path, { method, credentials: 'same-origin', headers: body ? { 'Content-Type': 'application/json' } : {},
                                  body: body ? JSON.stringify(body) : undefined });
  let json = null;
  try { json = await res.json(); } catch { /* empty body */ }
  if (!res.ok) {
    if (res.status === 401 && path !== '/api/auth/login' && state.liveCollege) {
      Object.assign(state, isStudent()
        ? { liveCollege: null, role: 'coordinator', studentMode: true, studentError: 'That code no longer works. Ask your college for the new one.' }
        : { liveCollege: null, modal: null, drawer: false, signinError: 'Your session has ended. Please sign in again.' });
      render();
    }
    const d = json?.detail;
    const msg = typeof d === 'string' ? d : d?.message ? [d.message, ...(d.problems || []).slice(0, 3)].join(' ') : `Something went wrong (${res.status}). Try again.`;
    throw Object.assign(new Error(msg), { status: res.status, detail: d });
  }
  return json;
}

// Server format (see backend/app/schema.py) ⇄ the page's in-memory format.
function fromServer(d) {
  const S = d.scheme;
  return {
    id: d.id, name: d.name, place: d.place || '', term: d.term || '', kind: d.kind || '',
    scheme: {
      days: [...S.days], periods: S.periods.map(p => [p.label, p.start, p.end]),
      breaks: S.breaks.map(b => ({ after: b.after, label: b.label, time: `${S.periods[b.after - 1].end}–${S.periods[b.after].start}` })),
      theoryRoomType: S.theory_room_type, labPrefix: S.lab_prefix, labBlock: S.lab_block,
      rules: { lecturesPerWeek: S.rules.lectures_per_week, labSessionsPerWeek: S.rules.lab_sessions_per_week,
               maxSameSubjectPerDay: S.rules.max_same_subject_per_day, teacherMaxPerDay: S.rules.teacher_max_per_day,
               electiveClassSize: S.rules.elective_class_size ?? 70 },
    },
    departments: d.departments.map(x => ({ ...x })),
    courses: (d.courses || []).map(x => ({ ...x })),
    rooms: d.rooms.map(r => ({ id: r.id, type: r.type, cap: r.capacity, owner: r.owner })),
    teachers: d.teachers.map(t => ({ id: t.id, name: t.name, dept: t.dept, ...(t.max_per_day ? { max: t.max_per_day } : {}), ...(t.email ? { email: t.email } : {}),
                                     ...(t.unavailable?.length ? { off: t.unavailable.map(x => [...x]) } : {}) })),
    sections: d.sections.map(s => ({ id: s.id, dept: s.dept, course: s.course, sem: s.sem, strength: s.strength,
                                     subs: (s.lab_groups || []).map(g => ({ label: g.label, strength: g.strength })) })),
    subjects: Object.fromEntries(d.subjects.map(s => [s.id, { short: s.short, name: s.name, kind: s.kind, ...(s.dept ? { dept: s.dept } : {}),
                                                            ...(s.room_type ? { room: s.room_type } : {}), ...(s.per_week != null ? { perWeek: s.per_week } : {}) }])),
    assignments: d.assignments.map(a => a.periods != null ? [a.subject, a.group, a.teacher, a.periods] : [a.subject, a.group, a.teacher]),
    electives: (d.electives || []).map(e => JSON.parse(JSON.stringify(e))),
    reserved: (d.reserved || []).map(r => JSON.parse(JSON.stringify(r))),
    _ids: d.assignments.map(a => a.id),
  };
}
function toServer(c) {
  const S = c.scheme, clean = o => Object.fromEntries(Object.entries(o).filter(([, v]) => v !== undefined && v !== null && v !== ''));
  return {
    id: c.id, name: c.name, place: c.place, term: c.term, kind: c.kind,
    scheme: {
      days: S.days, periods: S.periods.map(([label, start, end]) => ({ label, start, end })), breaks: S.breaks.map(b => ({ after: b.after, label: b.label })),
      theory_room_type: S.theoryRoomType, lab_block: S.labBlock, lab_prefix: S.labPrefix,
      rules: { lectures_per_week: S.rules.lecturesPerWeek, lab_sessions_per_week: S.rules.labSessionsPerWeek,
               max_same_subject_per_day: S.rules.maxSameSubjectPerDay, teacher_max_per_day: S.rules.teacherMaxPerDay,
               elective_class_size: S.rules.electiveClassSize || 70 },
    },
    departments: c.departments.map(d => clean({ id: d.id, name: d.name, hod: d.hod, status: d.status })),
    courses: (c.courses || []).map(x => clean({ id: x.id, name: x.name, dept: x.dept, years: x.years })),
    sections: c.sections.map(s => clean({ id: s.id, dept: s.dept, course: s.course, sem: s.sem, strength: s.strength,
                                          lab_groups: s.subs.map(u => ({ label: u.label, strength: u.strength })) })),
    teachers: c.teachers.map(t => clean({ id: t.id, name: t.name, dept: t.dept, max_per_day: t.max, unavailable: t.off || [], email: t.email })),
    rooms: c.rooms.map(r => ({ id: r.id, type: r.type, capacity: r.cap, owner: r.owner })),
    subjects: Object.entries(c.subjects).map(([id, s]) => clean({ id, short: s.short, name: s.name, kind: s.kind, dept: s.dept, room_type: s.room, per_week: s.perWeek })),
    assignments: c.assignments.map((a, i) => clean({ id: assignmentId(i), subject: a[0], group: a[1], teacher: a[2], periods: a[3] })),
    electives: (c.electives || []).map(e => clean({ id: e.id, name: e.name, sections: e.sections, periods: e.periods,
      options: e.options.map(o => clean({ subject: o.subject, students: o.students, teachers: o.teachers, batches: o.batches })) })),
    reserved: (c.reserved || []).map(r => ({ id: r.id, name: r.name, sections: r.sections, slots: r.slots })),
  };
}

// Show the latest saved timetable, unless the data changed after it was made.
async function loadLatestTimetable() {
  const c = col();
  try {
    const t = await api('/api/timetables/latest');
    state.published = t.published;
    if (t.out_of_date) { delete state.gen[c.id]; state.staleVersion = t.version; return; }
    const pos = new Map(allIds(c).map((id, i) => [id, i]));
    state.gen[c.id] = {
      entries: t.entries.filter(e => pos.has(e.assignment)).map(e => ({ a: pos.get(e.assignment), day: e.day, period: e.period, room: e.room })),
      unplaced: [], at: new Date(t.created_at * 1000), version: t.version,
      locked: new Set((t.locked || []).filter(l => pos.has(l.assignment)).map(l => sessionKey(pos.get(l.assignment), l.day))),
    };
    state.staleVersion = null;
  } catch (e) {
    if (e.status !== 404) throw e;
    delete state.gen[c.id]; state.staleVersion = null; state.published = null;
  }
}

async function saveToServer(c) {
  state.sync = 'saving'; render();

    const r = await api('/api/college/data', { method: 'PUT', body: { version: c._version, data: toServer(c) } });
    c._version = r.version;
    c._ids = c.assignments.map((_, i) => assignmentId(i));
    state.sync = 'saved';
  } catch (e) {
    state.sync = 'error';
    toast(e.message);
    if ([403, 409, 422].includes(e.status)) { await loadCollege().catch(() => {}); state.sync = 'saved'; }  // show what the server really has
  }

async function runGenerateLive() {
  const c = col();
  state.generating = 0; render();
  try {
    const prev = current();
    let locked = prev ? lockList(c, prev).map(({ a, ...rest }) => rest) : [];
    if (!prev && state.staleVersion) {  // data changed since: reuse that version's locks; the server drops any that no longer match
      locked = (await api(`/api/timetables/${state.staleVersion}`).catch(() => ({}))).locked || [];
    }
    let job = await api('/api/timetables', { method: 'POST', body: { locked } });
    const started = Date.now();
    while (job.status === 'queued' || job.status === 'running') {
      state.generating = Math.min(2, Math.floor((Date.now() - started) / 900)); render();
      await sleep(400);
      job = await api(`/api/jobs/${job.id}`);
    }
    if (job.status !== 'done') { state.generating = null; render(); toast(job.message); go('precheck'); return; }
    state.generating = 3; render();
    await loadLatestTimetable();
    Object.assign(state, { generating: null, preview: null, history: [], applied: null, sim: null, page: 'timetable' });
    render(); toast(job.message);
  } catch (e) {
    state.generating = null; render(); toast(e.message);
  }
}

      locked: lockList(c, g).map(({ a, ...rest }) => rest) } });
    g.version = r.version;
    render(); toast(`${what}. ${r.message}`);
  } catch (e) {
    toast(e.message); await loadLatestTimetable().catch(() => {}); render();
  }
}

async function boot() {
  if (location.protocol.startsWith('http')) {
    try {
      const h = await (await fetch('/api/health')).json();
      state.live = h.app === 'samay';
      state.signupEnabled = !!h.signup;
      state.assistantOn = !!h.assistant;  // the server has an AI assistant (Claude) switched on
      state.emailOn = !!h.email;  // the server can email invite and reset links
      if (state.live && h.demo_login) state.demoAccounts = (await api('/api/auth/demo-accounts')).accounts;
    } catch { state.live = state.live || false; }
  }
  if (state.live) {
    try { await loadSignedIn(await api('/api/auth/me')); } catch { /* not signed in yet */ }
    // A student link (?code=...) opens that college's timetable; otherwise a phone that entered a code before goes straight there.
    const params = new URLSearchParams(location.search), code = params.get('code');
    const linkKind = params.has('invite') ? 'invite' : params.has('reset') ? 'reset' : null;
    if (code || linkKind) history.replaceState(null, '', location.pathname);
    if (linkKind) { await openLink(linkKind, params.get(linkKind)); state.booting = false; render(); return; }
    if (!col() && code) { state.booting = false; await openStudent(null, code); return; }
    if (!col()) {
      try { await loadStudent(); }
      catch (e) {  // this phone used a code before, but it no longer works (changed or turned off)
        if (e.status === 401 && storage.get('samay.student')) Object.assign(state, { studentMode: true, studentError: 'Your college changed its student code. Ask for the new one.' });
      }
    }
  }
  state.booting = false;
  render();
}

async function signUpLive(ev) {
  ev?.preventDefault();
  const v = id => document.getElementById(`su-${id}`).value.trim();
  const f = { college: v('college'), place: v('place'), name: v('name'), email: v('email') }, password = document.getElementById('su-password').value;
  state.signup = f;
  const problem = !f.college ? 'Enter your college name.' : !f.name ? 'Enter your name.' : !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(f.email) ? 'Enter a valid email.' : password.length < 8 ? 'Choose a password of at least 8 characters.' : null;
  if (problem) { state.signinError = problem; render(); return; }
  Object.assign(state, { signingIn: true, signinError: null }); render();
  try {
    await api('/api/auth/signup', { method: 'POST', body: { college_name: f.college, place: f.place, name: f.name, email: f.email, password } });
    await loadCollege();
    Object.assign(state, { signingIn: false, signupMode: false, signup: null, page: 'dashboard' });
    render(); toast(`Welcome! ${col().name} is ready to set up.`);
  } catch (e) {
    Object.assign(state, { signingIn: false, signinError: e.message }); render();
  }
}

  const c = col(), g = current();
  if (!g) return;
  if (!window.XLSX) { toast('Excel export needs an internet connection to load the spreadsheet tool. Try again when online.'); return; }
  const ix = idx(c), S = c.scheme, AS = A(c);
  const label = e => { const a = AS[e.a], s = subj(c, a); return { a, s, T: ix.teachers[a.teacher] }; };
  const header = ['Day', ...ix.P.map(p => `${S.periods[p - 1][0]} (${S.periods[p - 1][1]}–${S.periods[p - 1][2]})`)];
  const gridSheet = (filter, text, section) => [header, ...S.days.map(d => [d, ...ix.P.map(p =>
    [section && ix.reservedAt.has(key(section, d, p)) ? `Kept free: ${ix.reservedAt.get(key(section, d, p))}` : null,
     ...g.entries.filter(e => e.day === d && e.period === p && filter(e)).map(text)].filter(Boolean).join('\n'))])];
  const used = new Set(), sheetName = name => {
    let n = String(name).replace(/[\[\]:*?/\\]/g, '-').slice(0, 28), k = 2;
    while (used.has(n)) n = `${String(name).replace(/[\[\]:*?/\\]/g, '-').slice(0, 25)} ${k++}`;
    used.add(n); return n;
  };
  const wb = XLSX.utils.book_new();
  const add = (name, rows, widths) => {
    const ws = XLSX.utils.aoa_to_sheet(rows);
    ws['!cols'] = widths || rows[0].map((_, i) => ({ wch: i === 0 ? 8 : 26 }));
    XLSX.utils.book_append_sheet(wb, ws, sheetName(name));
  };
  const all = [['Day', 'Period', 'Time', 'Department', 'Section / lab group', 'Subject', 'Type', 'Teacher', 'Room'],
    ...[...g.entries].sort((x, y) => S.days.indexOf(x.day) - S.days.indexOf(y.day) || x.period - y.period).map(e => {
      const { a, s, T } = label(e), p = S.periods[e.period - 1];
      return [e.day, p[0], `${p[1]}–${p[2]}`, groupDept(c, a.group), gLabel(c, a.group), s.name, KIND[s.kind].label, T.name, e.room];
    })];
  add('All classes', all, all[0].map(h => ({ wch: Math.max(10, h.length + 4) })));
  c.sections.forEach(sec => add(sec.id, gridSheet(e => secsOf(c, AS[e.a].group).includes(sec.id),
    e => { const { a, s, T } = label(e), G = ix.groups[a.group]; return `${G.elective ? ix.electives[G.elective].name + ': ' + G.label : `${G.isSub ? G.label + ': ' : ''}${s.short}`} · ${T.name} · ${e.room}`; }, sec.id)));
  c.teachers.filter(t => g.entries.some(e => AS[e.a].teacher === t.id)).forEach(t => add(`T - ${t.name}`, gridSheet(e => AS[e.a].teacher === t.id,
    e => { const { a, s } = label(e); return `${s.short} · ${gLabel(c, a.group)} · ${e.room}`; })));
  XLSX.writeFile(wb, `${c.name.replace(/[^\w ]+/g, '').trim() || 'timetable'} timetable${g.version ? ' v' + g.version : ''}.xlsx`);
  toast('Excel file downloaded: a sheet for each section and teacher, plus every class in one list.');
}

// My classes on one day, with back-to-back periods of the same class shown as one.
function myClassesOn(c, g, teacherId, day) {
  const AS = A(c), mine = g.entries.filter(e => e.day === day && AS[e.a].teacher === teacherId).sort((x, y) => x.period - y.period);
  const out = [];
  mine.forEach(e => {
    const last = out.at(-1);
    if (last && last.a === e.a && last.to === e.period - 1 && last.room === e.room) last.to = e.period;
    else out.push({ a: e.a, from: e.period, to: e.period, room: e.room });
  });
  return out;
}

  const showDay = teachesToday && hasClasses(today) ? today : nextDay;
  const list = showDay ? myClassesOn(c, g, me.id, showDay) : [];

  const heading = !showDay ? 'No classes this week' : showDay === today ? `Today · ${today}` : teachesToday ? `No classes today. Next: ${showDay}` : `No classes today (${today}). Next: ${showDay}`;

function toggleAvail(day, period) {

async function saveAvail() {
  const v = state.avail;

  try {
    const r = await api('/api/teacher/unavailable', { method: 'PUT', body: { unavailable: v.off } });
    state.teacherHome.me.unavailable = r.unavailable.map(x => [...x]);

// A head of department's home: their department's status, size, and problems to fix before the coordinator generates.
function hodDashboard() {
  const c = col(), own = state.me.dept, d = c.departments.find(x => x.id === own), ix = idx(c), AS = A(c);
  if (!d) return card(`<p class="text-sm text-slate-600">Your department (${esc(own)}) isn't in ${esc(c.name)}'s data any more. Ask your timetable coordinator.</p>`);
  const sections = c.sections.filter(s => s.dept === own), teachers = c.teachers.filter(t => t.dept === own);
  const classes = AS.filter(a => groupDept(c, a.group) === own);
  const guest = classes.filter(a => ix.teachers[a.teacher].dept !== own);
  const slots = c.scheme.days.length * ix.P.length;
  const checks = [];
  sections.forEach(s => {
    const whole = classes.filter(a => a.group === s.id).reduce((n, a) => n + a.periods, 0);
    const labs = Math.max(0, ...ix.subsOf[s.id].map(g => classes.filter(a => a.group === g).reduce((n, a) => n + a.periods, 0)));
    if (!whole && !labs) checks.push(['warn', `${s.id} has no classes yet.`]);
    else if (whole + labs > slots) checks.push(['error', `${s.id} needs ${whole + labs} periods a week, but the week has only ${slots}.`]);
  });
  teachers.forEach(t => {
    const load = AS.filter(a => a.teacher === t.id).reduce((n, a) => n + a.periods, 0);
    const can = c.scheme.days.reduce((n, day) => n + Math.min(tMax(c, t), ix.P.filter(p => !(t.off || []).some(([od, op]) => od === day && op === p)).length), 0);
    if (!load) checks.push(['info', `${t.name} has no classes yet.`]);
    else if (load > can) checks.push(['error', `${t.name} has ${load} periods a week but can teach at most ${can} (daily limit and times they can't teach).`]);
  });
  const tone = { error: 'bg-red-50 text-red-800', warn: 'bg-amber-50 text-amber-900', info: 'bg-slate-50 text-slate-700' };
  const ready = d.status !== 'review';
  return `
  <div class="mb-6 flex flex-wrap items-end justify-between gap-3">
    <div><div class="text-sm text-slate-500">Head of department · ${esc(c.name)}</div>
      <h1 class="text-2xl font-semibold tracking-tight">${esc(d.name)}</h1></div>
    <div class="flex gap-2">${btn('Department data', "go('data')", 'secondary', 'table')}${btn('Published timetable', "go('timetable')", 'secondary', 'calendar')}</div>
  </div>
  ${card(`<div class="flex flex-wrap items-center justify-between gap-3">
    <div><div class="font-medium">Your department's data is <span class="${ready ? 'text-emerald-700' : 'text-amber-700'}">${ready ? 'ready' : 'still being checked'}</span></div>
      <p class="text-sm text-slate-500">${ready ? 'The timetable coordinator can include it when they generate.' : "Mark it ready when its courses, sections, teachers, subjects and classes are complete. The coordinator sees this on their dashboard."}</p></div>
    ${ready ? btn('Mark as needs review', `toggleDeptStatus('${esc(own)}')`) : btn('Mark as ready', `toggleDeptStatus('${esc(own)}')`, 'primary', 'check')}</div>`, 'mb-4')}
  <div class="grid grid-cols-2 gap-3 lg:grid-cols-4">
    ${stat('Sections', sections.length, `${(c.courses || []).filter(x => x.dept === own).length} course(s)`)}
    ${stat('Teachers', teachers.length, 'In your department')}
    ${stat('Classes', classes.length, `${classes.reduce((n, a) => n + a.periods, 0)} periods a week`)}
    ${stat('Taught by guests', guest.length, 'Classes given by other departments\' teachers')}
  </div>
  <div class="mt-4 grid gap-4 lg:grid-cols-3">
    ${card(`<div class="mb-3 font-medium">Before the timetable is generated</div>
      ${checks.length ? `<ul class="space-y-2">${checks.sort((x, y) => ['error', 'warn', 'info'].indexOf(x[0]) - ['error', 'warn', 'info'].indexOf(y[0]))
        .map(([lvl, text]) => `<li class="rounded-lg px-3 py-2 text-sm ${tone[lvl]}">${esc(text)}</li>`).join('')}</ul>`
        : `<p class="flex items-center gap-2 text-sm text-emerald-700">${icon('check', 'w-4 h-4')}Nothing to fix in your department.</p>`}`, 'lg:col-span-2')}
    ${card(`<div class="mb-2 font-medium">Published timetable</div>
      <p class="text-sm text-slate-600">${state.published ? `Version ${state.published.version}, published ${new Date(state.published.published_at * 1000).toLocaleDateString([], { dateStyle: 'medium' })}.` : 'Not published yet. The timetable coordinator generates and publishes it.'}</p>

  </div>`;
}

      ${Object.values(KIND).map(k => `<span class="inline-flex items-center gap-1.5"><span class="h-2.5 w-2.5 rounded-sm ${k.dot}"></span>${k.label}</span>`).join('')}
      <span class="inline-flex items-center gap-1.5"><span class="h-2.5 w-2.5 rounded-sm ring-2 ring-red-500"></span>Clash</span>
    </div>
  </div>

  ${isViewer() ? '' : `<div class="no-print mt-4 grid grid-cols-2 gap-3 md:grid-cols-5">
    ${stat('Quality score', m.score + '/100', 'Higher is better')}
    ${stat('Student gaps', m.avg, 'Free periods between classes, per day')}
    ${stat('Labs side by side', m.parPct + '%', 'Lab groups busy together')}
    ${stat('Teacher load', `${m.lmin}–${m.lmax}`, 'Periods a week, lowest–highest')}
    ${stat('Room use', m.roomUse + '%', `${m.classes} of ${m.required} periods placed`)}
  </div>`}
  <p class="no-print mt-3 text-xs text-slate-400">${isViewer() ? `Published by your timetable coordinator on ${g.at.toLocaleDateString([], { dateStyle: 'medium' })}. Every class was checked: no teacher, room or section is double-booked.` : state.live
    ? 'Generated on the Samay server with Google OR-Tools (CP-SAT) and saved only after the clash checker found 0 problems.'
    : 'Demo mode: this page uses a simple in-browser generator. Open Samay from its server to generate with Google OR-Tools (CP-SAT) and save your work.'}</p>`;
}

function editBar(c, g) {
  const bar = (tone, text, buttons) => `<div class="no-print mb-3 flex flex-wrap items-center justify-between gap-2 rounded-lg border px-3 py-2 text-sm ${tone}">
    <span>${text}</span><span class="flex flex-wrap gap-2">${buttons}</span></div>`;
  if (isViewer()) return '';
  if (state.viewing) {
    const v = state.viewing;
    return bar('border-slate-300 bg-slate-100 text-slate-800',
      `<b>Viewing timetable v${v.version}</b> (read-only)${v.outOfDate ? ', made from older data, so it may not match your current teachers, rooms or classes' : ''}.`,
      `${!v.outOfDate ? btn('Make this the latest', `restoreVersion(${v.version})`, 'primary') : ''}${btn('Back to latest', 'backToLatest()')}`);
  }
  if (state.preview) {
    const before = validate(c, g.entries).messages.length, after = validate(c, displayEntries().filter(e => !e.ghost)).messages.length;
    return bar('border-amber-200 bg-amber-50 text-amber-900', `<b>Preview:</b> ${esc(state.preview.text)} Conflicts: ${before} → ${after}. Nothing changes until you apply.`,
      `${btn('Apply change', 'applyPreview()', 'primary', 'check')}${btn('Discard', 'discardPreview()')}`);
  }
  if (!state.sel) return `<p class="no-print mb-3 text-xs text-slate-500">Tip: click a class to move it to a free slot, swap it with another class, or lock it in place before generating again.</p>`;
  const idxs = sessionIdx(g, state.sel.a, state.sel.day), e = g.entries[idxs[0]], last = g.entries[idxs.at(-1)];
  const when = `${e.day} ${pLabel(c, e.period)}${idxs.length > 1 ? '–' + pLabel(c, last.period) : ''}`;
  const locked = isLocked(g, state.sel.a, state.sel.day), n = state.targets.size;
  const text = `<b>${esc(desc(c, e))}</b> · ${when} · ${esc(e.room)}. ` + (locked
    ? 'Locked: it stays here when you generate again. Unlock it to move it.'
    : n ? `${n} free slot${n > 1 ? 's' : ''} shown in green: click one to move it, or click another class to swap.`
        : 'No free slot for it in this view. Click another class to swap, or try the teacher or room view.');
  return bar('border-indigo-200 bg-indigo-50 text-indigo-900', text,
    `${A(c)[state.sel.a].elective ? '' : btn(locked ? 'Unlock' : 'Lock in place', 'toggleLock()', 'secondary', 'lock')}${btn('Cancel', 'cancelSel()')}`);
}

function grid(c, entries, bad) {
  const ix = idx(c), S = c.scheme;
  const at = (d, p) => entries.filter(e => e.day === d && e.period === p && inView(c, e));
  const sig = items => items.map(e => `${e.a}@${e.room}${e.preview ? 'p' : ''}${e.ghost ? 'g' : ''}`).sort().join(',');
  let head = '<th class="w-14"></th>';
  ix.P.forEach(p => {
    const [l, s, e] = S.periods[p - 1];
    head += `<th class="px-1 pb-1 text-left font-normal"><div class="text-xs font-semibold text-slate-700">${l}</div><div class="text-[10px] text-slate-400">${s}–${e}</div></th>`;
    if (ix.breaksAfter.has(p) && p < ix.P.length) head += `<th class="w-7"></th>`;
  });
  const rows = S.days.map(d => {
    let html = `<th class="pr-2 text-left align-middle text-sm font-semibold text-slate-700">${d}</th>`;
    let p = 1;
    while (p <= ix.P.length) {
      const items = at(d, p), s = sig(items);
      let span = 1;
      while (s && p + span <= ix.P.length && !ix.breaksAfter.has(p + span - 1) && sig(at(d, p + span)) === s) span++;
      html += `<td colspan="${span}" class="align-top">${cell(c, items, bad, d, p)}</td>`;
      const last = p + span - 1;
      if (ix.breaksAfter.has(last) && last < ix.P.length) {
        const b = ix.breaksAfter.get(last);
        html += d === S.days[0]
          ? `<td rowspan="${S.days.length}" class="rounded-md bg-slate-100 align-middle"><div class="vtext mx-auto text-[10px] font-medium uppercase tracking-wider text-slate-400">${b.label} · ${b.time}</div></td>`
          : '';
      }
      p = last + 1;
    }
    return `<tr>${html}</tr>`;
  }).join('');
  return `<table class="w-full min-w-[760px] table-fixed border-separate border-spacing-1"><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table>`;
}

function inView(c, e) {
  const a = A(c)[e.a], ix = idx(c);
  if (state.view === 'section') return secsOf(c, a.group).includes(state.key);
  if (state.view === 'teacher') return a.teacher === state.key;
  return e.room === state.key;
}

const moveHere = (d, p, tall = true) => `<button onclick="moveTo('${d}', ${p})" class="flex ${tall ? 'h-[60px]' : 'py-1'} w-full items-center justify-center rounded-lg border-2 border-dashed border-emerald-400 bg-emerald-50 text-[11px] font-medium text-emerald-700 hover:bg-emerald-100">Move here</button>`;

function cell(c, items, bad, d, p) {
  const ix = idx(c), kept = state.view === 'section' && ix.reservedAt.get(key(state.key, d, p));
  if (kept) return `<div class="space-y-1"><div class="flex h-[60px] flex-col justify-center rounded-lg border border-dashed border-slate-300 bg-slate-100 px-2 text-[11px] text-slate-500" title="Kept free: ${esc(kept)}">
    <span class="truncate font-medium text-slate-600">${esc(kept)}</span><span>Kept free</span></div>${items.map(e => block(c, e, bad)).join('')}</div>`;
  return cellInner(c, items, bad, d, p);
}
function cellInner(c, items, bad, d, p) {
  const ix = idx(c), target = state.targets?.has(`${d}|${p}`);
  const selGroup = state.sel ? A(c)[state.sel.a].group : null;
  if (!items.length) return target ? moveHere(d, p) : `<div class="h-[60px] rounded-lg border border-dashed border-slate-200"></div>`;
  if (state.view === 'section') {
    const subs = ix.subsOf[state.key];
    const whole = items.filter(e => !ix.groups[A(c)[e.a].group].isSub);
    const subItems = items.filter(e => ix.groups[A(c)[e.a].group].isSub);
    if (subItems.length && subs.length) {
      const parts = subs.map(g => {
        const mine = subItems.filter(e => A(c)[e.a].group === g);
        if (!mine.length && target && selGroup === g) return moveHere(d, p, false);
        return mine.length ? mine.map(e => block(c, e, bad)).join('') : `<div class="rounded-md border border-dashed border-slate-200 px-2 py-1 text-[11px] text-slate-400">${ix.groups[g].label} · free</div>`;
      }).join('');
      return `<div class="space-y-1">${whole.map(e => block(c, e, bad)).join('')}${parts}</div>`;
    }
  }
  return `<div class="space-y-1">${items.map(e => block(c, e, bad)).join('')}</div>`;
}

function block(c, e, bad) {
  const ix = idx(c), a = A(c)[e.a], s = subj(c, a), T = ix.teachers[a.teacher], G = ix.groups[a.group];
  const g = current(), selected = state.sel && state.sel.a === e.a && state.sel.day === e.day && !e.ghost && !e.preview;
  const locked = !e.ghost && isLocked(g, e.a, e.day);
  let extra = '';
  if (e.ghost) extra = ' opacity-40';
  else if (e.preview) extra = ' outline outline-2 outline-dashed outline-amber-500 outline-offset-1';
  else if (selected) extra = ' ring-2 ring-indigo-500';
  else if (bad.has(e.i)) extra = ' ring-2 ring-red-500';
  const line2 = state.view === 'section' ? `${T.name} · ${e.room}` : state.view === 'teacher' ? `${G.elective ? ix.electives[G.elective].name : gLabel(c, a.group)} · ${e.room}` : `${G.elective ? ix.electives[G.elective].name : gLabel(c, a.group)} · ${T.name}`;
  const tag = G.elective ? `<span class="mr-1 rounded bg-white/80 px-1 text-[10px] font-semibold" title="${esc(ix.electives[G.elective].name)}">${esc((c.electives || []).find(x => x.id === G.elective)?.id || 'Elective')}</span>`
    : G.isSub && state.view === 'section' ? `<span class="mr-1 rounded bg-white/80 px-1 text-[10px] font-semibold">${G.label}</span>` : '';
  const note = e.preview ? '<span class="text-[10px] font-semibold text-amber-700">New</span>' : e.ghost ? '<span class="text-[10px] font-semibold text-slate-500">Moving</span>'
    : locked ? `<span class="text-slate-500" title="Locked in place">${icon('lock', 'w-3 h-3')}</span>` : '';
  const clickable = g && !e.ghost && !e.preview && !state.preview && !state.viewing && !isViewer();
  return `<div ${clickable ? `onclick="pickSession(${e.a}, '${e.day}')" role="button" tabindex="0"` : ''} class="tt-cell rounded-lg border px-2 py-1.5 ${KIND[s.kind].cls}${extra}${clickable ? ' cursor-pointer hover:brightness-95' : ''}" title="${esc(s.name)} · ${KIND[s.kind].label}${locked ? ' · locked' : ''}">
    <div class="flex items-center justify-between gap-1"><span class="truncate text-[13px] font-semibold ${e.ghost ? 'line-through' : ''}">${tag}${G.elective ? esc(G.label) : s.short}</span>${note}</div>
    <div class="truncate text-[11px] opacity-75">${line2}</div></div>`;
}

function drawer() {

    const v = validate(c, g.entries);
    if (state.preview) {

        <div class="rounded-lg border border-amber-200 bg-amber-50 p-3 text-sm text-amber-900">Conflicts: ${v.messages.length} → ${after.messages.length}. Nothing is saved until you apply.</div>

        <div class="text-xs font-medium uppercase tracking-wide text-slate-400">Try asking</div>
        <div class="flex flex-wrap gap-2">${[c.teachers[0] && `${esc(c.teachers[0].name)} is absent on Monday`, `Find free rooms on ${c.scheme.days.at(-1)} P3`,
          Object.values(c.subjects)[0] && c.sections[0] && `Move ${esc(Object.values(c.subjects)[0].short)} of ${esc(c.sections[0].id)} off ${c.scheme.days.at(-1)}`,

      <button onclick="toggleDrawer(false)" class="rounded-md p-1 text-slate-500 hover:bg-slate-100" aria-label="Close assistant">${icon('x')}</button>
    </div>
    <div class="flex-1 space-y-3 overflow-y-auto p-4">${body}</div>
    <div class="border-t border-slate-200 p-3">
      ${state.live && state.assistantOn ? `<form onsubmit="sendChat(event)" class="flex gap-2">
        <input id="chat-input" value="${esc(state.chat.draft)}" oninput="state.chat.draft = this.value" maxlength="4000" autocomplete="off" ${state.chat.sending ? 'disabled' : ''}
          placeholder="Ask in plain words…" class="flex-1 rounded-lg border border-slate-200 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 disabled:bg-slate-50"/>
        <button type="submit" ${state.chat.sending ? 'disabled' : ''} class="rounded-lg bg-indigo-600 px-3 text-sm font-medium text-white hover:bg-indigo-700 disabled:opacity-50">Send</button></form>
        <p class="mt-1.5 text-[11px] text-slate-400">AI answers can be wrong. Changes are checked for clashes and saved only when you apply them.</p>`
      : `<div class="flex gap-2"><input disabled placeholder="Ask in plain words (needs the Samay server)" class="flex-1 rounded-lg border border-slate-200 bg-slate-50 px-3 py-2 text-sm"/>
      <button disabled class="rounded-lg bg-slate-200 px-3 text-sm text-slate-500">Send</button></div>`}

const bubble = html => `<div class="rounded-lg bg-slate-50 p-3 text-sm leading-relaxed text-slate-700">${html}</div>`;
// The clashes in the timetable on screen, with up to 3 free slots to move one class to (each opens a preview).
function clashHelp(c, g, v) {
  const ei = state.sim && v.bad.has(state.sim.ei) ? state.sim.ei : [...v.bad][0];
  const opts = freeSlots(c, g.entries, ei, 3);
  return `
    ${bubble(`I found ${v.messages.length} conflict${v.messages.length > 1 ? 's' : ''}:`)}
    <ul class="space-y-1 text-sm">${v.messages.map(m => `<li class="rounded-md bg-red-50 px-3 py-2 text-red-800">${m}</li>`).join('')}</ul>
    ${bubble(`I can move <b>${desc(c, g.entries[ei])}</b> to a free slot. Everyone involved is free there and no other class has to move:`)}
    <div class="space-y-2">${opts.map((o, n) => `
      <div class="flex items-center justify-between gap-2 rounded-lg border border-slate-200 p-3">
        <div class="text-sm"><div class="font-medium">Option ${n + 1}: ${o.day} ${pLabel(c, o.period)}</div><div class="text-xs text-slate-500">Room ${o.room}</div></div>
        ${btn('Preview', `previewOption('${o.day}', ${o.period}, '${o.room}', ${ei})`, 'secondary')}
      </div>`).join('') || '<div class="text-sm text-slate-500">No free slot found. Try freeing a room or changing the teacher.</div>'}</div>`;
}
// "Simulate a clash" is a demo aid: shown in the offline demo and while one-click demo sign-in is on.
const canSimulate = () => !state.live || !!state.demoAccounts?.length;

/* ------------------------------------------------------------------------------------------------
   AI ASSISTANT (live mode, when the server has an Anthropic API key): a chat with Claude, which can
   look at this college's timetable and propose changes. A proposal is shown as the usual preview;
   nothing is saved until the coordinator clicks Apply (saved through /revise, checked again).
------------------------------------------------------------------------------------------------- */
// Plain text from the assistant, shown safely: escaped, with **bold** and line breaks.
const chatText = t => esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>');
function chatBody(c, g) {
  const m = state.chat.messages;
  const ideas = [c.teachers[0] && `${c.teachers[0].name} is absent on ${c.scheme.days[0]}. Which classes need to move?`,
    c.sections[0] && `Show ${c.sections[0].id}'s timetable for ${c.scheme.days.at(-1)}`,
    `Which rooms are free on ${c.scheme.days[2] || c.scheme.days[0]} ${pLabel(c, 3)}?`].filter(Boolean);
  const intro = !m.length ? `${bubble(g ? `Hi! Ask me about ${esc(c.name)}'s timetable in plain words. I can find clashes, free slots and rooms, and suggest changes. I'll always show a preview first; nothing changes until you apply it.`
      : 'Generate a timetable first. Then I can answer questions about it and suggest changes.')}
    ${g ? `<div class="text-xs font-medium uppercase tracking-wide text-slate-400">Try asking</div>
      <div class="flex flex-wrap gap-2">${ideas.map(q => `<button onclick="askChat(${esc(JSON.stringify(q))})" class="rounded-full border border-slate-200 px-3 py-1 text-left text-xs text-slate-600 hover:border-indigo-300 hover:bg-indigo-50">${esc(q)}</button>`).join('')}</div>` : ''}` : '';
  const turns = m.map(x => x.role === 'user'
    ? `<div class="ml-8 rounded-lg bg-indigo-600 p-3 text-sm leading-relaxed text-white">${esc(x.content)}</div>`
    : `<div class="mr-4 rounded-lg ${x.error ? 'bg-red-50 text-red-800' : 'bg-slate-50 text-slate-700'} p-3 text-sm leading-relaxed">${chatText(x.content)}</div>`).join('');
  let preview = '';
  if (g && state.preview) {
    const before = validate(c, g.entries).messages.length, after = validate(c, displayEntries().filter(e => !e.ghost)).messages.length;
    preview = `<div class="rounded-lg border border-amber-200 bg-amber-50 p-3 text-sm text-amber-900"><b>Preview:</b> ${esc(state.preview.text)}
      The changed classes are outlined on the grid. Conflicts: ${before} → ${after}. Nothing is saved until you apply.</div>
      <div class="flex gap-2">${btn('Apply change', 'applyPreview()', 'primary', 'check')}${btn('Discard', 'discardPreview()', 'secondary')}</div>`;
  } else if (state.applied) {
    preview = `<div class="rounded-lg border border-emerald-200 bg-emerald-50 p-3 text-sm text-emerald-800">${esc(state.applied)} Saved with 0 conflicts.</div>
      ${state.history.length ? btn('Undo last change', 'undoLast()', 'secondary') : ''}`;
  }
  // A clash on screen that isn't saved (e.g. from "Simulate a clash") is fixed here: the AI only sees saved timetables.
  const v = g && !state.preview ? validate(c, g.entries) : null;
  const clashes = v?.messages.length ? `${clashHelp(c, g, v)}<div class="border-t border-slate-100 pt-2 text-xs text-slate-400">${state.sim ? "This clash is only on your screen and isn't saved. " : ''}You can also ask me anything below.</div>` : '';
  const thinking = state.chat.sending ? `<div class="mr-4 flex items-center gap-2 rounded-lg bg-slate-50 p-3 text-sm text-slate-500">
    <span class="inline-block h-4 w-4 animate-spin rounded-full border-2 border-indigo-500 border-t-transparent"></span>Looking at your timetable…</div>` : '';
  return clashes + intro + turns + preview + thinking;
}
function askChat(text) { state.chat.draft = text; sendChat(); }
async function sendChat(ev) {
  ev?.preventDefault();
  const ch = state.chat, message = ch.draft.trim();  // the input keeps draft up to date as you type
  if (!message || ch.sending) return;
  const history = ch.messages.filter(x => !x.error).map(({ role, content }) => ({ role, content }));
  ch.messages.push({ role: 'user', content: message });
  Object.assign(ch, { draft: '', sending: true });
  render(); scrollChat();
  try {
    const r = await api('/api/assistant/chat', { method: 'POST', body: { message, history } });
    ch.messages.push({ role: 'assistant', content: r.reply });
    if (r.proposal) showProposal(r.proposal);
  } catch (e) {
    ch.messages.push({ role: 'assistant', content: e.message, error: true });
  }
  ch.sending = false;
  render(); scrollChat();
  document.getElementById('chat-input')?.focus();
}
function scrollChat() {
  const box = document.querySelector('aside .overflow-y-auto');
  if (box) box.scrollTop = box.scrollHeight;
}
// Turn the assistant's proposal into the page's preview (same as a suggestion from the built-in helper).
function showProposal(p) {
  const c = col(), g = current();
  if (!g || g.version !== p.version) {
    state.chat.messages.push({ role: 'assistant', content: 'The timetable changed while I was working on that, so I can\'t show the preview. Please ask again.', error: true });
    return;
  }
  const pos = new Map(allIds(c).map((id, i) => [id, i]));
  const changes = p.changes.map(ch => ({ ei: g.entries.findIndex(e => e.a === pos.get(ch.assignment) && e.day === ch.from_day && e.period === ch.from_period),
                                         day: ch.day, period: ch.period, room: ch.room }));
  if (changes.some(ch => ch.ei < 0)) {
    state.chat.messages.push({ role: 'assistant', content: "That suggestion doesn't match the timetable on your screen. Reload the page and ask again.", error: true });
    return;
  }
  const first = A(c)[g.entries[changes[0].ei].a];
  Object.assign(state, { preview: { changes, text: p.summary || 'Suggested change.' }, applied: null, sel: null, page: 'timetable', viewing: null,
                         view: 'section', key: idx(c).groups[first.group].section });
}

/* ==========================================================================
   DATA ENTRY: add / edit / delete records, and import from Excel or CSV.
   Every save goes through the same checks (validateValues), whether it comes
   from a form or from an imported row.
=========================================================================== */
const esc = v => String(v ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
// College structure: Department → Course → Section (→ lab groups). Teachers and subjects belong to a department,
// but any teacher can teach any department's students (e.g. Applied Sciences teaches Maths to CSE and ECE).
const ENT = {
  departments: { label: 'Departments', one: 'department' },
  courses: { label: 'Courses', one: 'course' },
  sections: { label: 'Sections', one: 'section' },

/* ---- write a checked record into the college (handles renames) ---- */

      const i = old.subs.findIndex(u => a[1] === `${old.id}/${u.label}`);
      if (i >= 0) a[1] = `${record.id}/${record.subs[i].label}`;

    ref == null ? c.teachers.push(record) : (c.teachers[ref] = record);

    ref == null ? c.rooms.push(record) : (c.rooms[ref] = record);
