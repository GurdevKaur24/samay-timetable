  subjects: () => `${ref} ${c.subjects[ref].name}`,
  assignments: () => { const a = c.assignments[ref]; return `${c.subjects[a[0]].short} for ${gLabel(c, a[1])}`; },
  electives: () => c.electives[ref].name,
  reserved: () => c.reserved[ref].name,
}[entity]());

/* ------------------------------------------------------------------------------------------------
   ELECTIVES: students of several sections choose between subjects (e.g. Departmental Elective-I).
   The coordinator types how many students chose each subject; Samay splits a subject into batches of
   at most the college's elective class size (one teacher per batch). While any of its classes runs,
   the group's sections have nothing else; running the options at the same time is preferred.
------------------------------------------------------------------------------------------------- */
const batchCount = (c, o) => o.batches || Math.max(1, Math.ceil((Number(o.students) || 0) / (c.scheme.rules.electiveClassSize || 70)));
function electiveValues(c, ref) {
  const e = ref != null ? c.electives[ref] : null;
  return e ? { code: e.id, name: e.name, sections: [...e.sections], periods: e.periods != null ? String(e.periods) : '',
               options: e.options.map(o => ({ subject: o.subject, students: String(o.students), teachers: [...o.teachers] })) }
           : { code: '', name: '', sections: [], periods: '', options: [{ subject: '', students: '', teachers: [] }] };
}
function eo(i, field, value, rerender) { state.modal.values.options[i][field] = value; if (rerender) render(); }
const batchHint = (c, o) => { const n = batchCount(c, o), size = c.scheme.rules.electiveClassSize || 70;
  return Number(o.students) > 0 ? (n > 1 ? `${o.students} students → <b>${n} batches</b> of up to ${size}. Choose a teacher for each (the same teacher can take more than one).` : 'Fits in one class.') : 'Type how many students chose it.'; };
// Typing a student count redraws the form only when the number of batches (teacher boxes) changes, and keeps the
// cursor in the box; otherwise just the hint updates, so the next click (e.g. on a teacher) isn't lost to a redraw.
function setElectiveStudents(i, value) {
  const c = col(), o = state.modal.values.options[i], before = batchCount(c, o);
  o.students = value;
  if (batchCount(c, o) === before) { const hint = document.querySelector(`[data-batch-hint="${i}"]`); if (hint) hint.innerHTML = batchHint(c, o); return; }
  render();
  const box = document.querySelector(`[data-students="${i}"]`);
  if (box) { box.focus(); const v = box.value; box.value = ''; box.value = v; }
}
function eot(i, k, value) { state.modal.values.options[i].teachers[k] = value; }
function toggleElectiveSection(id) {
  const s = state.modal.values.sections, i = s.indexOf(id);
  i >= 0 ? s.splice(i, 1) : s.push(id);
}
function addElectiveOption() { state.modal.values.options.push({ subject: '', students: '', teachers: [] }); render(); }
function removeElectiveOption(i) { state.modal.values.options.splice(i, 1); render(); }

function electiveForm(c, m) {
  const v = m.values, ix = idx(c), size = c.scheme.rules.electiveClassSize || 70;
  const subjectOpts = [['', 'Choose a subject…'], ...Object.entries(c.subjects).map(([k, s]) => [k, `${k} · ${s.name} (${KIND[s.kind].label})`])];
  const teacherOpts = [['', 'Choose a teacher…'], ...c.teachers.map(t => [t.id, `${t.name} · ${t.dept}`])];
  const sectionsHtml = c.departments.map(d => {
    const list = c.sections.filter(s => s.dept === d.id);
    return list.length ? `<div><div class="mb-1 text-xs font-medium text-slate-500">${esc(d.name)}</div><div class="flex flex-wrap gap-x-4 gap-y-1">${list.map(s => `
      <label class="inline-flex items-center gap-1.5 text-sm"><input type="checkbox" ${v.sections.includes(s.id) ? 'checked' : ''} onchange="toggleElectiveSection('${esc(s.id)}')" class="h-4 w-4 accent-indigo-600"/>${esc(s.id)}${s.sem ? ` <span class="text-xs text-slate-400">Sem ${s.sem}</span>` : ''}</label>`).join('')}</div></div>` : '';
  }).join('');
  const options = v.options.map((o, i) => {

    </div>`;
  }).join('');

    <div class="grid grid-cols-3 gap-3"><div>${fInput(m, 'code', 'Code', { placeholder: 'DE-I' })}</div>
      <div class="col-span-2">${fInput(m, 'name', 'Name', { placeholder: 'Departmental Elective-I' })}</div></div>
    <div><span class="mb-1 block text-sm font-medium text-slate-700">Taken by students of</span>
      <div class="space-y-2 rounded-lg border border-slate-200 p-3">${sectionsHtml || '<p class="text-sm text-slate-500">Add sections first.</p>'}</div>${fieldErr2('sections')}</div>
    <div><span class="mb-1 block text-sm font-medium text-slate-700">Subjects to choose from</span>
      <div class="space-y-2">${options}</div>
      <button onclick="addElectiveOption()" class="mt-2 text-sm font-medium text-indigo-600 hover:underline">+ Add another subject</button>${fieldErr2('options')}</div>
    <div class="grid grid-cols-2 gap-3">${fInput(m, 'periods', 'Periods a week (optional)', { type: 'number', placeholder: String(c.scheme.rules.lecturesPerWeek), hint: 'Leave blank to use the college rule.' })}
      <div class="self-end text-xs text-slate-500">Class size for electives: up to ${size} students (change it in the college scheme).</div></div>`;
}

function validateElective(c, v, ref) {
  const err = {}, code = String(v.code || '').trim().toUpperCase(), name = String(v.name || '').trim();
  if (!/^[A-Z0-9-]{1,16}$/.test(code)) err.code = 'Use up to 16 letters, numbers or "-", like DE-I.';
  else if ((c.electives || []).some((e, i) => i !== ref && e.id.toUpperCase() === code)) err.code = `${code} already exists.`;
  if (!name) err.name = 'Enter a name, like Departmental Elective-I.';
  if (!v.sections.length) err.sections = 'Choose the sections whose students take it.';
  const per = intOrNull(v.periods);
  if (per !== null && !isInt(per, 1, c.scheme.days.length * idx(c).P.length)) err.periods = 'Enter a whole number, or leave blank.';
  const options = [], problems = [], kinds = new Set(), weeks = new Set();
  v.options.forEach((o, i) => {
    const s = c.subjects[o.subject], students = intOrNull(o.students), n = batchCount(c, o);
    if (!s) { problems.push(`Choose a subject for row ${i + 1}.`); return; }
    if (options.some(x => x.subject === o.subject)) problems.push(`${s.short} is listed twice.`);
    if (!isInt(students, 1, 5000)) problems.push(`Enter how many students chose ${s.short}.`);
    const teachers = Array.from({ length: n }, (_, k) => o.teachers[k]);
    if (teachers.some(t => !t)) problems.push(`Choose a teacher for every batch of ${s.short}.`);
    kinds.add(s.kind === 'lab' ? 'lab' : 'class'); weeks.add(weekly(c, o.subject));
    options.push({ subject: o.subject, students, teachers });
  });
  if (!v.options.length) problems.push('Add at least one subject.');
  if (kinds.size > 1) problems.push('Labs and lectures can\'t be mixed. Put lab electives in their own elective group.');
  if (per === null && weeks.size > 1) problems.push('These subjects have different periods a week. They run together, so set the periods a week here.');
  if (kinds.has('lab') && per !== null && per % c.scheme.labBlock) err.periods = `Labs run in blocks of ${c.scheme.labBlock} periods, so use a multiple of ${c.scheme.labBlock}.`;
  if (problems.length) err.options = problems.join(' ');
  return { errors: err, record: Object.keys(err).length ? null : { id: code, name, sections: [...v.sections], options, ...(per !== null ? { periods: per } : {}) } };
}

/* ---- reserved times: periods kept free for some sections ---- */
function reservedValues(c, ref) {
  const r = ref != null ? c.reserved[ref] : null;
  return r ? { code: r.id, name: r.name, sections: [...r.sections], slots: r.slots.map(x => [...x]) } : { code: '', name: '', sections: [], slots: [] };
}
function toggleReservedSlot(day, period) {
  const sl = state.modal.values.slots, i = sl.findIndex(([d, p]) => d === day && p === period);
  i >= 0 ? sl.splice(i, 1) : sl.push([day, period]);
}
function reservedForm(c, m) {
  const v = m.values, ix = idx(c), err = f => m.errors[f] ? `<p class="mt-1 text-xs text-red-600">${esc(m.errors[f])}</p>` : '';
  const on = (d, p) => v.slots.some(([od, op]) => od === d && op === p);
  const sectionsHtml = c.departments.map(d => {
    const list = c.sections.filter(s => s.dept === d.id);
    return list.length ? `<div><div class="mb-1 text-xs font-medium text-slate-500">${esc(d.name)}</div><div class="flex flex-wrap gap-x-4 gap-y-1">${list.map(s => `
      <label class="inline-flex items-center gap-1.5 text-sm"><input type="checkbox" ${v.sections.includes(s.id) ? 'checked' : ''} onchange="toggleElectiveSection('${esc(s.id)}')" class="h-4 w-4 accent-indigo-600"/>${esc(s.id)}</label>`).join('')}</div></div>` : '';
  }).join('');
  return `<p class="text-sm text-slate-500">Use this for classes Samay doesn't schedule, like an open elective another department teaches at fixed times.
      No class of the chosen sections is placed in these periods.</p>
    <div class="grid grid-cols-3 gap-3"><div>${fInput(m, 'code', 'Code', { placeholder: 'OE-II' })}</div>
      <div class="col-span-2">${fInput(m, 'name', 'Kept free for', { placeholder: 'Open Elective-II (other departments)' })}</div></div>
    <div><span class="mb-1 block text-sm font-medium text-slate-700">Sections</span>
      <div class="space-y-2 rounded-lg border border-slate-200 p-3">${sectionsHtml || '<p class="text-sm text-slate-500">Add sections first.</p>'}</div>${err('sections')}</div>
    <div><span class="mb-1 block text-sm font-medium text-slate-700">Times</span>
      <div class="overflow-x-auto rounded-lg border border-slate-200 p-2"><table class="text-xs"><thead><tr><th></th>
        ${ix.P.map(p => `<th class="px-1 pb-1 font-medium text-slate-500">${pLabel(c, p)}</th>`).join('')}</tr></thead><tbody>
        ${c.scheme.days.map(d => `<tr><th class="pr-2 text-left font-medium text-slate-600">${d}</th>${ix.P.map(p => `<td class="px-1 text-center">
          <input type="checkbox" ${on(d, p) ? 'checked' : ''} onchange="toggleReservedSlot('${d}', ${p})" class="h-4 w-4 accent-indigo-600" aria-label="${d} ${pLabel(c, p)}"/></td>`).join('')}</tr>`).join('')}
      </tbody></table></div>${err('slots')}</div>`;
}
function validateReserved(c, v, ref) {
  const err = {}, code = String(v.code || '').trim().toUpperCase(), name = String(v.name || '').trim();
  if (!/^[A-Z0-9-]{1,16}$/.test(code)) err.code = 'Use up to 16 letters, numbers or "-", like OE-II.';
  else if ((c.reserved || []).some((r, i) => i !== ref && r.id.toUpperCase() === code)) err.code = `${code} already exists.`;
  if (!name) err.name = 'Say what the time is kept free for.';
  if (!v.sections.length) err.sections = 'Choose at least one section.';
  if (!v.slots.length) err.slots = 'Tick at least one period.';
  return { errors: err, record: Object.keys(err).length ? null : { id: code, name, sections: [...v.sections], slots: v.slots.map(x => [...x]) } };
}

/* ------------------------------------------------------------------------------------------------
   STUDENTS: no accounts. A student enters the college's student code once (or opens its link / QR
   code); the phone remembers it. They see the published timetable of any section, teacher or room.
------------------------------------------------------------------------------------------------- */
const EMPTY_SCHEME = { days: [], periods: [], breaks: [], theory_room_type: 'lecture', lab_block: 2, lab_prefix: 'section',
  rules: { lectures_per_week: 3, lab_sessions_per_week: 1, max_same_subject_per_day: 1, teacher_max_per_day: 5 } };
const storage = {
  get: k => { try { return localStorage.getItem(k); } catch { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch { /* private window: just not remembered */ } },
};

async function loadStudent() {
  const r = await api('/api/student/timetable');
  const empty = { id: 'college', name: r.college.name, scheme: EMPTY_SCHEME, departments: [], courses: [], sections: [], teachers: [], rooms: [], subjects: [], assignments: [] };
  const c = fromServer(r.published ? r.published.data : empty);
  c.name = r.college.name;
  const remembered = storage.get('samay.section');
  Object.assign(state, { role: 'student', me: { name: 'Student', email: '', role_label: 'Student view' }, liveCollege: c, gen: {}, page: 'today',
    studentMode: false, studentError: null, view: 'section', key: null, sel: null, viewing: null, modal: null, drawer: false,
    studentSection: c.sections.some(s => s.id === remembered) ? remembered : c.sections[0]?.id || null });
  if (r.published) {
    const pos = new Map(allIds(c).map((id, i) => [id, i]));
    state.gen[c.id] = { entries: r.published.entries.filter(e => pos.has(e.assignment)).map(e => ({ a: pos.get(e.assignment), day: e.day, period: e.period, room: e.room })),
                        unplaced: [], at: new Date(r.published.published_at * 1000), version: r.published.version, locked: new Set() };
  }
}
async function openStudent(ev, code) {
  ev?.preventDefault();
  code = (code ?? document.getElementById('st-code')?.value ?? '').trim();
  if (!code) { state.studentError = 'Enter the code your college gave you.'; render(); return; }
  Object.assign(state, { signingIn: true, studentError: null }); render();
  try {
    await api('/api/student/open', { method: 'POST', body: { code } });
    storage.set('samay.student', '1');
    await loadStudent();
    state.signingIn = false; render(); toast(`Opened ${col().name}.`);
  } catch (e) {
    Object.assign(state, { signingIn: false, studentMode: true, studentError: e.message }); render();
  }
}
async function leaveStudent() {
  await api('/api/student/leave', { method: 'POST' }).catch(() => {});
  storage.set('samay.student', '');
  Object.assign(state, { liveCollege: null, gen: {}, role: 'coordinator', me: null, studentMode: true, studentError: null, menu: false });
  render();
}
function setStudentSection(id) { state.studentSection = id; storage.set('samay.section', id); render(); }

const backToSignIn = `<p class="mt-4 border-t border-slate-100 pt-4 text-center text-sm text-slate-600">

function forgotPage() {
  const sent = state.forgotSent;
  return authShell('forgot', `<form onsubmit="sendForgot(event)" class="rounded-xl border border-slate-200 bg-white p-6">
    <h1 class="text-lg font-semibold">Forgot your password?</h1>

        : `<p class="mt-3 rounded-lg bg-amber-50 px-3 py-2 text-sm text-amber-900">This site can't send email yet. Ask your timetable coordinator for a reset link:

      : `<p class="mt-1 text-sm text-slate-500">Enter your email and we'll send you a link to choose a new password.</p>
        <label class="mt-4 block"><span class="mb-1 block text-sm font-medium text-slate-700">Email</span>
          <input id="fp-email" type="email" autocomplete="username" value="${esc(state.signinEmail)}" class="${inputCls(false)}"/></label>

        <button type="submit" ${state.signingIn ? 'disabled' : ''} class="mt-4 w-full rounded-lg bg-indigo-600 px-3 py-2 text-sm font-medium text-white hover:bg-indigo-700 disabled:opacity-60">Send reset link</button>
        ${state.emailOn ? '' : '<p class="mt-3 text-xs text-slate-500">If no email arrives, your timetable coordinator can give you a reset link.</p>'}`}

}
async function sendForgot(ev) {
  ev.preventDefault();
  const email = document.getElementById('fp-email').value.trim();

  try { state.forgotSent = await api('/api/auth/forgot', { method: 'POST', body: { email } }); }
  catch (e) { state.signinError = e.message; }
  state.signingIn = false; render();
}
async function openLink(kind, token) {
  try { state.linkPage = { kind, token, info: await api('/api/auth/link', { method: 'POST', body: { token } }) }; }
  catch (e) { state.linkPage = { kind, token, error: e.status === 404 ? e.message : "This link isn't complete. Check that you copied all of it." }; }
}
function linkPage() {
  const L = state.linkPage, invite = L.kind === 'invite';
  if (L.error) return authShell('link', `<div class="rounded-xl border border-slate-200 bg-white p-6">
    <h1 class="text-lg font-semibold">This link doesn't work any more</h1>

  return authShell('link', `<form onsubmit="setPasswordFromLink(event)" class="rounded-xl border border-slate-200 bg-white p-6">

    <p class="mt-1 text-sm text-slate-500">${invite ? `You've been invited to ${esc(L.info.college.name)}'s timetable. Choose a password to sign in.` : `For ${esc(L.info.name)} at ${esc(L.info.college.name)}. You'll be signed out on other devices.`}</p>
    <div class="mt-4 rounded-lg bg-slate-50 px-3 py-2 text-sm"><span class="text-slate-500">Email</span> <span class="font-medium">${esc(L.info.email)}</span></div>
    <label class="mt-3 block"><span class="mb-1 block text-sm font-medium text-slate-700">New password</span>
      <input id="lp-password" type="password" autocomplete="new-password" class="${inputCls(false)}"/></label>
    <label class="mt-3 block"><span class="mb-1 block text-sm font-medium text-slate-700">Type it again</span>

    <p class="mt-1 text-xs text-slate-500">At least 8 characters.</p>
    ${state.signinError ? `<p class="mt-3 rounded-lg bg-red-50 px-3 py-2 text-sm text-red-800">${esc(state.signinError)}</p>` : ''}
    <button type="submit" ${state.signingIn ? 'disabled' : ''} class="mt-4 w-full rounded-lg bg-indigo-600 px-3 py-2 text-sm font-medium text-white hover:bg-indigo-700 disabled:opacity-60">${invite ? 'Set password and sign in' : 'Save new password'}</button>
  </form>`);
}
async function setPasswordFromLink(ev) {
  ev.preventDefault();
  const password = document.getElementById('lp-password').value, again = document.getElementById('lp-again').value;
  const problem = password.length < 8 ? 'Choose a password of at least 8 characters.' : password !== again ? "The two passwords don't match." : null;
  if (problem) { state.signinError = problem; render(); return; }
  Object.assign(state, { signingIn: true, signinError: null }); render();

    await loadSignedIn(me);
    Object.assign(state, { linkPage: null, signingIn: false });
    render(); toast(invite ? `Welcome! You're signed in to ${col().name}.` : 'Password changed. You are signed in.');
  } catch (e) {
    Object.assign(state, { signingIn: false, signinError: e.message }); render();
  }
}

// The classes of one section on one day (whole section, its lab groups and its electives), back-to-back periods merged.
function sectionDay(c, g, sectionId, day) {
  const AS = A(c), list = g.entries.filter(e => e.day === day && secsOf(c, AS[e.a].group).includes(sectionId)).sort((x, y) => x.period - y.period || x.a - y.a);
  const out = [];
  list.forEach(e => {
    const prev = out.find(x => x.a === e.a && x.to === e.period - 1 && x.room === e.room);
    if (prev) prev.to = e.period; else out.push({ a: e.a, from: e.period, to: e.period, room: e.room });
  });
  return out.sort((x, y) => x.from - y.from);
}
function studentToday() {
  const c = col(), g = current(), S = c.scheme, ix = idx(c);
  if (!g) return `<h1 class="mb-4 text-2xl font-semibold tracking-tight">${esc(c.name)}</h1>${card(`<div class="py-10 text-center">
    <div class="text-lg font-medium">No timetable published yet</div><p class="mt-1 text-sm text-slate-500">Your college hasn't published this term's timetable. Check again soon.</p></div>`)}`;
  const sec = state.studentSection && c.sections.some(s => s.id === state.studentSection) ? state.studentSection : c.sections[0]?.id;
  const today = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][new Date().getDay()];
  const has = d => sectionDay(c, g, sec, d).length > 0;
  const day = S.days.includes(today) && has(today) ? today : S.days.find((d, i) => i > S.days.indexOf(today) && has(d)) || S.days.find(has);
  const list = day ? sectionDay(c, g, sec, day) : [];
  const kept = day ? ix.P.filter(p => ix.reservedAt.has(key(sec, day, p))).map(p => ({ p, name: ix.reservedAt.get(key(sec, day, p)) })) : [];
  const heading = !day ? 'No classes this week' : day === today ? `Today · ${today}` : `${S.days.includes(today) ? 'No classes today' : `No classes today (${today})`}. Next: ${day}`;
  const item = x => {
    const a = A(c)[x.a], sj = subj(c, a), G = ix.groups[a.group], from = S.periods[x.from - 1], to = S.periods[x.to - 1];
    const who = G.elective ? `${ix.electives[G.elective].name} · ${G.label}` : G.isSub ? `Lab group ${G.label}` : '';
    return `<li class="flex gap-3 rounded-lg border p-2.5 ${KIND[sj.kind].cls}">
      <div class="w-20 shrink-0 text-xs"><div class="font-semibold">${from[1]}–${to[2]}</div><div class="opacity-75">${esc(from[0])}${x.to > x.from ? '–' + esc(to[0]) : ''}</div></div>

        <div class="truncate text-xs opacity-75">${[who, ix.teachers[a.teacher]?.name, x.room].filter(Boolean).map(esc).join(' · ')}</div></div></li>`;
  };
  return `
  <div class="mb-4"><div class="text-sm text-slate-500">${esc(c.name)}</div>
    <div class="mt-1 flex flex-wrap items-center gap-2"><h1 class="text-2xl font-semibold tracking-tight">My section</h1>
      <select onchange="setStudentSection(this.value)" aria-label="Your section" class="rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">${optionsHtml(sectionOptions(c), sec)}</select></div></div>
  ${card(`<div class="mb-3 font-medium">${heading}</div>
    ${list.length || kept.length ? `<ol class="space-y-2">${list.map(item).join('')}${kept.map(k => `<li class="flex gap-3 rounded-lg border border-dashed border-slate-300 bg-slate-50 p-2.5 text-slate-600">
      <div class="w-20 shrink-0 text-xs font-semibold">${S.periods[k.p - 1][1]}–${S.periods[k.p - 1][2]}</div><div class="text-sm">${esc(k.name)}</div></li>`).join('')}</ol>`
      : '<p class="text-sm text-slate-500">No classes in the published timetable.</p>'}
    <p class="mt-3 text-xs text-slate-500">If you're in a lab group or an elective, follow the classes for your group.</p>`)}

    <span class="text-xs text-slate-500">Published timetable v${g.version}</span></div>
  <div class="overflow-x-auto rounded-xl border border-slate-200 bg-white p-2">${withView('section', sec, () => grid(c, g.entries.map((e, i) => ({ ...e, i })), new Set()))}</div>

}

function drawQrs() {

/* ---- import: Excel (.xlsx) or CSV ---- */
function openImport(entity) { state.modal = { kind: 'import', entity, results: null, file: null }; useBook(entity); render(); }

// One workbook can hold every list (a sheet each). It's remembered while the page is open, and each Data tab picks its
// own sheet by name ("Teachers", "Teaching assignments", ...), so the coordinator imports tab by tab from the same file.
let importBook = null;  // { name, wb }
const sheetKey = x => String(x).toLowerCase().replace(/[^a-z]/g, '');
function bestSheet(entity) {
  const names = importBook.wb.SheetNames, want = [entity, ENT[entity].label, ENT[entity].one].map(sheetKey);
  return names.find(n => want.includes(sheetKey(n)))
    || names.find(n => sheetKey(n).length > 3 && want.some(w => sheetKey(n).includes(w) || w.includes(sheetKey(n))))
    || (names.length === 1 ? names[0] : null);
}
function useBook(entity) {
  if (!importBook || !COLUMNS[entity]) return;
  const sheet = bestSheet(entity);
  if (sheet) loadSheet(sheet); else Object.assign(state.modal, { file: importBook.name, sheet: null, results: null });
}
function loadSheet(sheet) {
  const rows = XLSX.utils.sheet_to_json(importBook.wb.Sheets[sheet], { defval: '', raw: false });
  Object.assign(state.modal, { file: importBook.name, sheet, fileError: null });
  checkImportRows(rows);
}

function downloadTemplate(entity) {
  const c = col(), cols = COLUMNS[entity];
  const rows = [cols.map(([h]) => h), ...exampleRows(c, entity).slice(0, 2).map(r => cols.map(([h]) => r[h] ?? ''))];
  const name = `samay-${entity}-template`;
  if (window.XLSX) {
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), ENT[entity].label.slice(0, 31));
    XLSX.writeFile(wb, `${name}.xlsx`);
  } else {
    const csv = rows.map(r => r.map(x => `"${String(x).replace(/"/g, '""')}"`).join(',')).join('\n');
    const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(new Blob([csv], { type: 'text/csv' })), download: `${name}.csv` });
    a.click();
  }
  toast('Template downloaded. Fill it in, then upload it here.');
}

function parseCsv(text) {
  const rows = [], re = /("([^"]|"")*"|[^,\r\n]*)(,|\r?\n|$)/g;
  let row = [], m;
  while ((m = re.exec(text)) && m[0] !== '') {
    row.push(m[1].startsWith('"') ? m[1].slice(1, -1).replace(/""/g, '"') : m[1]);
    if (m[3] !== ',') { rows.push(row); row = []; }
  }
  const [head = [], ...body] = rows.filter(r => r.some(x => x.trim() !== ''));
  return body.map(r => Object.fromEntries(head.map((h, i) => [h, r[i] ?? ''])));
}

async function readImport(file) {
  if (!file) return;
  let rows;
  try {
    if (window.XLSX && !/\.csv$/i.test(file.name)) {
      importBook = { name: file.name, wb: XLSX.read(await file.arrayBuffer()) };
      useBook(state.modal.entity);
      render();
      return;
    }
    rows = window.XLSX ? XLSX.utils.sheet_to_json((wb => wb.Sheets[wb.SheetNames[0]])(XLSX.read(await file.arrayBuffer())), { defval: '', raw: false })
      : parseCsv(await file.text());
  } catch (e) {
    state.modal.results = null; state.modal.fileError = 'This file couldn\'t be read. Save it as .xlsx or .csv and try again.'; render(); return;
  }
  importBook = null;
  state.modal.file = file.name; state.modal.fileError = null; state.modal.sheet = null;
  checkImportRows(rows);
}

// Turns spreadsheet text into form values: accepts names as well as codes ("Dr. A. Kumar", "Computer lab", "CSE-3A A1").
function normalizeRow(c, entity, raw) {
  const ix = idx(c), get = h => {
    const k = Object.keys(raw).find(x => x.trim().toLowerCase() === h.toLowerCase());
    return k ? String(raw[k]).trim() : '';
  };
  const v = {};
  COLUMNS[entity].forEach(([h, f]) => v[f] = get(h));
  const dept = x => c.departments.find(d => d.id.toLowerCase() === x.toLowerCase() || d.name.toLowerCase() === x.toLowerCase())?.id ?? x;
  if ('dept' in v) v.dept = /^(common|all|shared)$/i.test(v.dept) ? '' : dept(v.dept);
  if (entity === 'departments') v.code = v.code.toUpperCase();
  if (entity === 'courses' && v.years === '') v.years = '4';
  if (entity === 'sections') {
    const x = (c.courses || []).find(o => o.id.toLowerCase() === v.course.toLowerCase() || o.name.toLowerCase() === v.course.toLowerCase());
    if (x) v.course = x.id;
  }
  if (entity === 'rooms') {
    v.type = roomTypes(c).find(t => t === v.type || typeName(t).toLowerCase() === v.type.toLowerCase()) ?? v.type;
    v.owner = !v.owner || v.owner.toLowerCase() === 'shared' ? 'Shared' : dept(v.owner);
  }
  if (entity === 'sections' && v.groups === '') v.groups = '0';
  if (entity === 'teachers') {
    if (v.max === '') v.max = String(c.scheme.rules.teacherMaxPerDay);
    const text = v.off;
    v.off = [];
    text.split(/[;,]/).map(x => x.trim()).filter(Boolean).forEach(part => {
      const m = part.match(/^(\w{3})\w*\s*P?(\d+)(?:\s*[-–]\s*P?(\d+))?$/i);
      const day = m && c.scheme.days.find(d => d.toLowerCase() === m[1].toLowerCase());
      if (!m || !day) { v.offError = `Can't read "${part}". Write it like "Mon P1; Wed P5-P7".`; return; }
      for (let p = +m[2]; p <= +(m[3] || m[2]); p++) {
        if (!ix.P.includes(p)) { v.offError = `There is no period P${p}.`; return; }
        v.off.push([day, p]);
      }
    });
  }
  if (entity === 'subjects') {
    const k = v.kind.toLowerCase();
    v.kind = k === 'lecture' || k === 'theory' ? 'theory' : k === 'tutorial' ? 'tutorial' : k === 'lab' || k === 'practical' ? 'lab' : v.kind;
    v.room = labRoomTypes(c).find(t => t === v.room || typeName(t).toLowerCase() === v.room.toLowerCase()) ?? v.room;
  }
  if (entity === 'assignments') {
    v.subject = v.subject.toUpperCase();
    const g = v.group.replace(/\s+/g, ' ');
    v.group = Object.keys(ix.groups).find(id => id.toLowerCase() === g.toLowerCase() || gLabel(c, id).toLowerCase() === g.toLowerCase()) ?? v.group;
    v.teacher = c.teachers.find(t => t.name.toLowerCase() === v.teacher.toLowerCase() || t.id.toLowerCase() === v.teacher.toLowerCase())?.id ?? v.teacher;
  }
  return v;
}

// Which list a sheet's column headings fit best: stops e.g. a Subjects sheet being imported as Departments.
function listForColumns(rows) {
  const heads = new Set(Object.keys(rows[0] || {}).map(h => h.trim().toLowerCase()));
  const score = e => COLUMNS[e].filter(([h]) => heads.has(h.toLowerCase())).length / COLUMNS[e].length;
  return Object.keys(COLUMNS).reduce((best, e) => (score(e) > score(best) ? e : best));
}
function checkImportRows(rows) {
  const c = col(), m = state.modal, seen = new Set();
  const fits = rows.length ? listForColumns(rows) : m.entity;
  m.mismatch = fits !== m.entity ? fits : null;
  if (m.mismatch) { m.results = null; render(); return; }
  m.results = rows.map((raw, i) => {
    const values = normalizeRow(c, m.entity, raw);
    const { errors, record } = validateValues(c, m.entity, values, null, seen);
    if (record) { seen.add(uniqueKey(m.entity, record)); if (record.email) seen.add(`email:${record.email}`); }
    return { row: i + 2, raw, record, errors: Object.values(errors) };
  });
  render();
}

      { 'Subject code': Object.keys(c.subjects).find(k => c.subjects[k].kind === 'tutorial') || sub0[0], 'Taught to': sLast.id, Teacher: tLast.name, 'Periods per week': '' },
      { 'Subject code': sub0[0], 'Taught to': s0.id, Teacher: t0.name, 'Periods per week': '' },
      { 'Subject code': Object.keys(c.subjects).find(k => c.subjects[k].kind === 'lab'), 'Taught to': labGroup ? labGroup.id : s0.id, Teacher: t0.name, 'Periods per week': '' },
      { 'Subject code': sub0[0], 'Taught to': s0.id, Teacher: 'Dr. Nobody', 'Periods per week': '' },
    ],
  }[entity];
}
function tryExample() { state.modal.file = 'Example rows'; checkImportRows(exampleRows(col(), state.modal.entity)); }

function commitImport() {
  const c = col(), m = state.modal, good = m.results.filter(r => r.record);
  // Teachers get their codes (T1, T2 …) now, one by one: while checking the rows, each row was given the same next code.
  if (m.entity === 'teachers') {
    const used = new Set(c.teachers.map(t => t.id));
    good.forEach(r => { let n = c.teachers.length + 1; while (used.has(`T${n}`)) n++; r.record = { ...r.record, id: `T${n}` }; used.add(`T${n}`); });
  }
  good.forEach(r => saveRecord(c, m.entity, r.record, null));
  const skipped = m.results.length - good.length;
  dataChanged(c, `Imported ${good.length} ${good.length === 1 ? ENT[m.entity].one : ENT[m.entity].label.toLowerCase()}${skipped ? `, skipped ${skipped} row(s) with problems` : ''}.`);
}

/* ---- modal rendering ---- */
const fieldErr = (m, f) => m.errors?.[f] ? `<p class="mt-1 text-xs text-red-600">${esc(m.errors[f])}</p>` : '';
const inputCls = bad => `w-full rounded-lg border ${bad ? 'border-red-400' : 'border-slate-200'} bg-white px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500`;
function fInput(m, f, label, { type = 'text', placeholder = '', hint = '' } = {}) {
  return `<label class="block"><span class="mb-1 block text-sm font-medium text-slate-700">${label}</span>
    <input type="${type}" value="${esc(m.values[f])}" placeholder="${esc(placeholder)}" oninput="mv('${f}', this.value)" class="${inputCls(m.errors?.[f])}"/>
    ${hint ? `<p class="mt-1 text-xs text-slate-500">${hint}</p>` : ''}${fieldErr(m, f)}</label>`;
}
// Options are [value, label] pairs, or { group, items } for a labelled group (shown as <optgroup>).
function optionsHtml(options, selected) {
  const one = ([v, l]) => `<option value="${esc(v)}" ${String(v) === String(selected) ? 'selected' : ''}>${esc(l)}</option>`;
  return options.map(o => o.group ? `<optgroup label="${esc(o.group)}">${o.items.map(one).join('')}</optgroup>` : one(o)).join('');
}
function fSelect(m, f, label, options, { rerender = false, hint = '' } = {}) {
  return `<label class="block"><span class="mb-1 block text-sm font-medium text-slate-700">${label}</span>
    <select onchange="mv('${f}', this.value, ${rerender})" class="${inputCls(m.errors?.[f])}">
      ${m.values[f] === '' ? '<option value="" selected disabled>Choose…</option>' : ''}
      ${optionsHtml(options, m.values[f])}
    </select>${hint ? `<p class="mt-1 text-xs text-slate-500">${hint}</p>` : ''}${fieldErr(m, f)}</label>`;
}
// Grouped pickers: sections by department and course, lab groups by section, teachers by department.
function sectionOptions(c, keep = () => true) {
  const out = [];
  c.departments.forEach(d => {
    const mine = c.sections.filter(s => s.dept === d.id && keep(s));
    const byCourse = {};
    mine.forEach(s => (byCourse[s.course || ''] ||= []).push(s));
    Object.entries(byCourse).forEach(([cid, list]) => out.push({
      group: `${d.id} · ${courseOf(c, cid)?.name || 'No course'}`,
      items: list.sort((a, b) => (a.sem ?? 0) - (b.sem ?? 0) || a.id.localeCompare(b.id)).map(s => [s.id, s.sem ? `${s.id} (Sem ${s.sem})` : s.id]),
    }));
  });
  return out;
}
function labGroupOptions(c, keep = () => true) {
  const ix = idx(c);
  return c.sections.filter(s => ix.subsOf[s.id].length && keep(s)).map(s => ({ group: `${s.dept} · ${s.id}`, items: ix.subsOf[s.id].map(g => [g, gLabel(c, g)]) }));
}
function teacherOptions(c, firstDept) {
  const order = [...c.departments].sort((a, b) => (b.id === firstDept) - (a.id === firstDept));
  return order.map(d => ({
    group: `${d.name}${firstDept && d.id !== firstDept ? ' (guest)' : ''}`,
    items: c.teachers.filter(t => t.dept === d.id).map(t => [t.id, t.name]),
  })).filter(g => g.items.length);
}

      <div class="grid grid-cols-2 gap-3">

    ${guestNote}
    ${s ? fInput(m, 'periods', 'Periods a week', { type: 'number', placeholder: `Default: ${def}`, hint: `Leave blank to use ${def} (from the ${s.perWeek != null ? 'subject' : 'college rule'}).` }) : ''}`;
}

/* ---- the Data page ---- */
function dataPage() {
  const c = col(), g = current(), ix = idx(c);
  const tab = state.dataTab || 'departments';
  const load = {};
  A(c).forEach(a => load[a.teacher] = (load[a.teacher] || 0) + a.periods);
  const use = {};
  if (g) g.entries.forEach(e => use[e.room] = (use[e.room] || 0) + 1);
  const slots = c.scheme.days.length * ix.P.length;
  const th = h => `<th class="px-3 py-2 text-left text-xs font-medium text-slate-500">${h}</th>`;
  const td = (v, cls = '') => `<td class="px-3 py-2 text-sm ${cls}">${v}</td>`;
  const actions = ref => !editable(ref) ? `<td class="whitespace-nowrap px-3 py-2 text-right text-xs text-slate-400" title="Belongs to another department">View only</td>` : `<td class="whitespace-nowrap px-3 py-2 text-right text-sm">
    <button onclick="openForm('${tab}', ${JSON.stringify(ref).replace(/"/g, '&quot;')})" class="rounded-md px-2 py-1 font-medium text-indigo-600 hover:bg-indigo-50">Edit</button>
    <button onclick="askDelete('${tab}', ${JSON.stringify(ref).replace(/"/g, '&quot;')})" class="rounded-md px-2 py-1 text-slate-500 hover:bg-red-50 hover:text-red-700">Delete</button></td>`;
  const f = isHod() ? state.me.dept : state.deptFilter && state.deptFilter !== 'all' && c.departments.some(d => d.id === state.deptFilter) ? state.deptFilter : null;
  if (isHod() && ['departments', 'rooms', 'electives', 'reserved'].includes(tab)) { state.dataTab = 'courses'; return dataPage(); }
  const editable = ref => !isHod() || canHodEdit(c, tab, ref);
  const courses = c.courses || [];

  // Who teaches whom across departments.
  const teachesIn = {}, guestOut = {}, guestIn = {};
  A(c).forEach(a => {
    const sd = groupDept(c, a.group), td_ = ix.teachers[a.teacher].dept;
    (teachesIn[a.teacher] ||= new Set()).add(sd);

/* ==========================================================================
   SCHEME EDITOR: each college sets its own week (days, periods, breaks) and
   rules. Saving re-checks existing data against the new scheme.
=========================================================================== */
const ALL_DAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
const BREAK_NAMES = ['Lunch', 'Tea', 'Short break', 'Assembly'];
const toMin = t => { const m = /^([01]?\d|2[0-3]):([0-5]\d)$/.exec(String(t || '')); return m ? +m[1] * 60 + +m[2] : null; };
const toTime = n => `${String(Math.floor(n / 60) % 24).padStart(2, '0')}:${String(n % 60).padStart(2, '0')}`;
function labGroupsText(c) {
  const s = c.sections.find(x => x.subs.length);
  if (!s) return 'None';
  const counts = [...new Set(c.sections.map(x => x.subs.length).filter(Boolean))];
  return `${s.subs.map(u => u.label).join(', ')} (${counts.join(' or ')} per section)`;
}

function openScheme() {
  const S = col().scheme;
  state.modal = {
    kind: 'scheme', errors: {},
    values: {
      days: [...S.days],
      // The day from first to last: class periods and breaks, each with its own times (kind '' = a class period).
      slots: S.periods.flatMap(([, start, end], i) => {
        const b = S.breaks.find(x => x.after === i + 1);
        return b && S.periods[i + 1] ? [{ start, end, kind: '' }, { start: end, end: S.periods[i + 1][1], kind: b.label }] : [{ start, end, kind: '' }];
      }),
      lecturesPerWeek: String(S.rules.lecturesPerWeek), labSessionsPerWeek: String(S.rules.labSessionsPerWeek),
      labBlock: String(S.labBlock), maxSame: String(S.rules.maxSameSubjectPerDay), teacherMax: String(S.rules.teacherMaxPerDay),
      electiveSize: String(S.rules.electiveClassSize || 70),
      theoryRoomType: S.theoryRoomType, labNaming: S.labPrefix === 'section' ? 'section' : 'prefix', labPrefix: S.labPrefix === 'section' ? 'G' : S.labPrefix,
    },
  };
  render();
}
function sv(field, value, rerender) { state.modal.values[field] = value; if (rerender) render(); }
function pv(i, field, value, rerender) {
  const sl = state.modal.values.slots, old = sl[i][field];
  sl[i][field] = value;
  // Keep the day continuous: moving a slot's end moves the next slot's start (if they were touching).
  if (field === 'end' && sl[i + 1] && sl[i + 1].start === old) { sl[i + 1].start = value; rerender = true; }
  if (rerender) render();
}
function toggleDay(d) {
  const days = state.modal.values.days, i = days.indexOf(d);
  i >= 0 ? days.splice(i, 1) : days.push(d);
}
function addPeriod() {
  const sl = state.modal.values.slots, last = sl.filter(x => !x.kind).at(-1), end = sl.at(-1);
  const len = last ? (toMin(last.end) ?? 0) - (toMin(last.start) ?? 0) || 50 : 50, start = end ? toMin(end.end) ?? 540 : 540;
  sl.push({ start: toTime(start), end: toTime(start + len), kind: '' });
  render();
}
function removePeriod(i) { state.modal.values.slots.splice(i, 1); render(); }
// Class periods are numbered P1, P2 … in order; breaks don't get a number.
const periodNumbers = sl => { let n = 0; return sl.map(x => x.kind ? null : ++n); };

function checkScheme(c, v) {
  const err = {}, sl = v.slots, ps = sl.filter(x => !x.kind), days = ALL_DAYS.filter(d => v.days.includes(d));
  const n = k => intOrNull(v[k]), nums = periodNumbers(sl);
  const name = i => sl[i].kind ? `${sl[i].kind} (${sl[i].start}–${sl[i].end})` : `P${nums[i]}`;
  if (!days.length) err.days = 'Choose at least one working day.';
  if (!ps.length) err.periods = 'Add at least one class period.';
  sl.forEach((x, i) => {
    const s = toMin(x.start), e = toMin(x.end);
    if (s === null || e === null) err.periods ||= `${name(i)}: enter start and end times.`;
    else if (e <= s) err.periods ||= `${name(i)} must end after it starts.`;
    if (i > 0 && s !== null) {
      const prevEnd = toMin(sl[i - 1].end);
      if (prevEnd !== null && s < prevEnd) err.periods ||= `${name(i)} starts before ${name(i - 1)} ends.`;
      else if (prevEnd !== null && s > prevEnd) err.periods ||= `There's a gap between ${name(i - 1)} and ${name(i)} (${sl[i - 1].end}–${x.start}). Add a row for it (for example Lunch), or close the gap.`;
      if (x.kind && sl[i - 1].kind) err.periods ||= `${sl[i - 1].kind} and ${x.kind} are next to each other. Make them one break.`;
    }
  });
  if (sl.length && sl[0].kind) err.periods ||= 'The day starts with a class period, not a break. Remove the first break or move its time.';
  if (sl.length && sl.at(-1).kind) err.periods ||= 'The day ends with a class period, not a break.';

  const maxSame = n('maxSame'), lectures = n('lecturesPerWeek'), labSessions = n('labSessionsPerWeek'), block = n('labBlock'), tmax = n('teacherMax');
  if (!isInt(maxSame, 1, 4)) err.maxSame = 'Enter 1–4.';
  const weekCap = days.length * (maxSame || 1);
  if (!isInt(lectures, 1, Math.max(1, weekCap))) err.lecturesPerWeek = `Enter 1–${weekCap} (days × same subject per day).`;
  if (!isInt(labSessions, 1, 7)) err.labSessionsPerWeek = 'Enter 1–7.';
  if (!isInt(block, 1, Math.max(1, ps.length))) err.labBlock = `Enter 1–${ps.length || 1} periods.`;
  if (!isInt(tmax, 1, Math.max(1, ps.length))) err.teacherMax = `Enter 1–${ps.length || 1} periods.`;
  if (v.labNaming === 'prefix' && !/^[A-Za-z]{1,3}$/.test(String(v.labPrefix || '').trim())) err.labPrefix = 'Use 1–3 letters, like G or L.';
  if (!isInt(n('electiveSize'), 1, 1000)) err.electiveSize = 'Enter how many students fit in one elective class, like 70.';

  // Existing data must still fit the new scheme.
  if (!err.maxSame) {
    const tooMany = Object.entries(c.subjects).filter(([, s]) => s.kind !== 'lab' && s.perWeek > weekCap).map(([k]) => k);
    if (tooMany.length) err.lecturesPerWeek ||= `${tooMany.join(', ')} need more lectures than this week allows (${weekCap}). Change those subjects first.`;
  }
  if (!err.labBlock) {
    const odd = c.assignments.filter(a => c.subjects[a[0]].kind === 'lab' && a[3] != null && a[3] % block).map(a => `${c.subjects[a[0]].short} (${gLabel(c, a[1])})`);
    if (odd.length) err.labBlock = `These labs have ${odd.length > 1 ? 'periods that aren\'t' : 'a period count that isn\'t'} a multiple of ${block}: ${odd.slice(0, 3).join(', ')}${odd.length > 3 ? '…' : ''}.`;
  }
  return { err, days };
}

function saveScheme() {
  const c = col(), v = state.modal.values, { err, days } = checkScheme(c, v);
  if (Object.keys(err).length) { state.modal.errors = err; render(); return; }
  const ps = v.slots.filter(x => !x.kind);
  // Period numbers can change (e.g. an hour becomes lunch), so times that teachers can't teach and reserved times are
  // matched by the clock: old P5 at 13:30 becomes whichever new period starts at 13:30. Times that no longer exist go.
  const newNumber = Object.fromEntries(ps.map((x, i) => [x.start, i + 1]));
  const move = ([d, p]) => { const at = c.scheme.periods[p - 1]?.[1], q = newNumber[at]; return days.includes(d) && q ? [d, q] : null; };
  let dropped = 0;
  c.teachers.forEach(t => {
    if (!t.off) return;
    const keep = t.off.map(move).filter(Boolean);
    dropped += t.off.length - keep.length;
    t.off = keep.length ? keep : undefined;
  });
  (c.reserved || []).forEach(r => { const keep = r.slots.map(move).filter(Boolean); dropped += r.slots.length - keep.length; r.slots = keep; });
  c.reserved = (c.reserved || []).filter(r => r.slots.length);
  c.scheme = {
    ...c.scheme,
    days,
    periods: ps.map((x, i) => [`P${i + 1}`, x.start, x.end]),
    breaks: v.slots.map((x, i) => x.kind ? { after: v.slots.slice(0, i).filter(y => !y.kind).length, label: x.kind, time: `${x.start}–${x.end}` } : null).filter(Boolean),
    theoryRoomType: v.theoryRoomType,
    labBlock: intOrNull(v.labBlock),
    labPrefix: v.labNaming === 'section' ? 'section' : String(v.labPrefix).trim().toUpperCase(),
    rules: {
      ...c.scheme.rules,
      lecturesPerWeek: intOrNull(v.lecturesPerWeek), labSessionsPerWeek: intOrNull(v.labSessionsPerWeek),
      maxSameSubjectPerDay: intOrNull(v.maxSame), teacherMaxPerDay: intOrNull(v.teacherMax), electiveClassSize: intOrNull(v.electiveSize),
    },
  };
  dataChanged(c, `Scheme saved.${dropped ? ` ${dropped} unavailable or reserved time(s) on removed days or times were cleared.` : ''}`);
}

function schemeForm(c, m) {
  const v = m.values, e = m.errors || {};
  const err = f => e[f] ? `<p class="mt-1 text-xs text-red-600">${esc(e[f])}</p>` : '';
  const num = (f, label, hint) => `<label class="block"><span class="mb-1 block text-sm font-medium text-slate-700">${label}</span>
    <input type="number" value="${esc(v[f])}" oninput="sv('${f}', this.value)" class="${inputCls(e[f])}"/>
    ${hint ? `<p class="mt-1 text-xs text-slate-500">${hint}</p>` : ''}${err(f)}</label>`;
  const section = (title, sub, body) => `<div><div class="text-sm font-semibold text-slate-900">${title}</div><p class="mb-2 text-xs text-slate-500">${sub}</p>${body}</div>`;
  // Rooms for lectures: the usual kinds are always offered (even before any rooms are added), plus the college's own
  // room types, except types its lab subjects need.
  const labNeeds = new Set(Object.values(c.subjects).map(s => s.room).filter(Boolean));
  const theoryTypes = [...new Set([c.scheme.theoryRoomType, 'classroom', 'lecture', 'seminar_hall', ...c.rooms.map(r => r.type)])]
    .filter(t => !labNeeds.has(t) || t === c.scheme.theoryRoomType);

  return `
    <div class="rounded-lg bg-amber-50 p-3 text-xs text-amber-900">Changing the scheme clears the current timetable. Generate again after saving.</div>
    ${section('Working days', 'Days when classes run.', `<div class="flex flex-wrap gap-2">${ALL_DAYS.map(d => `
      <label class="flex cursor-pointer items-center gap-2 rounded-lg border border-slate-200 px-3 py-1.5 text-sm hover:bg-slate-50">
        <input type="checkbox" ${v.days.includes(d) ? 'checked' : ''} onchange="toggleDay('${d}')" class="h-4 w-4 accent-indigo-600"/>${d}</label>`).join('')}</div>${err('days')}`)}
    ${section('Your day', 'One row for each class period or break, from the first to the last. Times are the same every working day; labs never run across a break.', `
      <div class="overflow-x-auto rounded-lg border border-slate-200"><table class="w-full text-sm">
        <thead class="bg-slate-50 text-xs text-slate-500"><tr><th class="px-3 py-2 text-left font-medium">Starts</th><th class="px-3 py-2 text-left font-medium">Ends</th>
          <th class="px-3 py-2 text-left font-medium">What happens</th><th class="px-3 py-2 text-left font-medium">Period</th><th></th></tr></thead>
        <tbody class="divide-y divide-slate-100">${(nums => v.slots.map((x, i) => `<tr class="${x.kind ? 'bg-slate-50' : ''}">
          <td class="px-3 py-1.5"><input type="time" value="${esc(x.start)}" oninput="pv(${i}, 'start', this.value)" class="rounded-md border border-slate-200 px-2 py-1"/></td>
          <td class="px-3 py-1.5"><input type="time" value="${esc(x.end)}" onchange="pv(${i}, 'end', this.value)" class="rounded-md border border-slate-200 px-2 py-1"/></td>
          <td class="px-3 py-1.5"><select onchange="pv(${i}, 'kind', this.value, true)" class="rounded-md border border-slate-200 bg-white px-2 py-1">
              <option value="" ${!x.kind ? 'selected' : ''}>Class period</option>
              ${[...new Set([...BREAK_NAMES, x.kind].filter(Boolean))].map(b => `<option ${b === x.kind ? 'selected' : ''}>${esc(b)}</option>`).join('')}
            </select></td>
          <td class="px-3 py-2 font-medium">${x.kind ? '<span class="text-xs font-normal text-slate-400">break</span>' : `P${nums[i]}`}</td>
          <td class="px-3 py-1.5 text-right">${v.slots.length > 1 ? `<button onclick="removePeriod(${i})" class="rounded-md px-2 py-1 text-xs text-slate-500 hover:bg-red-50 hover:text-red-700">Remove</button>` : ''}</td>
        </tr>`).join(''))(periodNumbers(v.slots))}</tbody></table></div>
      <button onclick="addPeriod()" class="mt-2 text-sm font-medium text-indigo-600 hover:underline">+ Add a time slot</button>
      <p class="mt-1 text-xs text-slate-500">To make an hour a break, change "Class period" to Lunch (or Tea, Short break…). Changing a row's end time moves the next row's start.</p>${err('periods')}`)}
    ${section('Teaching rules', 'Defaults for every subject and teacher. A subject or teacher can still have its own number.', `
      <div class="grid gap-3 sm:grid-cols-3">
        ${num('lecturesPerWeek', 'Lectures per subject a week', 'For example 3.')}
        ${num('maxSame', 'Same subject per day, at most', 'Usually 1, so subjects spread over the week.')}
        ${num('teacherMax', 'Teacher periods a day, at most', 'Default for teachers.')}
        ${num('electiveSize', 'Students in one elective class, at most', 'Bigger electives are split into batches.')}
      </div>`)}
    ${section('Labs', 'How practical classes run.', `
      <div class="grid gap-3 sm:grid-cols-3">
        ${num('labBlock', 'Lab length (periods)', 'Back-to-back periods per lab.')}
        ${num('labSessionsPerWeek', 'Lab sessions a week', 'Per lab subject, per lab group.')}
        <label class="block"><span class="mb-1 block text-sm font-medium text-slate-700">Name new lab groups</span>
          <select onchange="sv('labNaming', this.value, true)" class="${inputCls(false)}">
            <option value="section" ${v.labNaming === 'section' ? 'selected' : ''}>After the section (A1, A2)</option>
            <option value="prefix" ${v.labNaming === 'prefix' ? 'selected' : ''}>With a fixed letter (G1, G2)</option>
          </select>
          ${v.labNaming === 'prefix' ? `<input value="${esc(v.labPrefix)}" oninput="sv('labPrefix', this.value)" placeholder="G" class="mt-2 ${inputCls(e.labPrefix)}"/>${err('labPrefix')}` : ''}
          <p class="mt-1 text-xs text-slate-500">Existing lab groups keep their names.</p></label>
      </div>`)}
    ${section('Rooms', 'Where lectures and tutorials are held. Labs use the lab type set on each subject.', `
      <select onchange="sv('theoryRoomType', this.value)" class="${inputCls(false)} sm:max-w-xs">
        ${theoryTypes.map(t => `<option value="${t}" ${t === v.theoryRoomType ? 'selected' : ''}>${typeName(t)}s</option>`).join('')}
      </select>`)}`;
}

function schemePage() {
  const c = col(), S = c.scheme;
  const rows = [];
  S.periods.forEach(([l, s, e], i) => {
    rows.push(`<tr><td class="px-3 py-2 text-sm font-medium">${l}</td><td class="px-3 py-2 text-sm">${s} – ${e}</td><td class="px-3 py-2 text-sm text-slate-500">Class</td></tr>`);
    const b = S.breaks.find(b => b.after === i + 1);
    if (b) rows.push(`<tr class="bg-slate-50"><td class="px-3 py-2 text-sm font-medium text-slate-500">${b.label}</td><td class="px-3 py-2 text-sm text-slate-500">${b.time}</td><td class="px-3 py-2 text-sm text-slate-400">Break · no classes, labs can't run across it</td></tr>`);
  });
  return `
  <div class="mb-4 flex flex-wrap items-center justify-between gap-3">
    <div><h1 class="text-2xl font-semibold tracking-tight">College scheme</h1>
    <p class="text-sm text-slate-500">How ${c.name} runs its week. Every college sets its own.</p></div>
    ${btn('Edit scheme', 'openScheme()', 'primary', 'sliders')}
  </div>
  <div class="grid gap-4 lg:grid-cols-2">
    ${card(`<div class="mb-3 font-medium">Daily periods</div>
      <div class="mb-3 flex flex-wrap gap-1">${S.days.map(d => `<span class="rounded-md bg-indigo-50 px-2 py-1 text-xs font-medium text-indigo-700">${d}</span>`).join('')}</div>
      <table class="w-full"><tbody class="divide-y divide-slate-100">${rows.join('')}</tbody></table>`)}
    ${card(`<div class="mb-3 font-medium">Rules</div>
      <dl class="divide-y divide-slate-100 text-sm">
        ${[['Lectures per subject', `${S.rules.lecturesPerWeek} a week (a subject can override this)`],
           ['Lab sessions per subject', `${S.rules.labSessionsPerWeek} a week`],
           ['Lab length', `${S.labBlock} back-to-back periods`], ['Lab groups', labGroupsText(c)],
           ['New lab groups named', S.labPrefix === 'section' ? 'After the section (A1, A2…)' : `${esc(S.labPrefix)}1, ${esc(S.labPrefix)}2…`], ['Theory classes in', typeName(S.theoryRoomType) + 's'],
           ['Same subject per day', `At most ${S.rules.maxSameSubjectPerDay}`], ['Teacher default max a day', `${S.rules.teacherMaxPerDay} periods`],
           ['Room types', [...new Set(c.rooms.map(r => typeName(r.type)))].join(', ')]].map(([k, v]) => `<div class="flex justify-between gap-4 py-2"><dt class="text-slate-500">${k}</dt><dd class="text-right font-medium">${v}</dd></div>`).join('')}
      </dl>`)}
  </div>
  ${card(`<div class="flex gap-3"><div class="text-indigo-600">${icon('shield')}</div><div>
    <div class="font-medium">Your scheme, your rules</div>
    <p class="mt-1 text-sm text-slate-500">This scheme belongs to ${c.name} only. The generator and clash checker follow it instead of assuming a fixed week,
    so colleges with different days, periods, breaks or lecture counts all get correct timetables. No other college can see it.</p></div></div>`, 'mt-4')}`;
}

boot();
</script>
</body>
</html>
